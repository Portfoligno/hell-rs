schema_version = 1
state = "review-required"
claim_reviewer_team = "Portfoligno/compatibility-reviewers"
claim_author_team = "Portfoligno/compatibility-authors"
platform_reviewer_team = "Portfoligno/platform-reviewers"
security_reviewer_team = "Portfoligno/security-reviewers"
implementation_reviewer_team = "Portfoligno/implementation-reviewers"
product_reviewer_team = "Portfoligno/product-reviewers"
promotion_approver_team = "Portfoligno/promotion-approvers"
minimum_distinct_people = 2
minimum_review_rationale_bytes = 32
maximum_review_rationale_bytes = 4096
maximum_review_finding_statement_bytes = 4096
