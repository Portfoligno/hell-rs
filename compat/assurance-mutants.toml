schema-version = 1
catalog-id = "release-assurance-v1"
execution-strategy = "baseline-pass-mutant-fail"

[[mutant]]
id = "digest-binding-inverted"
claim = "REL-DIGEST-BINDING"
module = "release-agreement"
source = "crates/hell-ci/src/release/decision.rs"
symbol = "agree"
test-command = ["cargo", "test", "--locked", "-p", "hell-ci", "--features", "mutation-testing", "--test", "assurance_primary_mutations", "matching_decisions_agree", "--", "--exact"]
vectors = ["known-good"]

[[mutant]]
id = "drop-final-cell"
claim = "REL-ADMISSION-LEDGER-COMPLETE"
module = "ledger"
source = "crates/hell-ci/src/conformance/ledger.rs"
symbol = "ConformancePlan::validate"
test-command = ["cargo", "test", "--locked", "-p", "hell-ci", "--features", "mutation-testing", "--test", "assurance_primary_mutations", "final_cell_omission_is_rejected", "--", "--exact"]
vectors = ["missing-cell"]

[[mutant]]
id = "accept-duplicate-cell"
