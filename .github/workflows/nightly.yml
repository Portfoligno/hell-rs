        id: native-stack-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-stack.outputs.stack-root }}
          key: v2-${{ runner.os }}-${{ runner.arch }}-stack-3.11.1-native-oracle-${{ hashFiles('ci-work/oracle-source/stack.yaml', 'ci-work/oracle-source/stack.yaml.lock', 'ci-work/oracle-source/package.yaml', 'ci-work/oracle-source/hell.cabal', 'ci-work/oracle-source/src/**') }}
          restore-keys: |
