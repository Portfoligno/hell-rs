          key: v2-${{ runner.os }}-${{ runner.arch }}-native-oracle-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**') }}-${{ hashFiles('crates/**/*.rs', 'compat/**', 'ci-work/oracle-source/stack.yaml', 'ci-work/oracle-source/stack.yaml.lock', 'ci-work/oracle-source/package.yaml', 'ci-work/oracle-source/hell.cabal', 'ci-work/oracle-source/src/**', '.github/workflows/nightly.yml') }}

  merge-native-evidence:
    name: Merge native oracle evidence / Linux
    needs: [evidence-collection-linux, native-oracle-macos, native-oracle-windows]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || !inputs.require_promotion) }}
    outputs:
      native_artifact_id: ${{ steps.upload-native.outputs.artifact-id }}
      native_artifact_digest: ${{ steps.upload-native.outputs.artifact-digest }}
      native_directory_sha256: ${{ steps.bind-native.outputs.directory_sha256 }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted current merge automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Restore Cargo download cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-
            v2-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Restore merge compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v2-${{ runner.os }}-${{ runner.arch }}-native-merge-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**') }}-${{ hashFiles('crates/**/*.rs', 'compat/**', '.github/workflows/nightly.yml') }}

      - name: Download native macOS evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: native-oracle-macos-arm64
          path: ci-out/native-shards/macos-arm64

      - name: Download Linux evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/native-shards/linux-amd64

      - name: Download native Windows evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: native-oracle-windows-amd64
          path: ci-out/native-shards/windows-amd64

      - name: Build CI driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci

      - name: Install pinned active-review verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - name: Verify and merge native shards
        run: ./target/ci/hell-ci merge-native-shards --input ci-out/native-shards --report ci-out/native-shards/merge-report.json

      - name: Write assurance epoch manifest
        run: ./target/ci/hell-ci evidence-epoch write --output ci-out/native-shards/assurance-epoch.json

      - name: Prepare fail-closed promotion proposal
        run: ./target/ci/hell-ci promotion-proposal --input ci-out/native-shards --output ci-out/native-shards/promotion-proposal.json

      - name: Prepare exact merged artifact public-attestation subject
        run: ./target/ci/hell-ci artifact-acquire prepare-provider-attestation --input ci-out/native-shards --output ci-out/native-shards/provider-attestation-subject.json --artifact native-oracle-merged

      - name: Publish signed merged artifact provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ci-out/native-shards/provider-attestation-subject.json

      - name: Bind exact merged native evidence directory
        id: bind-native
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/native-shards

      - name: Upload merged native evidence
        id: upload-native
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-oracle-merged
          path: ci-out/native-shards
          if-no-files-found: error
          retention-days: 30

      - name: Save Cargo download cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' && hashFiles('Cargo.lock') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}

      - name: Save merge compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' && hashFiles('target/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v2-${{ runner.os }}-${{ runner.arch }}-native-merge-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**') }}-${{ hashFiles('crates/**/*.rs', 'compat/**', '.github/workflows/nightly.yml') }}

  branch-merge-native-evidence:
    name: Unprivileged branch three-platform merge validation
    needs: [branch-evidence-collection-linux, native-oracle-macos, native-oracle-windows]
    if: ${{ always() && github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    permissions:
