        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deny.exe
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: v2-${{ runner.os }}-${{ runner.arch }}-cargo-deny-0.20.2-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}

      - name: Save Stack dependency cache
        if: ${{ always() && steps.native-stack-cache.outcome == 'success' && steps.native-stack-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-stack.outputs.stack-root }}
          key: v2-${{ runner.os }}-${{ runner.arch }}-stack-3.11.1-native-oracle-${{ hashFiles('ci-work/oracle-source/stack.yaml', 'ci-work/oracle-source/stack.yaml.lock', 'ci-work/oracle-source/package.yaml', 'ci-work/oracle-source/hell.cabal', 'ci-work/oracle-source/src/**') }}

      - name: Save Stack build cache
        if: ${{ always() && steps.native-stack-work-cache.outcome == 'success' && steps.native-stack-work-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-work/oracle-source/.stack-work
          key: v2-${{ runner.os }}-${{ runner.arch }}-stack-work-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**') }}-${{ hashFiles('crates/**/*.rs', 'compat/**', 'ci-work/oracle-source/stack.yaml', 'ci-work/oracle-source/stack.yaml.lock', 'ci-work/oracle-source/package.yaml', 'ci-work/oracle-source/hell.cabal', 'ci-work/oracle-source/src/**', '.github/workflows/nightly.yml') }}

      - name: Save native compilation cache
        if: ${{ always() && steps.native-target-cache.outcome == 'success' && steps.native-target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
