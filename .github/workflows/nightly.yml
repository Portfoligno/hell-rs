        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download branch macOS evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: native-oracle-macos-arm64
          path: ci-out/native-shards/macos-arm64
      - name: Download branch Linux evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: nightly-branch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/native-shards/linux-amd64
      - name: Download branch Windows evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: native-oracle-windows-amd64
          path: ci-out/native-shards/windows-amd64
      - name: Build unprivileged branch merge verifier
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Install pinned active-review verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Validate the exact three-platform branch merge without promotion output
        run: ./target/ci/hell-ci merge-native-shards --input ci-out/native-shards --report ci-out/native-shards/merge-report.json

  promotion-gate:
    name: Promotion gate / Linux
    needs: merge-native-evidence
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.require_promotion && inputs.candidate_sha == github.sha }}
    permissions:
      actions: read
      contents: read
    environment: compatibility-promotion
    outputs:
      promotion_record_artifact_id: ${{ steps.final-record.outputs.artifact-id }}
      promotion_record_artifact_digest: ${{ steps.final-record.outputs.artifact-digest }}
      promotion_record_directory_sha256: ${{ steps.bind-final-record.outputs.directory_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted current promotion-gate automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore Cargo download cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-
            v2-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Restore merge compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v2-${{ runner.os }}-${{ runner.arch }}-native-merge-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**') }}-${{ hashFiles('crates/**/*.rs', 'compat/**', '.github/workflows/nightly.yml') }}

      - name: Download merged native evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.proposal_run_id }}
          artifact-ids: ${{ inputs.proposal_artifact_id }}
          path: ci-out/native-shards

      - name: Build CI driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci

      - name: Verify trusted gate and approved-provider workflow source share the exact candidate HEAD
        env:
          TRUSTED_DRIVER_SHA: ${{ github.sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$TRUSTED_DRIVER_SHA"

      - name: Install pinned active-review verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3

      - name: Reverify durable regression signatures and current governance revocations
        run: ./target/ci/hell-ci regression-import verify-committed-structural

      - name: Verify exact approved-proposal provider object
        run: ./target/ci/hell-ci surveillance-ops workflow-verify-approved-source

      - name: Require promotion-ready evidence
        run: ./target/ci/hell-ci promotion-gate --input ci-out/native-shards --proposal ci-out/native-shards/promotion-proposal.json --github-dispatch-inputs --report ci-out/promotion-gate.json

      - name: Generate bounded public compatibility report
        run: ./target/ci/hell-ci compatibility-report --proposal ci-out/native-shards/promotion-proposal.json --output ci-out/compatibility-report.md

      - name: Assemble exact final promotion record
        run: ./target/ci/hell-ci surveillance-ops workflow-final-record

      - name: Bind exact final promotion record directory
        id: bind-final-record
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/promotion-record

      - name: Upload final record for protected durable custody
        id: final-record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-record
          path: ci-out/promotion-record
          if-no-files-found: error
          retention-days: 14

      - name: Upload promotion report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-out/promotion-gate.json
            ci-out/promotion-gate.sha256
            ci-out/compatibility-report.md
            ci-out/compatibility-report.sha256
            ci-out/native-shards/merged-native-shards.json
            ci-out/native-shards/merged-native-shards.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Save Cargo download cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' && hashFiles('Cargo.lock') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}

      - name: Save merge compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' && hashFiles('target/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v2-${{ runner.os }}-${{ runner.arch }}-native-merge-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**') }}-${{ hashFiles('crates/**/*.rs', 'compat/**', '.github/workflows/nightly.yml') }}
