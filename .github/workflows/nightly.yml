          cosign-release: v2.4.3

      - name: Build pinned oracle and run native shard
        run: .\target\ci\hell-ci.exe native-oracle-shard --source ci-work\oracle-source --platform windows-amd64 --dependency-attestation ci-out\dependency-policy.json --report ci-out\shards\windows-amd64\report.json

      - name: Attempt exact reviewed Windows implementation prototypes
        run: .\target\ci\hell-ci.exe divergence-prototype run --input ci-out\shards\windows-amd64 --program compat\divergence-prototypes.json

      - name: Upload native Windows evidence
        if: ${{ always() }}
