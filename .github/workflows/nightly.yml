name: Nightly

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  HELL_SOURCE_COMMIT: ${{ github.sha }}

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Release gates / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore Cargo download cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-
            v2-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Restore compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v2-${{ runner.os }}-${{ runner.arch }}-nightly-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/**') }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-nightly-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-
            v2-${{ runner.os }}-${{ runner.arch }}-verify-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-
            v2-${{ runner.os }}-${{ runner.arch }}-nightly-target-

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check dependency advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check
          arguments: --all-features

      - name: Build CI driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci

      - name: Download content-addressed upstream oracle
        run: curl --fail --location --tlsv1.2 --create-dirs --output target/oracle/hell https://github.com/chrisdone/hell/releases/download/2026-05-29/hell-linux-amd64

      - name: Make upstream oracle executable
        run: chmod +x target/oracle/hell

      - name: Run release and stress gates
        run: ./target/ci/hell-ci nightly --oracle target/oracle/hell --oracle-sha256 5ccc78e62200eb5aea8b9da9161334c61848d0d3e7de2f270929920cfbf357c9 --report ci-out/nightly.json

      - name: Upload nightly report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out
          if-no-files-found: ignore
          retention-days: 30

      - name: Save Cargo download cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' && hashFiles('Cargo.lock') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}

      - name: Save compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' && hashFiles('target/**') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: v2-${{ runner.os }}-${{ runner.arch }}-nightly-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/**') }}

  native-oracle-macos:
    name: Native oracle shard / macOS arm64
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chrisdone/hell
          ref: 8e952cf9de4ab25d7716982a9ca234f9bdcf1bff
          path: target/oracle-source
          fetch-depth: 1
          persist-credentials: false

      - name: Restore Cargo and Stack caches
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.stack
            target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-native-oracle-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'target/oracle-source/stack.yaml.lock', 'target/oracle-source/hell.cabal') }}-${{ hashFiles('crates/**/*.rs', 'compat/**', '.github/workflows/nightly.yml') }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-native-oracle-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'target/oracle-source/stack.yaml.lock', 'target/oracle-source/hell.cabal') }}-
            v2-${{ runner.os }}-${{ runner.arch }}-native-oracle-

      - name: Build CI driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci

      - name: Build pinned oracle and run native shard
        run: ./target/ci/hell-ci native-oracle-shard --source target/oracle-source --platform macos-arm64 --report ci-out/shards/macos-arm64/report.json

      - name: Upload native macOS evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-oracle-macos-arm64
          path: ci-out/shards/macos-arm64
          if-no-files-found: error
          retention-days: 30

      - name: Save Cargo and Stack caches
        if: ${{ always() && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.stack
            target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-native-oracle-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'target/oracle-source/stack.yaml.lock', 'target/oracle-source/hell.cabal') }}-${{ hashFiles('crates/**/*.rs', 'compat/**', '.github/workflows/nightly.yml') }}

  native-oracle-windows:
    name: Native oracle shard / Windows amd64
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out pinned upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chrisdone/hell
          ref: 8e952cf9de4ab25d7716982a9ca234f9bdcf1bff
          path: target/oracle-source
          fetch-depth: 1
          persist-credentials: false

      - name: Restore Cargo and Stack caches
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.stack
            target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-native-oracle-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'target/oracle-source/stack.yaml.lock', 'target/oracle-source/hell.cabal') }}-${{ hashFiles('crates/**/*.rs', 'compat/**', '.github/workflows/nightly.yml') }}
          restore-keys: |
            v2-${{ runner.os }}-${{ runner.arch }}-native-oracle-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'target/oracle-source/stack.yaml.lock', 'target/oracle-source/hell.cabal') }}-
            v2-${{ runner.os }}-${{ runner.arch }}-native-oracle-

      - name: Build CI driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci

      - name: Build pinned oracle and run native shard
        run: .\target\ci\hell-ci.exe native-oracle-shard --source target\oracle-source --platform windows-amd64 --report ci-out\shards\windows-amd64\report.json

      - name: Upload native Windows evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-oracle-windows-amd64
          path: ci-out/shards/windows-amd64
          if-no-files-found: error
          retention-days: 30

      - name: Save Cargo and Stack caches
        if: ${{ always() && steps.native-cache.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.stack
            target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-native-oracle-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'target/oracle-source/stack.yaml.lock', 'target/oracle-source/hell.cabal') }}-${{ hashFiles('crates/**/*.rs', 'compat/**', '.github/workflows/nightly.yml') }}

  merge-native-evidence:
    name: Merge native oracle evidence / Linux
    needs: [release-gates, native-oracle-macos, native-oracle-windows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download native macOS evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: native-oracle-macos-arm64
          path: ci-out/native-shards/macos-arm64

      - name: Download Linux evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/native-shards/linux-amd64

      - name: Download native Windows evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: native-oracle-windows-amd64
          path: ci-out/native-shards/windows-amd64

      - name: Build CI driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci

      - name: Verify and merge native shards
        run: ./target/ci/hell-ci merge-native-shards --input ci-out/native-shards --report ci-out/native-shards/merge-report.json

      - name: Upload merged native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-oracle-merged
          path: ci-out/native-shards
          if-no-files-found: error
          retention-days: 30
