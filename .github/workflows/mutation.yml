name: Exploratory mutation
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
permissions:
  contents: read
concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mutation:
    name: Release-relevant advisory mutation catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact pushed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: '1'
          persist-credentials: 'false'
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mutation-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore mutation compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: mutation-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'deny.toml', 'release-policy.toml', 'spec/**', '.github/**') }}
      - name: Build mutation driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Restore pinned MemCordon downloads
        id: memcordon-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ci-tool-cache/memcordon-downloads-v1
          key: memcordon-v1-linux-x86-64-${{ hashFiles('ci/memcordon-runtime-v1.toml', 'ci/memcordon-tasks-v1.toml') }}
      - name: Acquire pinned MemCordon runtime
        run: ./target/ci/hell-ci memcordon acquire --task ci/memcordon-tasks-v1.toml --operation mutation
      - name: Install and qualify MemCordon provider
        run: ./target/ci/hell-ci memcordon prepare --task ci/memcordon-tasks-v1.toml --operation mutation
      - name: Run MemCordon adoption canary
        run: ./target/ci/hell-ci memcordon canary --task ci/memcordon-tasks-v1.toml --operation mutation
      - name: Render release assurance map
        run: ./target/ci/hell-ci assurance render --map spec/assurance-map.toml --output ci-out/assurance-map.md
      - name: Check release assurance map
        run: ./target/ci/hell-ci assurance check --map spec/assurance-map.toml --repository-root . --output ci-out/assurance-check.json
      - name: Execute source-bound release assurance mutants as one sealed root
        run: ./target/ci/hell-ci memcordon execute --task ci/memcordon-tasks-v1.toml --operation mutation
      - name: Retire MemCordon provider
        if: ${{ always() }}
        run: ./target/ci/hell-ci memcordon cleanup --task ci/memcordon-tasks-v1.toml --operation mutation
      - name: Finalize MemCordon evidence
        if: ${{ always() }}
        run: ./target/ci/hell-ci memcordon finalize --task ci/memcordon-tasks-v1.toml --operation mutation --candidate-commit ${{ github.sha }} --workflow-commit ${{ github.workflow_sha }}
      - name: Upload advisory mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-out/mutation
            ci-out/assurance-check.json
            ci-out/assurance-map.md
            platform-out/memcordon
          if-no-files-found: error
          retention-days: '30'
      - name: Save verified MemCordon downloads
        if: ${{ always() && steps.memcordon-cache.outcome == 'success' && steps.memcordon-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ci-tool-cache/memcordon-downloads-v1
          key: memcordon-v1-linux-x86-64-${{ hashFiles('ci/memcordon-runtime-v1.toml', 'ci/memcordon-tasks-v1.toml') }}
      - name: Save Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: mutation-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save mutation compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: mutation-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'deny.toml', 'release-policy.toml', 'spec/**', '.github/**') }}
