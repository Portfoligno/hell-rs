name: Collection Activation Review

on:
  workflow_dispatch:
    inputs:
      activation_sha:
        required: true
        type: string
      proposal_run_id:
        required: true
        type: string
      proposal_run_attempt:
        required: true
        type: string
      proposal_artifact_id:
        required: true
        type: string
      proposal_directory_sha256:
        required: true
        type: string
      proposal_archive_sha256:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: collection-activation-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  retain-proposal:
    if: ${{ github.ref == 'refs/heads/main' && inputs.activation_sha == github.sha }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload-proposal.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-proposal.outputs.artifact-digest }}
      directory_sha256: ${{ steps.bind-review-subject.outputs.directory_sha256 }}
    steps:
      - name: Check out exact reviewed activation base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.activation_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore proposal verifier Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-retain-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore proposal verifier compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-retain-target-${{ inputs.activation_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-activation.yml') }}
      - name: Build trusted activation verifier
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact activation base checkout
        env:
          COLLECTION_ACTIVATION_SHA: ${{ inputs.activation_sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$COLLECTION_ACTIVATION_SHA"
      - name: Download immutable prepared activation proposal
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.proposal_run_id }}
          artifact-ids: ${{ inputs.proposal_artifact_id }}
          path: ci-in/collection-activation-proposal
      - name: Verify immutable proposal provider and exact directory
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLLECTION_PROPOSAL_ARCHIVE_SHA256: ${{ inputs.proposal_archive_sha256 }}
          COLLECTION_PROPOSAL_ARTIFACT_ID: ${{ inputs.proposal_artifact_id }}
          COLLECTION_PROPOSAL_DIRECTORY_SHA256: ${{ inputs.proposal_directory_sha256 }}
          COLLECTION_PROPOSAL_RUN_ATTEMPT: ${{ inputs.proposal_run_attempt }}
          COLLECTION_PROPOSAL_RUN_ID: ${{ inputs.proposal_run_id }}
        run: ./target/ci/hell-ci collection-authority verify-activation-preparation --input ci-in/collection-activation-proposal --expected-directory-sha256 "$COLLECTION_PROPOSAL_DIRECTORY_SHA256" --expected-archive-sha256 "$COLLECTION_PROPOSAL_ARCHIVE_SHA256" --run-id "$COLLECTION_PROPOSAL_RUN_ID" --run-attempt "$COLLECTION_PROPOSAL_RUN_ATTEMPT" --artifact-id "$COLLECTION_PROPOSAL_ARTIFACT_ID"
      - name: Bind exact sealed activation review subject
        id: bind-review-subject
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/collection-activation-review-subject
      - name: Upload exact current-run activation review subject
        id: upload-proposal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-activation-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/collection-activation-review-subject
          if-no-files-found: error
          retention-days: 14
      - name: Save proposal verifier Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-retain-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save proposal verifier compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-retain-target-${{ inputs.activation_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-activation.yml') }}

  claim-author:
    needs: retain-proposal
    if: ${{ github.ref == 'refs/heads/main' && inputs.activation_sha == github.sha && needs.retain-proposal.result == 'success' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: compatibility-claim-author
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload-review.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-review.outputs.artifact-digest }}
      directory_sha256: ${{ steps.bind-review.outputs.directory_sha256 }}
    steps:
      - name: Check out exact claim author automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.activation_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore claim author Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-author-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore claim author compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-author-target-${{ inputs.activation_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/collection-activation.yml') }}
      - name: Build trusted claim author driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact claim author checkout
        env:
          COLLECTION_ACTIVATION_SHA: ${{ inputs.activation_sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$COLLECTION_ACTIVATION_SHA"
      - name: Download needs-linked exact activation proposal
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.retain-proposal.outputs.artifact_id }}
          path: ci-in/collection-activation-review-subject
      - name: Verify sealed claim author review subject selection
        env:
          WRAPPER_DIRECTORY_SHA256: ${{ needs.retain-proposal.outputs.directory_sha256 }}
        run: ./target/ci/hell-ci collection-authority verify-activation-review-subject --input ci-in/collection-activation-review-subject --expected-directory-sha256 "$WRAPPER_DIRECTORY_SHA256"
      - name: Retain protected claim author authorization
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEW_AUTHORIZATION_GITHUB_TOKEN }}
        run: ./target/ci/hell-ci review-authorization --input ci-in/collection-activation-review-subject/review-subject.json --output ci-out/collection-activation-review/claim-author/authorization.json --role claim-author --category collection-activation-author --github-dispatch-inputs
      - name: Finalize exact claim author packet before credentials
        run: ./target/ci/hell-ci review-packet --input ci-in/collection-activation-review-subject/review-subject.json --from ci-out/collection-activation-review/claim-author/authorization.json --output ci-out/collection-activation-review/claim-author/review-packet.json --role claim-author --category collection-activation-author --decision accept --github-dispatch-inputs
      - name: Install pinned Cosign after claim author packet finalization
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Load protected claim author key after packet finalization
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CLAIM_AUTHOR_SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Sign exact claim author packet
        run: ./target/ci/hell-ci review-sign --input ci-out/collection-activation-review/claim-author/review-packet.json --output ci-out/collection-activation-review/claim-author/review.dsse.json --role claim-author --decision accept --policy ci-out/collection-activation-review/claim-author/reviewer.allowed_signers
      - name: Bind exact sealed claim author package
        id: bind-review
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/collection-activation-review/claim-author
      - name: Upload sealed claim author review package
        id: upload-review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-activation-claim-author-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/collection-activation-review/claim-author
          if-no-files-found: error
          retention-days: 14
      - name: Save claim author Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-author-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save claim author compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-author-target-${{ inputs.activation_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/collection-activation.yml') }}

  claim-reviewer:
    needs: retain-proposal
    if: ${{ github.ref == 'refs/heads/main' && inputs.activation_sha == github.sha && needs.retain-proposal.result == 'success' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: compatibility-claim-review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload-review.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-review.outputs.artifact-digest }}
      directory_sha256: ${{ steps.bind-review.outputs.directory_sha256 }}
    steps:
      - name: Check out exact claim reviewer automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.activation_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore claim reviewer Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-reviewer-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore claim reviewer compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-reviewer-target-${{ inputs.activation_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/collection-activation.yml') }}
      - name: Build trusted claim reviewer driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact claim reviewer checkout
        env:
          COLLECTION_ACTIVATION_SHA: ${{ inputs.activation_sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$COLLECTION_ACTIVATION_SHA"
      - name: Download needs-linked exact activation proposal
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.retain-proposal.outputs.artifact_id }}
          path: ci-in/collection-activation-review-subject
      - name: Verify sealed claim reviewer review subject selection
        env:
          WRAPPER_DIRECTORY_SHA256: ${{ needs.retain-proposal.outputs.directory_sha256 }}
        run: ./target/ci/hell-ci collection-authority verify-activation-review-subject --input ci-in/collection-activation-review-subject --expected-directory-sha256 "$WRAPPER_DIRECTORY_SHA256"
      - name: Retain protected claim reviewer authorization
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEW_AUTHORIZATION_GITHUB_TOKEN }}
        run: ./target/ci/hell-ci review-authorization --input ci-in/collection-activation-review-subject/review-subject.json --output ci-out/collection-activation-review/claim-reviewer/authorization.json --role claim-reviewer --category collection-activation-final --github-dispatch-inputs
      - name: Finalize exact claim reviewer packet before credentials
        run: ./target/ci/hell-ci review-packet --input ci-in/collection-activation-review-subject/review-subject.json --from ci-out/collection-activation-review/claim-reviewer/authorization.json --output ci-out/collection-activation-review/claim-reviewer/review-packet.json --role claim-reviewer --category collection-activation-final --decision accept --github-dispatch-inputs
      - name: Install pinned Cosign after claim reviewer packet finalization
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Load protected claim reviewer key after packet finalization
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CLAIM_REVIEWER_SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Sign exact claim reviewer packet
        run: ./target/ci/hell-ci review-sign --input ci-out/collection-activation-review/claim-reviewer/review-packet.json --output ci-out/collection-activation-review/claim-reviewer/review.dsse.json --role claim-reviewer --decision accept --policy ci-out/collection-activation-review/claim-reviewer/reviewer.allowed_signers
      - name: Bind exact sealed claim reviewer package
        id: bind-review
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/collection-activation-review/claim-reviewer
      - name: Upload sealed claim reviewer package
        id: upload-review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-activation-claim-reviewer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/collection-activation-review/claim-reviewer
          if-no-files-found: error
          retention-days: 14
      - name: Save claim reviewer Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-reviewer-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save claim reviewer compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-reviewer-target-${{ inputs.activation_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/collection-activation.yml') }}

  finalize-commit-ready-tree:
    needs: [retain-proposal, claim-author, claim-reviewer]
    if: ${{ github.ref == 'refs/heads/main' && inputs.activation_sha == github.sha && needs.retain-proposal.result == 'success' && needs.claim-author.result == 'success' && needs.claim-reviewer.result == 'success' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tree_artifact_id: ${{ steps.upload-tree.outputs.artifact-id }}
      tree_artifact_digest: ${{ steps.upload-tree.outputs.artifact-digest }}
      tree_directory_sha256: ${{ steps.bind-tree.outputs.directory_sha256 }}
    steps:
      - name: Check out exact activation finalizer base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.activation_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore activation finalizer Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-finalize-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore activation finalizer compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-finalize-target-${{ inputs.activation_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/collection-activation.yml') }}
      - name: Build trusted activation finalizer
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact activation finalizer checkout
        env:
          COLLECTION_ACTIVATION_SHA: ${{ inputs.activation_sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$COLLECTION_ACTIVATION_SHA"
      - name: Download needs-linked exact activation proposal
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.retain-proposal.outputs.artifact_id }}
          path: ci-in/collection-activation-review-subject
      - name: Verify sealed activation finalizer review subject selection
        env:
          WRAPPER_DIRECTORY_SHA256: ${{ needs.retain-proposal.outputs.directory_sha256 }}
        run: ./target/ci/hell-ci collection-authority verify-activation-review-subject --input ci-in/collection-activation-review-subject --expected-directory-sha256 "$WRAPPER_DIRECTORY_SHA256"
      - name: Download sealed claim author package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.claim-author.outputs.artifact_id }}
          path: ci-in/collection-activation-review/claim-author
      - name: Download sealed claim reviewer package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.claim-reviewer.outputs.artifact_id }}
          path: ci-in/collection-activation-review/claim-reviewer
      - name: Install pinned activation review verifier after exact input validation
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Finalize non-authoritative commit-ready activation tree
        run: ./target/ci/hell-ci collection-authority finalize-activation --input ci-in/collection-activation-review-subject --signature ci-in/collection-activation-review/claim-author --integration-review ci-in/collection-activation-review/claim-reviewer --output ci-out/collection-activation-tree
      - name: Bind exact commit-ready activation tree
        id: bind-tree
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/collection-activation-tree
      - name: Upload exact reviewed activation tree without repository mutation
        id: upload-tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-activation-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/collection-activation-tree
          if-no-files-found: error
          retention-days: 30
      - name: Save activation finalizer Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-activation-finalize-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save activation finalizer compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
