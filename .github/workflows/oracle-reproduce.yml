name: Oracle reproducibility evidence

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        required: true
        type: string
      assurance_epoch_sha256:
        required: true
        type: string

permissions:
  contents: read

jobs:
  primary-build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner-label: macos-arm64
          - platform: windows-amd64
            runner-label: windows-amd64
    runs-on:
      - self-hosted
      - oracle-primary
      - ${{ matrix.runner-label }}
    timeout-minutes: 90
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chrisdone/hell
          ref: 8e952cf9de4ab25d7716982a9ca234f9bdcf1bff
          path: target/oracle-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Stack
        id: setup-stack
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: 3.11.1
      - name: Restore primary Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: oracle-primary-cargo-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore primary Rust target cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: oracle-primary-target-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/oracle-reproduce.yml') }}
      - name: Build assurance driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Build differential process helper
        run: cargo build --locked --profile ci --package hell-testkit --bin hell-test-helper
      - name: Retain candidate dependency attestation
        run: ./target/ci/hell-ci dependency-attestation --output ci-out/dependency-policy.json --report ci-out/dependency-policy-report.json
      - name: Retain exact collection epoch
        run: ./target/ci/hell-ci evidence-epoch write --output ci-out/assurance-epoch.json
      - name: Exercise pinned oracle in macOS compatibility shard
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: ./target/ci/hell-ci native-oracle-shard --source target/oracle-source --platform macos-arm64 --dependency-attestation ci-out/dependency-policy.json --report ci-out/native-shard/report.json
      - name: Exercise pinned oracle in Windows compatibility shard
        if: ${{ matrix.platform == 'windows-amd64' }}
        run: ./target/ci/hell-ci native-oracle-shard --source target/oracle-source --platform windows-amd64 --dependency-attestation ci-out/dependency-policy.json --report ci-out/native-shard/report.json
      - name: Acquire sources and collect pinned offline macOS oracle build
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-primary-build-macos
      - name: Acquire sources and collect pinned offline Windows oracle build
        if: ${{ matrix.platform == 'windows-amd64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-primary-build-windows
      - name: Require complete typed build evidence
        run: ./target/ci/hell-ci oracle-ops verify-build --output ci-out/oracle-primary
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Prepare macOS primary builder signature packet
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-primary-packet-macos
      - name: Prepare Windows primary builder signature packet
        if: ${{ matrix.platform == 'windows-amd64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-primary-packet-windows
      - name: Upload untrusted primary build subject
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-oracle-primary-unsigned-${{ matrix.platform }}
          path: ci-out
          if-no-files-found: error
          retention-days: 14
      - name: Save primary Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: oracle-primary-cargo-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save primary Rust target cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: oracle-primary-target-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/oracle-reproduce.yml') }}

  independent-build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner-label: macos-arm64
          - platform: windows-amd64
            runner-label: windows-amd64
    runs-on:
      - self-hosted
      - oracle-independent
      - ${{ matrix.runner-label }}
    timeout-minutes: 90
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned upstream source independently
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chrisdone/hell
          ref: 8e952cf9de4ab25d7716982a9ca234f9bdcf1bff
          path: target/oracle-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Stack
        id: setup-stack
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: 3.11.1
      - name: Restore independent Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: oracle-independent-cargo-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore independent Rust target cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: oracle-independent-target-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/oracle-reproduce.yml') }}
      - name: Build assurance driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Retain exact collection epoch
        run: ./target/ci/hell-ci evidence-epoch write --output ci-out/assurance-epoch.json
      - name: Independently acquire sources and collect pinned offline macOS oracle build
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-independent-build-macos
      - name: Independently acquire sources and collect pinned offline Windows oracle build
        if: ${{ matrix.platform == 'windows-amd64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-independent-build-windows
      - name: Require complete typed build evidence
        run: ./target/ci/hell-ci oracle-ops verify-build --output ci-out/oracle-independent
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Prepare macOS independent builder signature packet
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-independent-packet-macos
      - name: Prepare Windows independent builder signature packet
        if: ${{ matrix.platform == 'windows-amd64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-independent-packet-windows
      - name: Upload untrusted independent build subject
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-oracle-independent-unsigned-${{ matrix.platform }}
          path: ci-out
          if-no-files-found: error
          retention-days: 14
      - name: Save independent Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: oracle-independent-cargo-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save independent Rust target cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: oracle-independent-target-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/oracle-reproduce.yml') }}

  sign-primary-build:
    needs: primary-build
    if: ${{ github.ref == 'refs/heads/main' && needs.primary-build.result == 'success' }}
    permissions:
      actions: read
      contents: read
    environment: oracle-builder-primary
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, windows-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted current primary signing automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build trusted primary signing driver before loading credentials
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Resolve exact immutable macOS primary unsigned artifact
        if: ${{ matrix.platform == 'macos-arm64' }}
        id: resolve-primary-macos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci oracle-ops workflow-primary-resolve-macos
      - name: Resolve exact immutable Windows primary unsigned artifact
        if: ${{ matrix.platform == 'windows-amd64' }}
        id: resolve-primary-windows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci oracle-ops workflow-primary-resolve-windows
      - name: Download exact untrusted primary build subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ matrix.platform == 'macos-arm64' && steps.resolve-primary-macos.outputs.artifact_id || steps.resolve-primary-windows.outputs.artifact_id }}
          path: ci-out
      - name: Reverify exact macOS primary provider artifact selection
        if: ${{ matrix.platform == 'macos-arm64' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORACLE_UNSIGNED_ARTIFACT_ID: ${{ steps.resolve-primary-macos.outputs.artifact_id }}
        run: ./target/ci/hell-ci oracle-ops workflow-primary-select-macos
      - name: Reverify exact Windows primary provider artifact selection
        if: ${{ matrix.platform == 'windows-amd64' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORACLE_UNSIGNED_ARTIFACT_ID: ${{ steps.resolve-primary-windows.outputs.artifact_id }}
        run: ./target/ci/hell-ci oracle-ops workflow-primary-select-windows
      - name: Reverify complete typed primary build evidence
        run: ./target/ci/hell-ci oracle-ops verify-build --output ci-out/oracle-primary
      - name: Recreate exact macOS primary builder packet with trusted automation
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-primary-packet-macos
      - name: Recreate exact Windows primary builder packet with trusted automation
        if: ${{ matrix.platform == 'windows-amd64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-primary-packet-windows
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Load protected primary builder SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_PRIMARY_BUILDER_SSH_PRIVATE_KEY }}
      - name: Sign exact trusted primary builder receipt
        run: ./target/ci/hell-ci review-sign --input ci-out/oracle-primary/builder-packet.json --output ci-out/oracle-primary/builder-receipt.dsse.json --role oracle-builder --decision accept --policy compat/reviews.allowed_signers
      - name: Upload signed primary build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-oracle-primary-${{ matrix.platform }}
          path: ci-out
          if-no-files-found: error
          retention-days: 45

  sign-independent-build:
    needs: independent-build
    if: ${{ github.ref == 'refs/heads/main' && needs.independent-build.result == 'success' }}
    permissions:
      actions: read
      contents: read
    environment: oracle-builder-independent
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, windows-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted current independent signing automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build trusted independent signing driver before loading credentials
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Resolve exact immutable macOS independent unsigned artifact
        if: ${{ matrix.platform == 'macos-arm64' }}
        id: resolve-independent-macos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci oracle-ops workflow-independent-resolve-macos
      - name: Resolve exact immutable Windows independent unsigned artifact
        if: ${{ matrix.platform == 'windows-amd64' }}
        id: resolve-independent-windows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci oracle-ops workflow-independent-resolve-windows
      - name: Download exact untrusted independent build subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ matrix.platform == 'macos-arm64' && steps.resolve-independent-macos.outputs.artifact_id || steps.resolve-independent-windows.outputs.artifact_id }}
          path: ci-out
      - name: Reverify exact macOS independent provider artifact selection
        if: ${{ matrix.platform == 'macos-arm64' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORACLE_UNSIGNED_ARTIFACT_ID: ${{ steps.resolve-independent-macos.outputs.artifact_id }}
        run: ./target/ci/hell-ci oracle-ops workflow-independent-select-macos
      - name: Reverify exact Windows independent provider artifact selection
        if: ${{ matrix.platform == 'windows-amd64' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORACLE_UNSIGNED_ARTIFACT_ID: ${{ steps.resolve-independent-windows.outputs.artifact_id }}
        run: ./target/ci/hell-ci oracle-ops workflow-independent-select-windows
      - name: Reverify complete typed independent build evidence
        run: ./target/ci/hell-ci oracle-ops verify-build --output ci-out/oracle-independent
      - name: Recreate exact macOS independent builder packet with trusted automation
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-independent-packet-macos
      - name: Recreate exact Windows independent builder packet with trusted automation
        if: ${{ matrix.platform == 'windows-amd64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-independent-packet-windows
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Load protected independent builder SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_INDEPENDENT_BUILDER_SSH_PRIVATE_KEY }}
      - name: Sign exact trusted independent builder receipt
        run: ./target/ci/hell-ci review-sign --input ci-out/oracle-independent/builder-packet.json --output ci-out/oracle-independent/builder-receipt.dsse.json --role oracle-builder --decision accept --policy compat/reviews.allowed_signers
      - name: Upload signed independent build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-oracle-independent-${{ matrix.platform }}
          path: ci-out
          if-no-files-found: error
          retention-days: 45

  compare:
    needs: [sign-primary-build, sign-independent-build]
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner-label: macos-arm64
            executable: hell
          - platform: windows-amd64
            runner-label: windows-amd64
            executable: hell.exe
    runs-on:
      - self-hosted
      - oracle-review
      - ${{ matrix.runner-label }}
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned upstream source for gate validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chrisdone/hell
          ref: 8e952cf9de4ab25d7716982a9ca234f9bdcf1bff
          path: ci-out/oracle-source
          fetch-depth: 1
          persist-credentials: false
      - name: Restore comparison build cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: oracle-compare-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/oracle-reproduce.yml') }}
      - name: Download primary build
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          name: ephemeralEvidence-oracle-primary-${{ matrix.platform }}
          path: ci-out/primary
      - name: Download independent build
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          name: ephemeralEvidence-oracle-independent-${{ matrix.platform }}
          path: ci-out/independent-transport
      - name: Build assurance driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Compare independent macOS binaries and bind exercised binary
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-compare-macos
      - name: Compare independent Windows binaries and bind exercised binary
        if: ${{ matrix.platform == 'windows-amd64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-compare-windows
      - name: Prepare macOS platform review packet
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-platform-packet-macos
      - name: Prepare Windows platform review packet
        if: ${{ matrix.platform == 'windows-amd64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-platform-packet-windows
      - name: Upload exact platform review subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-oracle-platform-review-subject-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-out/primary
            ci-out/independent-transport
            ci-out/oracle-reproducibility.json
            ci-out/platform-review-packet.json
          if-no-files-found: error
          retention-days: 7
      - name: Save comparison build cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: oracle-compare-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/oracle-reproduce.yml') }}

  seal-platform-review-subjects:
    needs: compare
    permissions:
      actions: read
      contents: none
    outputs:
      macos_artifact_id: ${{ steps.upload-macos.outputs.artifact-id }}
      windows_artifact_id: ${{ steps.upload-windows.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact macOS comparison subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          name: ephemeralEvidence-oracle-platform-review-subject-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/macos-subject
      - name: Download exact Windows comparison subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          name: ephemeralEvidence-oracle-platform-review-subject-windows-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/windows-subject
      - name: Seal macOS subject behind an immutable artifact ID
        id: upload-macos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-oracle-platform-review-sealed-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/macos-subject
          if-no-files-found: error
          retention-days: 7
      - name: Seal Windows subject behind an immutable artifact ID
        id: upload-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-oracle-platform-review-sealed-windows-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/windows-subject
          if-no-files-found: error
          retention-days: 7

  platform-review:
    needs: seal-platform-review-subjects
    if: ${{ github.ref == 'refs/heads/main' && needs.seal-platform-review-subjects.result == 'success' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: oracle-platform-review
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner-label: macos-arm64
          - platform: windows-amd64
            runner-label: windows-amd64
    runs-on:
      - self-hosted
      - oracle-review
      - ${{ matrix.runner-label }}
    timeout-minutes: 45
    steps:
      - name: Check out trusted current platform review automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned upstream source for gate validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chrisdone/hell
          ref: 8e952cf9de4ab25d7716982a9ca234f9bdcf1bff
          path: ci-out/oracle-source
          fetch-depth: 1
          persist-credentials: false
      - name: Restore protected review Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: oracle-platform-review-cargo-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore protected review build cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: oracle-platform-review-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/oracle-reproduce.yml') }}
      - name: Build assurance driver before receiving reviewed bytes
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Load protected platform-review SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_PLATFORM_REVIEW_SSH_PRIVATE_KEY }}
      - name: Require protected platform-review SSH agent
        run: ssh-add -L
      - name: Download exact platform review subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ matrix.platform == 'macos-arm64' && needs.seal-platform-review-subjects.outputs.macos_artifact_id || needs.seal-platform-review-subjects.outputs.windows_artifact_id }}
          path: ci-out/provider-subject
      - name: Retain exact protected macOS platform reviewer authorization
        if: ${{ matrix.platform == 'macos-arm64' }}
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEW_AUTHORIZATION_GITHUB_TOKEN }}
        run: ./target/ci/hell-ci review-authorization --input ci-out/provider-subject/platform-review-packet.json --output ci-out/authorization.json --role platform-reviewer --category oracle-platform-final --platform macos-arm64 --github-dispatch-inputs
      - name: Retain exact protected Windows platform reviewer authorization
        if: ${{ matrix.platform == 'windows-amd64' }}
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEW_AUTHORIZATION_GITHUB_TOKEN }}
        run: ./target/ci/hell-ci review-authorization --input ci-out/provider-subject/platform-review-packet.json --output ci-out/authorization.json --role platform-reviewer --category oracle-platform-final --platform windows-amd64 --github-dispatch-inputs
      - name: Finalize authorized platform review packet
        run: ./target/ci/hell-ci review-packet --input ci-out/provider-subject/platform-review-packet.json --from ci-out/authorization.json --output ci-out/platform-review-authorized-packet.json --role platform-reviewer --category oracle-platform-final --decision accept --github-dispatch-inputs
      - name: Sign platform review
        run: ./target/ci/hell-ci review-sign --input ci-out/platform-review-authorized-packet.json --output ci-out/platform-review.dsse.json --role platform-reviewer --decision accept --policy ci-out/reviewer.allowed_signers
      - name: Assemble strict macOS oracle provenance gate record
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-gate-macos
      - name: Assemble strict Windows oracle provenance gate record
        if: ${{ matrix.platform == 'windows-amd64' }}
        run: ./target/ci/hell-ci oracle-ops workflow-gate-windows
      - name: Upload ephemeral reviewed reproducibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-oracle-reviewed-${{ matrix.platform }}
          path: ci-out
          if-no-files-found: error
          retention-days: 45
      - name: Save protected review build cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: oracle-platform-review-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/oracle-reproduce.yml') }}
      - name: Save protected review Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: oracle-platform-review-cargo-v1-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
