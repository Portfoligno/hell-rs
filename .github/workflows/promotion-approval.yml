name: Promotion proposal approval

on:
  workflow_dispatch:
    inputs:
      require_approval:
        type: boolean
        required: true
        default: false
      candidate_sha:
        type: string
        required: true
      assurance_epoch_sha256:
        type: string
        required: true
      promotion_proposal_sha256:
        type: string
        required: true
      proposal_run_id:
        type: string
        required: true
      proposal_run_attempt:
        type: string
        required: true
      proposal_artifact_id:
        type: string
        required: true
      proposal_provider_archive_sha256:
        type: string
        required: true
      proposal_package_sha256:
        type: string
        required: true
      issued_at:
        type: string
        required: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  approve:
    if: ${{ inputs.require_approval && github.ref == 'refs/heads/main' }}
    environment: compatibility-promotion-review
    outputs:
      approved_artifact_id: ${{ steps.upload-approved.outputs.artifact-id }}
      approved_artifact_digest: ${{ steps.upload-approved.outputs.artifact-digest }}
      approved_directory_sha256: ${{ steps.bind-approved.outputs.directory_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted current approval automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download immutable proposal package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.proposal_run_id }}
          artifact-ids: ${{ inputs.proposal_artifact_id }}
          path: ci-out/native-shards
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-approval-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore approval driver
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: promotion-approval-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-approval.yml') }}
      - name: Build trusted approval driver before loading review credentials
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact approval candidate checkout
        env:
          PROMOTION_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$PROMOTION_CANDIDATE_SHA"
      - name: Prepare exact proposal and provider selector subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci promotion-approval-subject --input ci-out/native-shards/promotion-proposal.json --output ci-out/native-shards/promotion-approval-subject.json
      - name: Retain exact protected promotion authorization
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEW_AUTHORIZATION_GITHUB_TOKEN }}
        run: ./target/ci/hell-ci review-authorization --input ci-out/native-shards/promotion-approval-subject.json --output ci-out/native-shards/authorization.json --role promotion-approver --category promotion-final --github-dispatch-inputs
      - name: Prepare exact proposal review packet
        run: ./target/ci/hell-ci review-packet --input ci-out/native-shards/promotion-proposal.json --from ci-out/native-shards/authorization.json --output ci-out/native-shards/promotion-proposal-approval-packet.json --role promotion-approver --decision accept --github-dispatch-inputs
      - name: Load protected SSH review key after exact packet finalization
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROMOTION_REVIEW_SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Install pinned Sigstore verifier after exact packet finalization
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Attach SSH and Sigstore signatures
        run: ./target/ci/hell-ci review-sign --input ci-out/native-shards/promotion-proposal-approval-packet.json --output ci-out/native-shards/promotion-proposal-approval.dsse.json --role promotion-approver --decision accept --policy ci-out/native-shards/reviewer.allowed_signers
      - name: Verify signed approval envelope
        run: ./target/ci/hell-ci review-verify --input ci-out/native-shards/promotion-proposal-approval.dsse.json --policy ci-out/native-shards/reviewer.allowed_signers --role promotion-approver
      - name: Bind exact approved proposal directory
        id: bind-approved
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/native-shards
      - name: Upload immutable approved proposal package
        id: upload-approved
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-approved-proposal
          path: ci-out/native-shards
          if-no-files-found: error
          retention-days: 30
      - name: Save Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-approval-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save approval driver
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: promotion-approval-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-approval.yml') }}
