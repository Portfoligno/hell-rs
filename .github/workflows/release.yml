        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./automation/target/ci/hell-release-publisher publish --plan release-input/plan/release-plan.json --input attested-release --expected-artifact-id ${{ needs.attest.outputs.artifact_id }} --expected-artifact-digest ${{ needs.attest.outputs.artifact_digest }} --governance-baseline release-input/plan/governance-resolve.json --governance-receipt release-reports/governance-pre-publish.json --report release-reports/publication.json
      - name: Retain publication and governance reports
        id: upload-reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-publication-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-reports
          if-no-files-found: error
          retention-days: '90'
      - name: Save trusted Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-publish-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automation/rust-toolchain.toml', 'automation/Cargo.lock', 'automation/Cargo.toml', 'automation/crates/hell-ci/Cargo.toml', 'automation/crates/hell-ci/src/**', 'automation/crates/hell-release-publisher/Cargo.toml', 'automation/crates/hell-release-publisher/src/**', 'automation/ci/**', 'automation/deny.toml') }}
