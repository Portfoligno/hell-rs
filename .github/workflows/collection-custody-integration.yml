name: Collection Custody Integration

on:
  workflow_dispatch:
    inputs:
      integration_sha:
        description: Exact protected integration commit containing durable collection custody
        required: true
        type: string
      worm_artifact_id:
        description: Immutable artifact ID containing reviewed collection WORM custody
        required: true
        type: string
      worm_source_run_id:
        description: Exact protected custody bridge run containing the immutable WORM artifact
        required: true
        type: string
      worm_source_run_attempt:
        description: Exact protected custody bridge run attempt
        required: true
        type: string
      expected_worm_archive_sha256:
        description: Exact GitHub provider archive SHA-256 for the reviewed WORM artifact
        required: true
        type: string
      expected_worm_directory_sha256:
        description: Exact canonical reviewed collection WORM directory SHA-256
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: collection-custody-integration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify-protected-integration:
    name: Verify protected collection custody integration
    if: ${{ github.ref == 'refs/heads/main' && inputs.integration_sha == github.sha }}
    permissions:
      actions: read
      contents: read
    environment: collection-custody-integration
    outputs:
      admission_artifact_id: ${{ steps.upload-admission.outputs.artifact-id }}
      admission_artifact_digest: ${{ steps.upload-admission.outputs.artifact-digest }}
      admission_directory_sha256: ${{ steps.bind-admission.outputs.directory_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact protected integration commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.integration_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore custody integration Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-integration-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore custody integration compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ci
            target/release
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-integration-target-${{ inputs.integration_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-custody-integration.yml') }}
      - name: Build trusted durable custody verifier
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact protected integration checkout
        env:
          COLLECTION_INTEGRATION_SHA: ${{ inputs.integration_sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$COLLECTION_INTEGRATION_SHA"
      - name: Build trusted collection process helper
        run: cargo build --locked --profile ci --package hell-testkit --bin hell-test-helper
      - name: Build current traced candidate from protected integration commit
        run: cargo build --locked --release --package hell-cli --bin hell --features hell-cli/compat-tracing
      - name: Download immutable reviewed collection WORM evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.worm_source_run_id }}
          artifact-ids: ${{ inputs.worm_artifact_id }}
          path: ci-in/collection-worm-custody
      - name: Verify exact downloaded collection WORM artifact digest
        env:
          COLLECTION_WORM_ARCHIVE_SHA256: ${{ inputs.expected_worm_archive_sha256 }}
          COLLECTION_WORM_ARTIFACT_ID: ${{ inputs.worm_artifact_id }}
          COLLECTION_WORM_DIRECTORY_SHA256: ${{ inputs.expected_worm_directory_sha256 }}
          COLLECTION_WORM_RUN_ATTEMPT: ${{ inputs.worm_source_run_attempt }}
          COLLECTION_WORM_RUN_ID: ${{ inputs.worm_source_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci collection-authority verify-worm-artifact --input ci-in/collection-worm-custody --expected-directory-sha256 "$COLLECTION_WORM_DIRECTORY_SHA256" --expected-archive-sha256 "$COLLECTION_WORM_ARCHIVE_SHA256" --run-id "$COLLECTION_WORM_RUN_ID" --run-attempt "$COLLECTION_WORM_RUN_ATTEMPT" --artifact-id "$COLLECTION_WORM_ARTIFACT_ID"
      - name: Replay and verify current durable supplemental authority
        run: ./target/ci/hell-ci collection-authority verify-custody --package compat/collection-custody/payload --signature compat/collection-custody/signature --candidate-executable target/release/hell --integration-proof compat/collection-custody/integration-proof.tsv --integration-review compat/collection-custody/integration-review.dsse.json --worm-custody ci-in/collection-worm-custody --report ci-out/collection-custody-admission.json
      - name: Bind exact admission and activation token directory
        id: bind-admission
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out
      - name: Upload verified current custody admission report
        id: upload-admission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-custody-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-out/collection-custody-admission.json
            ci-out/collection-custody-admission.json.sha256
            ci-out/collection-custody-activation-token.json
            ci-out/collection-custody-activation-token.json.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Save custody integration Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-integration-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save custody integration compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ci
            target/release
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-integration-target-${{ inputs.integration_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-custody-integration.yml') }}
