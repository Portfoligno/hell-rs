name: Independent artifact acquisition

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        type: string
        required: true
      source_run_id:
        type: string
        required: true
      source_run_attempt:
        type: string
        required: true
      source_artifact_id:
        type: string
        required: true
      source_provider_archive_sha256:
        description: Exact provider archive digest for the producing artifact
        type: string
        required: true
      expected_artifact_set_sha256:
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  prepare-request:
    if: ${{ github.ref == 'refs/heads/main' && inputs.candidate_sha == github.sha }}
    permissions:
      contents: read
    runs-on: [self-hosted, artifact-review]
    timeout-minutes: 20
    outputs:
      request_artifact_id: ${{ steps.upload-request.outputs.artifact-id }}
      request_artifact_digest: ${{ steps.upload-request.outputs.artifact-digest }}
    steps:
      - name: Check out trusted current acquisition request automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore request Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: artifact-independent-request-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore request driver
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: artifact-independent-request-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/artifact-independent-acquisition.yml') }}
      - name: Build trusted external request driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Prepare sealed external acquisition request without credentials
        env:
          ARTIFACT_INDEPENDENT_ARCHIVE_SHA256: ${{ vars.ARTIFACT_INDEPENDENT_ARCHIVE_SHA256 }}
          ARTIFACT_INDEPENDENT_BUCKET: ${{ vars.ARTIFACT_INDEPENDENT_BUCKET }}
          ARTIFACT_INDEPENDENT_KEY: ${{ vars.ARTIFACT_INDEPENDENT_KEY }}
          ARTIFACT_INDEPENDENT_REGION: ${{ vars.ARTIFACT_INDEPENDENT_REGION }}
          ARTIFACT_INDEPENDENT_VERSION_ID: ${{ vars.ARTIFACT_INDEPENDENT_VERSION_ID }}
        run: ./target/ci/hell-ci artifact-acquire prepare-external-independent --output ci-out/acquisition/external-independent-request.json --artifact native-oracle-merged --github-dispatch-inputs
      - name: Upload immutable sealed external acquisition request
        id: upload-request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-independent-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-out/acquisition/external-independent-request.json
            ci-out/acquisition/external-independent-request.json.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Save request Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: artifact-independent-request-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save request driver
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: artifact-independent-request-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/artifact-independent-acquisition.yml') }}

  acquire:
    needs: prepare-request
    if: ${{ github.ref == 'refs/heads/main' && inputs.candidate_sha == github.sha && needs.prepare-request.result == 'success' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: artifact-independent-acquisition
    outputs:
      acquisition_artifact_id: ${{ steps.upload-acquisition.outputs.artifact-id }}
      acquisition_artifact_digest: ${{ steps.upload-acquisition.outputs.artifact-digest }}
      acquisition_directory_sha256: ${{ steps.bind-acquisition.outputs.directory_sha256 }}
    runs-on: [self-hosted, artifact-review]
    timeout-minutes: 20
    steps:
      - name: Check out trusted current acquisition automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: artifact-independent-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore assurance driver
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: artifact-independent-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/artifact-independent-acquisition.yml') }}
      - name: Build assurance driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Download immutable needs-linked sealed acquisition request
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-request.outputs.request_artifact_id }}
          path: ci-out/acquisition
      - name: Verify sealed external acquisition request before credentials
        run: ./target/ci/hell-ci artifact-acquire verify-external-independent-request --input ci-out/acquisition/external-independent-request.json --artifact native-oracle-merged
      - name: Configure protected external acquisition identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.ARTIFACT_INDEPENDENT_ACQUISITION_ROLE }}
          aws-region: ${{ vars.ARTIFACT_INDEPENDENT_REGION }}
      - name: Acquire exact immutable external artifact set
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci artifact-acquire external-independent --input ci-out/acquisition/external-independent-request.json --output ci-out/acquisition/receipt-independent.json --artifact native-oracle-merged
      - name: Install pinned Sigstore signer after exact acquisition validation
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Sign independent acquisition receipt
        run: ./target/ci/hell-ci artifact-acquire attest-independent --input ci-out/acquisition/receipt-independent.json --output ci-out/acquisition/receipt-independent.producer.dsse.json
      - name: Bind exact immutable independent acquisition directory
        id: bind-acquisition
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/acquisition
      - name: Upload independent acquisition
        id: upload-acquisition
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-independent-acquisition
          path: ci-out/acquisition
          if-no-files-found: error
          retention-days: 14
      - name: Save Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: artifact-independent-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save assurance driver
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: artifact-independent-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/artifact-independent-acquisition.yml') }}
