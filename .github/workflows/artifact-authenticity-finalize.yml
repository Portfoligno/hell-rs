name: Artifact authenticity finalization

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        type: string
        required: true
      primary_packet_run_id:
        type: string
        required: true
      primary_packet_run_attempt:
        type: string
        required: true
      primary_packet_artifact_id:
        type: string
        required: true
      primary_packet_package_sha256:
        type: string
        required: true
      primary_packet_archive_sha256:
        type: string
        required: true
      independent_review_run_id:
        type: string
        required: true
      independent_review_run_attempt:
        type: string
        required: true
      independent_review_artifact_id:
        type: string
        required: true
      independent_review_package_sha256:
        type: string
        required: true
      independent_review_archive_sha256:
        type: string
        required: true
      require_review:
        type: boolean
        required: true
        default: false
      issued_at:
        type: string
        required: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  prepare:
    if: ${{ inputs.require_review && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload-subject.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-subject.outputs.artifact-digest }}
    steps:
      - name: Check out trusted current review automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore Cargo downloads
        id: prepare-cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: artifact-finalize-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore assurance driver
        id: prepare-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: artifact-finalize-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/artifact-authenticity-finalize.yml') }}
      - name: Build assurance driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Download primary acquisition packet after building the verifier
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.primary_packet_run_id }}
          artifact-ids: ${{ inputs.primary_packet_artifact_id }}
          path: ci-out/finalize-source/primary
      - name: Download independent acquisition after building the verifier
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.independent_review_run_id }}
          artifact-ids: ${{ inputs.independent_review_artifact_id }}
          path: ci-out/finalize-source/independent
      - name: Verify and assemble exact acquisition sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci artifact-acquire assemble-finalize --input ci-out/finalize-source --output ci-out/acquisition --github-dispatch-inputs
      - name: Prepare deterministic unavailable-attestation finding subject
        run: ./target/ci/hell-ci review-findings prepare --input ci-out/acquisition --output ci-out/acquisition/artifact-findings.subject.json
      - name: Upload exact pre-review subject
        id: upload-subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-artifact-trust-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/acquisition
          if-no-files-found: error
          retention-days: 7
      - name: Save Cargo downloads
        if: ${{ always() && steps.prepare-cargo-cache.outcome == 'success' && steps.prepare-cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: artifact-finalize-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save assurance driver
        if: ${{ always() && steps.prepare-target-cache.outcome == 'success' && steps.prepare-target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: artifact-finalize-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/artifact-authenticity-finalize.yml') }}

  finalize:
    needs: prepare
    if: ${{ inputs.require_review && github.ref == 'refs/heads/main' }}
    environment: artifact-authenticity-review
    outputs:
      authenticity_artifact_id: ${{ steps.upload-authenticity.outputs.artifact-id }}
      authenticity_artifact_digest: ${{ steps.upload-authenticity.outputs.artifact-digest }}
      authenticity_directory_sha256: ${{ steps.bind-authenticity.outputs.directory_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted current review automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: artifact-finalize-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore assurance driver
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: artifact-finalize-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/artifact-authenticity-finalize.yml') }}
      - name: Build trusted assurance driver before loading review credentials
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted authenticity finalizer HEAD
        env:
          TRUSTED_DRIVER_SHA: ${{ github.sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$TRUSTED_DRIVER_SHA"
      - name: Download exact pre-review subject after building the verifier
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ci-out/acquisition
      - name: Retain stable protected reviewer authorization
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEW_AUTHORIZATION_GITHUB_TOKEN }}
        run: ./target/ci/hell-ci review-authorization --input ci-out/acquisition/artifact-findings.subject.json --output ci-out/acquisition/authorization.json --role artifact-trust-reviewer --category artifact-trust-final --github-dispatch-inputs
      - name: Materialize authorized accepted finding
        run: ./target/ci/hell-ci review-findings accept --input ci-out/acquisition/artifact-findings.subject.json --from ci-out/acquisition/authorization.json --output ci-out/acquisition/artifact-findings.accepted.json
      - name: Prepare exact artifact trust packet
        run: ./target/ci/hell-ci review-packet --input ci-out/acquisition --from ci-out/acquisition/authorization.json --findings ci-out/acquisition/artifact-findings.accepted.json --output ci-out/acquisition/artifact-trust-review-packet.json --role artifact-trust-reviewer --decision accept --policy ci-out/acquisition/reviewer.allowed_signers --github-dispatch-inputs
      - name: Load protected SSH review key after exact packet finalization
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.ARTIFACT_REVIEW_SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Install pinned Sigstore verifier after exact packet finalization
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Attach SSH and Sigstore trust signatures
        run: ./target/ci/hell-ci review-sign --input ci-out/acquisition/artifact-trust-review-packet.json --output ci-out/acquisition/trust-review.dsse.json --role artifact-trust-reviewer --decision accept --policy ci-out/acquisition/reviewer.allowed_signers
      - name: Finalize and verify authenticity report
        run: ./target/ci/hell-ci artifact-acquire finalize --input ci-out/acquisition --output ci-out/acquisition/artifact-authenticity-report.json --policy ci-out/acquisition/reviewer.allowed_signers
      - name: Bind exact immutable authenticity evidence directory
        id: bind-authenticity
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/acquisition
      - name: Upload immutable authenticity evidence
        id: upload-authenticity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-artifact-authenticity
          path: ci-out/acquisition
          if-no-files-found: error
          retention-days: 30
      - name: Save Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: artifact-finalize-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save assurance driver
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: artifact-finalize-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/artifact-authenticity-finalize.yml') }}
