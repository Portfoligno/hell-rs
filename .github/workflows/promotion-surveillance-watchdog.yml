name: Promotion surveillance watchdog

on:
  schedule:
    - cron: "41 4 * * *"

permissions:
  contents: read

concurrency:
  group: promotion-surveillance-current-state
  cancel-in-progress: false

jobs:
  retrieve-active:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: primary-worm
            trust-domain: organization-primary
            environment: custody-primary-surveillance
            runner-label: custody-primary-retrieval
            default-receipt-variable: ACTIVE_CUSTODY_PRIMARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_PRIMARY_SURVEILLANCE_ROLE
            region-variable: CUSTODY_PRIMARY_REGION
          - provider: secondary-worm
            trust-domain: organization-secondary
            environment: custody-secondary-surveillance
            runner-label: custody-secondary-retrieval
            default-receipt-variable: ACTIVE_CUSTODY_SECONDARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_SECONDARY_SURVEILLANCE_ROLE
            region-variable: CUSTODY_SECONDARY_REGION
    environment: ${{ matrix.environment }}
    runs-on:
      - self-hosted
      - ${{ matrix.runner-label }}
    timeout-minutes: 45
    steps:
      - name: Check out watchdog source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore watchdog retrieval Cargo dependencies
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-watchdog-retrieve-${{ matrix.provider }}-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore watchdog retrieval target
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: promotion-watchdog-retrieve-${{ matrix.provider }}-target-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-surveillance-watchdog.yml') }}
      - name: Build watchdog retrieval driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted watchdog retrieval driver HEAD
        env:
          TRUSTED_DRIVER_SHA: ${{ github.sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$TRUSTED_DRIVER_SHA"
      - name: Seal exact active watchdog provider selector before credentials
        env:
          ACTIVE_CUSTODY_PROVIDER_SELECTOR: ${{ vars[matrix.default-receipt-variable] }}
          CUSTODY_PROVIDER_OPERATION: surveillance
          CUSTODY_EXPECTED_PROVIDER: ${{ matrix.provider }}
          CUSTODY_EXPECTED_TRUST_DOMAIN: ${{ matrix.trust-domain }}
        run: ./target/ci/hell-ci custody-ops workflow-prepare-provider-selector
      - name: Configure protected read-only provider identity
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars[matrix.role-variable] }}
          aws-region: ${{ vars[matrix.region-variable] }}
      - name: Retrieve exact active package or retain typed failure
        if: ${{ always() }}
        run: ./target/ci/hell-ci custody-ops workflow-surveillance-retrieve
      - name: Install pinned provider signature verifier
        if: ${{ always() }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Prepare exact primary watchdog provider packet
        if: ${{ always() && matrix.provider == 'primary-worm' }}
        run: ./target/ci/hell-ci custody-ops workflow-surveillance-retrieval-packet-primary
      - name: Prepare exact secondary watchdog provider packet
        if: ${{ always() && matrix.provider == 'secondary-worm' }}
        run: ./target/ci/hell-ci custody-ops workflow-surveillance-retrieval-packet-secondary
      - name: Load protected primary watchdog observation signer after packet finalization
        if: ${{ always() && matrix.provider == 'primary-worm' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CUSTODY_PRIMARY_SURVEILLANCE_SSH_PRIVATE_KEY }}
      - name: Load protected secondary watchdog observation signer after packet finalization
        if: ${{ always() && matrix.provider == 'secondary-worm' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CUSTODY_SECONDARY_SURVEILLANCE_SSH_PRIVATE_KEY }}
      - name: Sign exact watchdog provider observation
        if: ${{ always() }}
        run: ./target/ci/hell-ci review-sign --input ci-out/custody-maintenance/provider-observation-packet.json --output ci-out/custody-maintenance/provider-observation.dsse.json --role custody-provider --decision accept --policy compat/reviews.allowed_signers
      - name: Upload exact watchdog provider observation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-watchdog-active-${{ matrix.provider }}
          path: ci-out/custody-maintenance
          if-no-files-found: error
          retention-days: 14
      - name: Save watchdog retrieval Cargo dependencies
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-watchdog-retrieve-${{ matrix.provider }}-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save watchdog retrieval target
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: promotion-watchdog-retrieve-${{ matrix.provider }}-target-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-surveillance-watchdog.yml') }}

  deadline:
    if: ${{ always() }}
    needs: retrieve-active
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: write
    environment: promotion-surveillance-watchdog
    outputs:
      transition_artifact_id: ${{ steps.upload-transition.outputs.artifact-id }}
      transition_artifact_digest: ${{ steps.upload-transition.outputs.artifact-digest }}
      transition_directory_sha256: ${{ steps.bind-transition.outputs.directory_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out watchdog source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore watchdog Cargo dependencies
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-surveillance-watchdog-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore watchdog target
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: promotion-surveillance-watchdog-target-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-surveillance.yml', '.github/workflows/promotion-surveillance-watchdog.yml') }}
      - name: Build watchdog driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted watchdog deadline driver HEAD
        env:
          TRUSTED_DRIVER_SHA: ${{ github.sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$TRUSTED_DRIVER_SHA"
      - name: Download primary active provider evidence
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          name: promotion-watchdog-active-primary-worm
          path: ci-out/active-primary
      - name: Download secondary active provider evidence
        continue-on-error: true
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          name: promotion-watchdog-active-secondary-worm
          path: ci-out/active-secondary
      - name: Verify exact active promotion subject
        continue-on-error: true
        run: ./target/ci/hell-ci surveillance-ops workflow-compare-active
      - name: Install pinned watchdog signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Reverify public state against both watchdog provider heads
        id: public-state
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_COMPATIBILITY_REPORT_BASE_URL: ${{ vars.PUBLIC_COMPATIBILITY_REPORT_BASE_URL }}
        run: ./target/ci/hell-ci custody-ops workflow-observe-public-transition
      - name: Check expected surveillance deadline
        id: deadline
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci surveillance-ops workflow-deadline
      - name: Prepare exact watchdog transition packet
        if: ${{ steps.deadline.outputs.overdue == 'true' }}
        run: ./target/ci/hell-ci custody-ops workflow-transition-packet
      - name: Load protected watchdog state signer after packet finalization
        if: ${{ steps.deadline.outputs.overdue == 'true' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SURVEILLANCE_WATCHDOG_SSH_PRIVATE_KEY }}
      - name: Sign missed-deadline at-risk transition
        if: ${{ steps.deadline.outputs.overdue == 'true' }}
        run: ./target/ci/hell-ci review-sign --input ci-out/surveillance/promotion-transition-packet.json --output ci-out/surveillance/promotion-transition.dsse.json --role custody-reviewer --decision accept --policy compat/reviews.allowed_signers
      - name: Verify signed missed-deadline transition
        if: ${{ steps.deadline.outputs.overdue == 'true' }}
        run: ./target/ci/hell-ci review-verify --input ci-out/surveillance/promotion-transition.dsse.json --policy compat/reviews.allowed_signers --role custody-reviewer
      - name: Bind exact watchdog transition directory
        id: bind-transition
        if: ${{ steps.deadline.outputs.overdue == 'true' }}
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/surveillance
      - name: Retain signed missed-deadline evidence
        id: upload-transition
        if: ${{ steps.deadline.outputs.overdue == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-surveillance-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/surveillance
          if-no-files-found: error
          retention-days: 30
      - name: Upsert missed surveillance deadline incident
        if: ${{ steps.deadline.outputs.overdue == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci surveillance-ops workflow-alert
      - name: Fail missed surveillance deadline
        if: ${{ steps.deadline.outputs.overdue == 'true' }}
        run: ./target/ci/hell-ci surveillance-ops require-promoted --input ci-out/surveillance/promotion-transition.json
      - name: Save watchdog Cargo dependencies
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-surveillance-watchdog-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save watchdog target
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: promotion-surveillance-watchdog-target-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-surveillance.yml', '.github/workflows/promotion-surveillance-watchdog.yml') }}

  publish-at-risk-state:
    if: ${{ always() && needs.deadline.outputs.transition_artifact_id != '' }}
    needs: deadline
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: primary-worm
            trust-domain: organization-primary
            environment: custody-primary-state-publication
            runner-label: custody-primary-activation
            default-receipt-variable: ACTIVE_CUSTODY_PRIMARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_PRIMARY_STATE_PUBLICATION_ROLE
            region-variable: CUSTODY_PRIMARY_REGION
          - provider: secondary-worm
            trust-domain: organization-secondary
            environment: custody-secondary-state-publication
            runner-label: custody-secondary-activation
            default-receipt-variable: ACTIVE_CUSTODY_SECONDARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_SECONDARY_STATE_PUBLICATION_ROLE
            region-variable: CUSTODY_SECONDARY_REGION
    environment: ${{ matrix.environment }}
    runs-on:
      - self-hosted
      - ${{ matrix.runner-label }}
    timeout-minutes: 30
    steps:
      - name: Check out watchdog source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore watchdog publication Cargo dependencies
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-surveillance-watchdog-publish-${{ matrix.provider }}-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore watchdog publication target
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: promotion-surveillance-watchdog-publish-${{ matrix.provider }}-target-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-surveillance-watchdog.yml') }}
      - name: Build state publication driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted watchdog state publication driver HEAD
        env:
          TRUSTED_DRIVER_SHA: ${{ github.sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$TRUSTED_DRIVER_SHA"
      - name: Download exact signed watchdog transition
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.deadline.outputs.transition_artifact_id }}
          path: ci-out/surveillance
      - name: Install pinned state signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Verify watchdog transition before provider publication
        run: ./target/ci/hell-ci review-verify --input ci-out/surveillance/promotion-transition.dsse.json --policy compat/reviews.allowed_signers --role custody-reviewer
      - name: Seal exact watchdog transition publication selector before credentials
        env:
          ACTIVE_CUSTODY_PROVIDER_SELECTOR: ${{ vars[matrix.default-receipt-variable] }}
          CUSTODY_PROVIDER_OPERATION: transition-publication
          CUSTODY_EXPECTED_PROVIDER: ${{ matrix.provider }}
          CUSTODY_EXPECTED_TRUST_DOMAIN: ${{ matrix.trust-domain }}
        run: ./target/ci/hell-ci custody-ops workflow-prepare-provider-selector
      - name: Configure protected state publication identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars[matrix.role-variable] }}
          aws-region: ${{ vars[matrix.region-variable] }}
      - name: Publish exact signed watchdog state immutably
        id: publish-transition
        run: ./target/ci/hell-ci custody-ops workflow-publish-transition
      - name: Bind exact updated watchdog provider selector directory
        id: bind-selector-update
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/provider-selector-update
      - name: Upload exact updated watchdog provider selector
        id: upload-selector-update
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custody-provider-selector-update-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/provider-selector-update
          if-no-files-found: error
          retention-days: 90
      - name: Save watchdog publication Cargo dependencies
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-surveillance-watchdog-publish-${{ matrix.provider }}-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save watchdog publication target
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: promotion-surveillance-watchdog-publish-${{ matrix.provider }}-target-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-surveillance-watchdog.yml') }}

  seal-provider-selector-updates:
    needs: publish-at-risk-state
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/custody-provider-selector-seal.yml
    with:
      source_workflow: .github/workflows/promotion-surveillance-watchdog.yml

  publish-public-at-risk-report:
    if: ${{ always() && needs.deadline.outputs.transition_artifact_id != '' && needs.publish-at-risk-state.result == 'success' }}
    needs:
      - deadline
      - publish-at-risk-state
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: compatibility-public-report-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted watchdog public publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build trusted watchdog public publisher
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted watchdog public publisher HEAD
        env:
          TRUSTED_DRIVER_SHA: ${{ github.sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$TRUSTED_DRIVER_SHA"
      - name: Download exact watchdog transition for public report
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.deadline.outputs.transition_artifact_id }}
          path: ci-out/surveillance
      - name: Install pinned watchdog public signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Verify watchdog transition before public publication
        run: ./target/ci/hell-ci review-verify --input ci-out/surveillance/promotion-transition.dsse.json --policy compat/reviews.allowed_signers --role custody-reviewer
      - name: Verify exact immutable watchdog public source artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_REPORT_SOURCE_ARTIFACT_ID: ${{ needs.deadline.outputs.transition_artifact_id }}
        run: ./target/ci/hell-ci custody-ops workflow-verify-public-source-artifact
      - name: Seal exact watchdog public report destination before credentials
        env:
          PUBLIC_COMPATIBILITY_REPORT_BUCKET: ${{ vars.PUBLIC_COMPATIBILITY_REPORT_BUCKET }}
          PUBLIC_COMPATIBILITY_REPORT_BASE_URL: ${{ vars.PUBLIC_COMPATIBILITY_REPORT_BASE_URL }}
        run: ./target/ci/hell-ci custody-ops workflow-prepare-public-publication-selector
      - name: Configure protected watchdog public report identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.PUBLIC_COMPATIBILITY_REPORT_ROLE }}
          aws-region: ${{ vars.PUBLIC_COMPATIBILITY_REPORT_REGION }}
      - name: Publish watchdog at-risk state to stable public report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_COMPATIBILITY_REPORT_BUCKET: ${{ vars.PUBLIC_COMPATIBILITY_REPORT_BUCKET }}
          PUBLIC_COMPATIBILITY_REPORT_BASE_URL: ${{ vars.PUBLIC_COMPATIBILITY_REPORT_BASE_URL }}
          PUBLIC_REPORT_SOURCE_ARTIFACT_ID: ${{ needs.deadline.outputs.transition_artifact_id }}
        run: ./target/ci/hell-ci custody-ops workflow-publish-public-transition
      - name: Retain watchdog public publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-watchdog-public-current-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-out/surveillance/public-report-publication.json
            ci-out/surveillance/public-current-state.json
            ci-out/surveillance/public-current-state-packet.json
            ci-out/surveillance/public-current-state.dsse.json
            ci-out/surveillance/public-current-state-publication.json
            ci-out/surveillance/public-compatibility-report.md
            ci-out/surveillance/public-accepted-divergences.json
