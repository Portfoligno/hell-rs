name: Collection Authority

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit for the collection readiness campaign
        required: true
        type: string

permissions:
  contents: read

env:
  HELL_SOURCE_COMMIT: ${{ inputs.candidate_sha }}

concurrency:
  group: collection-authority-${{ github.repository }}
  cancel-in-progress: false

jobs:
  linux-acquisition-subject:
    name: Collection Linux acquisition subject
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-subject.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact provider-head acquisition code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore Linux acquisition Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-acquisition-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore Linux acquisition Rust target cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-acquisition-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-authority.yml') }}
      - name: Build collection acquisition verifier
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact acquisition provider-head checkout
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$GITHUB_SHA"
      - name: Acquire exact Linux release oracle
        run: ./target/ci/hell-ci release-oracle acquire --artifact ci-out/linux-release-oracle --provider-response ci-out/linux-release-provider.json --receipt ci-out/linux-release-oracle-receipt.json
      - name: Upload exact unsigned Linux acquisition subject
        id: upload-subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-linux-acquisition-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out
          if-no-files-found: error
          retention-days: 7
      - name: Save Linux acquisition Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-acquisition-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save Linux acquisition Rust target cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-acquisition-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-authority.yml') }}

  sign-linux-acquisition:
    name: Sign collection Linux acquisition
    needs: linux-acquisition-subject
    if: ${{ github.ref == 'refs/heads/main' && needs.linux-acquisition-subject.result == 'success' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: linux-release-acquisition-signing
    outputs:
      artifact_id: ${{ steps.upload-signed.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact provider-head signer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore Linux acquisition signer Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-acquisition-sign-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore Linux acquisition signer Rust target cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-acquisition-sign-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-authority.yml') }}
      - name: Build signer before receiving acquisition bytes
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact signer provider-head checkout
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$GITHUB_SHA"
      - name: Download exact unsigned Linux acquisition subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.linux-acquisition-subject.outputs.artifact_id }}
          path: ci-out
      - name: Install pinned Sigstore signer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Sign exact verified Linux release acquisition
        run: ./target/ci/hell-ci release-oracle attest --artifact ci-out/linux-release-oracle --provider-response ci-out/linux-release-provider.json --receipt ci-out/linux-release-oracle-receipt.json --attestation ci-out/linux-release-oracle-acquisition.dsse.json
      - name: Upload immutable signed Linux acquisition
        id: upload-signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-linux-acquisition-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out
          if-no-files-found: error
          retention-days: 30
      - name: Save Linux acquisition signer Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-acquisition-sign-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save Linux acquisition signer Rust target cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-acquisition-sign-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-authority.yml') }}

  collection-authority-linux:
    name: Collection authority / Linux amd64
    needs: sign-linux-acquisition
    if: ${{ github.ref == 'refs/heads/main' && needs.sign-linux-acquisition.result == 'success' }}
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-collection-linux.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out trusted provider-head campaign harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore Linux collection Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore Linux collection Rust target cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-authority.yml') }}
      - name: Build trusted collection authority driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted provider-head checkout
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$GITHUB_SHA"
      - name: Check out exact collection candidate as isolated subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: ci-work/candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact collection candidate checkout
        run: ./target/ci/hell-ci collection-authority verify-checkout --input ci-work/candidate --candidate-commit "$HELL_SOURCE_COMMIT"
      - name: Restore exact Linux candidate compilation cache
        id: candidate-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-out/candidate-target
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-candidate-${{ inputs.candidate_sha }}-${{ hashFiles('ci-work/candidate/rust-toolchain.toml', 'ci-work/candidate/Cargo.lock', 'ci-work/candidate/Cargo.toml', 'ci-work/candidate/crates/**/Cargo.toml', 'ci-work/candidate/**/build.rs', 'ci-work/candidate/.cargo/**', 'ci-work/candidate/crates/**/*.rs', 'ci-work/candidate/builtins/**', 'ci-work/candidate/compat/**', 'ci-work/candidate/fixtures/**', 'ci-work/candidate/baseline.toml', 'ci-work/candidate/spec/**', '.github/workflows/collection-authority.yml') }}
      - name: Build trusted collection process helper
        run: cargo build --locked --profile ci --package hell-testkit --bin hell-test-helper
      - name: Build isolated traced release candidate subject
        run: cargo build --locked --release --manifest-path ci-work/candidate/Cargo.toml --target-dir ci-out/candidate-target --package hell-cli --bin hell --features hell-cli/compat-tracing
      - name: Download exact signed Linux oracle acquisition
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.sign-linux-acquisition.outputs.artifact_id }}
          path: ci-out
      - name: Execute exact dormant collection campaign
        run: ./target/ci/hell-ci collection-authority collect --oracle ci-out/linux-release-oracle --oracle-sha256 5ccc78e62200eb5aea8b9da9161334c61848d0d3e7de2f270929920cfbf357c9 --candidate-executable ci-out/candidate-target/release/hell --candidate-commit "$HELL_SOURCE_COMMIT" --platform linux-amd64 --output ci-out/collection-shard/linux-amd64
      - name: Render canonical Linux collection provider subject
        run: ./target/ci/hell-ci collection-authority subject --input ci-out/collection-shard/linux-amd64 --platform linux-amd64 --output ci-out/collection-shard/linux-amd64/collection-evidence/provider-subject.json
      - name: Upload immutable Linux collection authority shard
        id: upload-collection-linux
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-authority-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/collection-shard/*
          if-no-files-found: error
          retention-days: 30
      - name: Save Linux collection Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save Linux collection Rust target cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-linux-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-authority.yml') }}
      - name: Save exact Linux candidate compilation cache
        if: ${{ always() && steps.candidate-target-cache.outcome == 'success' && steps.candidate-target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-out/candidate-target
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-candidate-${{ inputs.candidate_sha }}-${{ hashFiles('ci-work/candidate/rust-toolchain.toml', 'ci-work/candidate/Cargo.lock', 'ci-work/candidate/Cargo.toml', 'ci-work/candidate/crates/**/Cargo.toml', 'ci-work/candidate/**/build.rs', 'ci-work/candidate/.cargo/**', 'ci-work/candidate/crates/**/*.rs', 'ci-work/candidate/builtins/**', 'ci-work/candidate/compat/**', 'ci-work/candidate/fixtures/**', 'ci-work/candidate/baseline.toml', 'ci-work/candidate/spec/**', '.github/workflows/collection-authority.yml') }}

  collection-authority-macos:
    name: Collection authority / macOS arm64
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-collection-macos.outputs.artifact-id }}
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out trusted provider-head campaign harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore macOS collection Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-macos-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore macOS collection Rust target cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-macos-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-authority.yml') }}
      - name: Build trusted collection authority driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted provider-head checkout
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$GITHUB_SHA"
      - name: Check out exact collection candidate as isolated subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: ci-work/candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact collection candidate checkout
        run: ./target/ci/hell-ci collection-authority verify-checkout --input ci-work/candidate --candidate-commit "$HELL_SOURCE_COMMIT"
      - name: Restore exact macOS candidate compilation cache
        id: candidate-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-out/candidate-target
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-candidate-${{ inputs.candidate_sha }}-${{ hashFiles('ci-work/candidate/rust-toolchain.toml', 'ci-work/candidate/Cargo.lock', 'ci-work/candidate/Cargo.toml', 'ci-work/candidate/crates/**/Cargo.toml', 'ci-work/candidate/**/build.rs', 'ci-work/candidate/.cargo/**', 'ci-work/candidate/crates/**/*.rs', 'ci-work/candidate/builtins/**', 'ci-work/candidate/compat/**', 'ci-work/candidate/fixtures/**', 'ci-work/candidate/baseline.toml', 'ci-work/candidate/spec/**', '.github/workflows/collection-authority.yml') }}
      - name: Check out exact native collection oracle source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chrisdone/hell
          ref: 8e952cf9de4ab25d7716982a9ca234f9bdcf1bff
          path: ci-work/oracle-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned native collection Stack
        id: setup-stack
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: 3.11.1
      - name: Restore macOS native Stack dependency cache
        id: native-stack-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-stack.outputs.stack-root }}
          key: v2-${{ runner.os }}-${{ runner.arch }}-stack-3.11.1-collection-oracle-${{ hashFiles('ci-work/oracle-source/stack.yaml', 'ci-work/oracle-source/stack.yaml.lock', 'ci-work/oracle-source/package.yaml', 'ci-work/oracle-source/hell.cabal', 'ci-work/oracle-source/src/**') }}
      - name: Restore macOS native Stack build cache
        id: native-stack-work-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-work/oracle-source/.stack-work
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-stack-work-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**') }}-${{ hashFiles('crates/**/*.rs', 'compat/**', 'ci-work/oracle-source/stack.yaml', 'ci-work/oracle-source/stack.yaml.lock', 'ci-work/oracle-source/package.yaml', 'ci-work/oracle-source/hell.cabal', 'ci-work/oracle-source/src/**', '.github/workflows/collection-authority.yml') }}
      - name: Build trusted collection process helper
        run: cargo build --locked --profile ci --package hell-testkit --bin hell-test-helper
      - name: Build isolated traced release candidate subject
        run: cargo build --locked --release --manifest-path ci-work/candidate/Cargo.toml --target-dir ci-out/candidate-target --package hell-cli --bin hell --features hell-cli/compat-tracing
      - name: Build and retain exact native collection oracle
        run: ./target/ci/hell-ci collection-authority build-native --source ci-work/oracle-source --platform macos-arm64 --output ci-out/collection-shard/macos-arm64
      - name: Execute exact dormant collection campaign
        env:
          COLLECTION_ORACLE_SHA256: ${{ hashFiles('ci-out/collection-shard/macos-arm64/oracle/macos-arm64/hell') }}
        run: ./target/ci/hell-ci collection-authority collect --oracle ci-out/collection-shard/macos-arm64/oracle/macos-arm64/hell --oracle-sha256 "$COLLECTION_ORACLE_SHA256" --candidate-executable ci-out/candidate-target/release/hell --candidate-commit "$HELL_SOURCE_COMMIT" --platform macos-arm64 --output ci-out/collection-shard/macos-arm64
      - name: Render canonical macOS collection provider subject
        run: ./target/ci/hell-ci collection-authority subject --input ci-out/collection-shard/macos-arm64 --platform macos-arm64 --output ci-out/collection-shard/macos-arm64/collection-evidence/provider-subject.json
      - name: Upload immutable macOS collection authority shard
        id: upload-collection-macos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-authority-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/collection-shard/*
          if-no-files-found: error
          retention-days: 30
      - name: Save macOS collection Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
