  merge-collection-authority:
    name: Merge collection authority / Linux
    needs: [collection-authority-linux, collection-authority-macos, collection-authority-windows]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.collection-authority-linux.result == 'success' && needs.collection-authority-macos.result == 'success' && needs.collection-authority-windows.result == 'success' }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      custody_artifact_id: ${{ steps.upload-collection-custody.outputs.artifact-id }}
      custody_artifact_digest: ${{ steps.upload-collection-custody.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact collection importer and policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore collection merge Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-merge-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore collection merge Rust target cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-merge-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-authority.yml') }}
      - name: Build offline collection authority verifier
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact importer provider-head checkout
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$GITHUB_SHA"
      - name: Install exact reviewed GitHub CLI verifier
        run: ./target/ci/hell-ci collection-authority install-pinned-gh --output ci-out/collection-custody-tools
      - name: Acquire exact completed collection producer artifacts
        env:
          COLLECTION_LINUX_ARTIFACT_ID: ${{ needs.collection-authority-linux.outputs.artifact_id }}
          COLLECTION_MACOS_ARTIFACT_ID: ${{ needs.collection-authority-macos.outputs.artifact_id }}
          COLLECTION_WINDOWS_ARTIFACT_ID: ${{ needs.collection-authority-windows.outputs.artifact_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci collection-authority acquire-provider --repository Portfoligno/hell-rs --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --provider-head "$GITHUB_SHA" --candidate-commit "$HELL_SOURCE_COMMIT" --workflow-path .github/workflows/collection-authority.yml --linux-artifact-id "$COLLECTION_LINUX_ARTIFACT_ID" --macos-artifact-id "$COLLECTION_MACOS_ARTIFACT_ID" --windows-artifact-id "$COLLECTION_WINDOWS_ARTIFACT_ID" --gh-executable ci-out/collection-custody-tools/gh --gh-install-manifest ci-out/collection-custody-tools/gh-install-manifest.json --output ci-out/collection-provider
      - name: Verify exact three-platform collection authority
