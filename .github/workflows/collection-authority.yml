name: Collection Authority

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit for the collection readiness campaign
        required: true
        type: string

permissions:
  contents: read

env:
  HELL_SOURCE_COMMIT: ${{ inputs.candidate_sha }}

concurrency:
  group: collection-authority-${{ github.repository }}
  cancel-in-progress: false

jobs:
  linux-acquisition-subject:
    name: Collection Linux acquisition subject
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-subject.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact provider-head acquisition code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build collection acquisition verifier
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Acquire exact Linux release oracle
        run: ./target/ci/hell-ci release-oracle acquire --artifact ci-out/linux-release-oracle --provider-response ci-out/linux-release-provider.json --receipt ci-out/linux-release-oracle-receipt.json
      - name: Upload exact unsigned Linux acquisition subject
        id: upload-subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-linux-acquisition-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out
          if-no-files-found: error
          retention-days: 7

  sign-linux-acquisition:
    name: Sign collection Linux acquisition
    needs: linux-acquisition-subject
    if: ${{ github.ref == 'refs/heads/main' && needs.linux-acquisition-subject.result == 'success' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: linux-release-acquisition-signing
    outputs:
      artifact_id: ${{ steps.upload-signed.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact provider-head signer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build signer before receiving acquisition bytes
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Download exact unsigned Linux acquisition subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.linux-acquisition-subject.outputs.artifact_id }}
          path: ci-out
      - name: Install pinned Sigstore signer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign exact verified Linux release acquisition
        run: ./target/ci/hell-ci release-oracle attest --artifact ci-out/linux-release-oracle --provider-response ci-out/linux-release-provider.json --receipt ci-out/linux-release-oracle-receipt.json --attestation ci-out/linux-release-oracle-acquisition.dsse.json
      - name: Upload immutable signed Linux acquisition
        id: upload-signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-linux-acquisition-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out
          if-no-files-found: error
          retention-days: 30

  collection-authority-linux:
    name: Collection authority / Linux amd64
    needs: sign-linux-acquisition
    if: ${{ github.ref == 'refs/heads/main' && needs.sign-linux-acquisition.result == 'success' }}
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-collection-linux.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out trusted provider-head campaign harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify trusted provider-head checkout
        run: git merge-base --is-ancestor "$GITHUB_SHA" HEAD
      - name: Check out exact collection candidate as isolated subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: ci-work/candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact collection candidate checkout
        run: git -C ci-work/candidate merge-base --is-ancestor "$HELL_SOURCE_COMMIT" HEAD
      - name: Build trusted collection authority driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Build trusted collection process helper
        run: cargo build --locked --profile ci --package hell-testkit --bin hell-test-helper
      - name: Build isolated traced release candidate subject
        run: cargo build --locked --release --manifest-path ci-work/candidate/Cargo.toml --target-dir ci-out/candidate-target --package hell-cli --bin hell --features hell-cli/compat-tracing
      - name: Download exact signed Linux oracle acquisition
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.sign-linux-acquisition.outputs.artifact_id }}
          path: ci-out
      - name: Execute exact dormant collection campaign
        run: ./target/ci/hell-ci collection-authority collect --oracle ci-out/linux-release-oracle --oracle-sha256 5ccc78e62200eb5aea8b9da9161334c61848d0d3e7de2f270929920cfbf357c9 --candidate-executable ci-out/candidate-target/release/hell --candidate-commit "$HELL_SOURCE_COMMIT" --platform linux-amd64 --output ci-out/collection-shard/linux-amd64
      - name: Render canonical Linux collection provider subject
        run: ./target/ci/hell-ci collection-authority subject --input ci-out/collection-shard/linux-amd64 --platform linux-amd64 --output ci-out/collection-shard/linux-amd64/collection-evidence/provider-subject.json
      - name: Upload immutable Linux collection authority shard
        id: upload-collection-linux
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-authority-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/collection-shard/*
          if-no-files-found: error
          retention-days: 30

  collection-authority-macos:
    name: Collection authority / macOS arm64
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-collection-macos.outputs.artifact-id }}
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out trusted provider-head campaign harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify trusted provider-head checkout
        run: git merge-base --is-ancestor "$GITHUB_SHA" HEAD
      - name: Check out exact collection candidate as isolated subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: ci-work/candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact collection candidate checkout
        run: git -C ci-work/candidate merge-base --is-ancestor "$HELL_SOURCE_COMMIT" HEAD
      - name: Check out exact native collection oracle source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chrisdone/hell
          ref: 8e952cf9de4ab25d7716982a9ca234f9bdcf1bff
          path: ci-work/oracle-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned native collection Stack
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: 3.11.1
      - name: Build trusted collection authority driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Build trusted collection process helper
        run: cargo build --locked --profile ci --package hell-testkit --bin hell-test-helper
      - name: Build isolated traced release candidate subject
        run: cargo build --locked --release --manifest-path ci-work/candidate/Cargo.toml --target-dir ci-out/candidate-target --package hell-cli --bin hell --features hell-cli/compat-tracing
      - name: Build and retain exact native collection oracle
        run: ./target/ci/hell-ci collection-authority build-native --source ci-work/oracle-source --platform macos-arm64 --output ci-out/collection-shard/macos-arm64
      - name: Execute exact dormant collection campaign
        env:
          COLLECTION_ORACLE_SHA256: ${{ hashFiles('ci-out/collection-shard/macos-arm64/oracle/macos-arm64/hell') }}
        run: ./target/ci/hell-ci collection-authority collect --oracle ci-out/collection-shard/macos-arm64/oracle/macos-arm64/hell --oracle-sha256 "$COLLECTION_ORACLE_SHA256" --candidate-executable ci-out/candidate-target/release/hell --candidate-commit "$HELL_SOURCE_COMMIT" --platform macos-arm64 --output ci-out/collection-shard/macos-arm64
      - name: Render canonical macOS collection provider subject
        run: ./target/ci/hell-ci collection-authority subject --input ci-out/collection-shard/macos-arm64 --platform macos-arm64 --output ci-out/collection-shard/macos-arm64/collection-evidence/provider-subject.json
      - name: Upload immutable macOS collection authority shard
        id: upload-collection-macos
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-authority-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/collection-shard/*
          if-no-files-found: error
          retention-days: 30

  collection-authority-windows:
    name: Collection authority / Windows amd64
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-collection-windows.outputs.artifact-id }}
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Check out trusted provider-head campaign harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify trusted provider-head checkout
        run: git merge-base --is-ancestor "$env:GITHUB_SHA" HEAD
      - name: Check out exact collection candidate as isolated subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          path: ci-work/candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact collection candidate checkout
        run: git -C ci-work/candidate merge-base --is-ancestor "$env:HELL_SOURCE_COMMIT" HEAD
      - name: Check out exact native collection oracle source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chrisdone/hell
          ref: 8e952cf9de4ab25d7716982a9ca234f9bdcf1bff
          path: ci-work/oracle-source
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned native collection Stack
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: 3.11.1
      - name: Build trusted collection authority driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Build trusted collection process helper
        run: cargo build --locked --profile ci --package hell-testkit --bin hell-test-helper
      - name: Build isolated traced release candidate subject
        run: cargo build --locked --release --manifest-path ci-work/candidate/Cargo.toml --target-dir ci-out/candidate-target --package hell-cli --bin hell --features hell-cli/compat-tracing
      - name: Build and retain exact native collection oracle
        run: .\target\ci\hell-ci.exe collection-authority build-native --source ci-work\oracle-source --platform windows-amd64 --output ci-out\collection-shard\windows-amd64
      - name: Execute exact dormant collection campaign
        env:
          COLLECTION_ORACLE_SHA256: ${{ hashFiles('ci-out/collection-shard/windows-amd64/oracle/windows-amd64/hell.exe') }}
        run: .\target\ci\hell-ci.exe collection-authority collect --oracle ci-out\collection-shard\windows-amd64\oracle\windows-amd64\hell.exe --oracle-sha256 "$env:COLLECTION_ORACLE_SHA256" --candidate-executable ci-out\candidate-target\release\hell.exe --candidate-commit "$env:HELL_SOURCE_COMMIT" --platform windows-amd64 --output ci-out\collection-shard\windows-amd64
      - name: Render canonical Windows collection provider subject
        run: .\target\ci\hell-ci.exe collection-authority subject --input ci-out\collection-shard\windows-amd64 --platform windows-amd64 --output ci-out\collection-shard\windows-amd64\collection-evidence\provider-subject.json
      - name: Upload immutable Windows collection authority shard
        id: upload-collection-windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-authority-windows-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/collection-shard/*
          if-no-files-found: error
          retention-days: 30

  merge-collection-authority:
    name: Merge collection authority / Linux
    needs: [collection-authority-linux, collection-authority-macos, collection-authority-windows]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.collection-authority-linux.result == 'success' && needs.collection-authority-macos.result == 'success' && needs.collection-authority-windows.result == 'success' }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact collection importer and policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Acquire exact completed collection producer artifacts
        env:
          COLLECTION_LINUX_ARTIFACT_ID: ${{ needs.collection-authority-linux.outputs.artifact_id }}
          COLLECTION_MACOS_ARTIFACT_ID: ${{ needs.collection-authority-macos.outputs.artifact_id }}
          COLLECTION_WINDOWS_ARTIFACT_ID: ${{ needs.collection-authority-windows.outputs.artifact_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/collection_authority_acquire.py --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --provider-head "$GITHUB_SHA" --candidate-commit "$HELL_SOURCE_COMMIT" --workflow-path .github/workflows/collection-authority.yml --output ci-out/collection-provider --artifact "linux-amd64:collection-authority-linux-amd64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT:$COLLECTION_LINUX_ARTIFACT_ID" --artifact "macos-arm64:collection-authority-macos-arm64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT:$COLLECTION_MACOS_ARTIFACT_ID" --artifact "windows-amd64:collection-authority-windows-amd64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT:$COLLECTION_WINDOWS_ARTIFACT_ID"
      - name: Build offline collection authority verifier
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact three-platform collection authority
        run: ./target/ci/hell-ci collection-authority verify --input ci-out/native-shards --provider ci-out/collection-provider --report ci-out/native-shards/collection-authority.json
      - name: Attest canonical merged collection authority report
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ci-out/native-shards/collection-authority.json
      - name: Upload immutable merged collection authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-authority-merged-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-out/native-shards
            ci-out/collection-provider
          if-no-files-found: error
          retention-days: 30
