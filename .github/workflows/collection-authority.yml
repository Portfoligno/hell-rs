      - name: Compact verified collection campaign into canonical custody payload
        run: ./target/ci/hell-ci collection-authority compact --input ci-out/native-shards --provider ci-out/collection-provider --verified-report ci-out/native-shards/collection-authority.json --output ci-out/collection-custody
      - name: Attest only the canonical collection custody subject
        id: attest-collection-custody
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ci-out/collection-custody/custody-attestation-subject.json
      - name: Acquire and verify exact collection custody signature material
        env:
          COLLECTION_CUSTODY_BUNDLE_PATH: ${{ steps.attest-collection-custody.outputs.bundle-path }}
        run: ./target/ci/hell-ci collection-authority capture-custody-attestation --subject ci-out/collection-custody/custody-attestation-subject.json --bundle "$COLLECTION_CUSTODY_BUNDLE_PATH" --provider-head "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --gh-executable ci-out/collection-custody-tools/gh --gh-install-manifest ci-out/collection-custody-tools/gh-install-manifest.json --trusted-root ci-out/collection-custody-attestation-input/trusted-root.jsonl --trusted-root-provenance ci-out/collection-custody-attestation-input/trusted-root-provenance.json --raw-verification ci-out/collection-custody-attestation-input/online-verification.raw.json --online-verification ci-out/collection-custody-attestation-input/online-verification.json
      - name: Retain canonical non-authoritative custody handoff
        env:
          COLLECTION_CUSTODY_BUNDLE_PATH: ${{ steps.attest-collection-custody.outputs.bundle-path }}
        run: ./target/ci/hell-ci collection-authority retain-custody-attestation --package ci-out/collection-custody --bundle "$COLLECTION_CUSTODY_BUNDLE_PATH" --trusted-root ci-out/collection-custody-attestation-input/trusted-root.jsonl --trusted-root-provenance ci-out/collection-custody-attestation-input/trusted-root-provenance.json --online-verification ci-out/collection-custody-attestation-input/online-verification.json --gh-install-manifest ci-out/collection-custody-tools/gh-install-manifest.json --output ci-out/collection-custody-signature
      - name: Upload compact collection custody transport only
        id: upload-collection-custody
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-authority-custody-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-out/collection-custody
            ci-out/collection-custody-signature
          if-no-files-found: error
          retention-days: 30
      - name: Save collection merge Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-merge-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save collection merge Rust target cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-merge-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-authority.yml') }}

  assemble-custody-payload-overlay:
    name: Assemble commit-ready collection custody payload overlay
    needs: merge-collection-authority
    if: ${{ github.ref == 'refs/heads/main' && needs.merge-collection-authority.result == 'success' }}
    permissions:
      actions: read
      contents: read
    outputs:
      overlay_artifact_id: ${{ steps.upload-overlay.outputs.artifact-id }}
      overlay_artifact_digest: ${{ steps.upload-overlay.outputs.artifact-digest }}
      overlay_directory_sha256: ${{ steps.bind-overlay.outputs.directory_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact trusted overlay assembler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore payload overlay Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-payload-overlay-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore payload overlay compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
