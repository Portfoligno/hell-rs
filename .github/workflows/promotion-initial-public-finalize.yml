name: Initial public promotion finalizer

on:
  workflow_run:
    workflows:
      - Promotion surveillance
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: promotion-surveillance-current-state
  cancel-in-progress: false

jobs:
  finalize-completed-publication:
    if: ${{ github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
    outputs:
      completion_artifact_id: ${{ steps.upload-completion.outputs.artifact-id }}
      completion_artifact_digest: ${{ steps.upload-completion.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted completion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build trusted completion verifier
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Install pinned activation and transition verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Reverify exact activation, completed surveillance, and public endpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INITIAL_SURVEILLANCE_RUN_ID: ${{ github.event.workflow_run.id }}
          INITIAL_SURVEILLANCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PUBLIC_COMPATIBILITY_REPORT_BASE_URL: ${{ vars.PUBLIC_COMPATIBILITY_REPORT_BASE_URL }}
        run: ./target/ci/hell-ci custody-ops workflow-finalize-initial-surveillance
      - name: Retain immutable initial-public completion proof
        id: upload-completion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custody-initial-public-completion-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: |
            ci-out/initial-surveillance-completion.json
            ci-out/initial-surveillance-bootstrap
            ci-out/initial-surveillance-completion
            ci-out/initial-activation-source
          if-no-files-found: error
          retention-days: 90

  complete-provider-activation:
    needs: finalize-completed-publication
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: primary-worm
            environment: custody-primary-activation
            runner-label: custody-primary-activation
            role-variable: CUSTODY_PRIMARY_ACTIVATION_ROLE
            region-variable: CUSTODY_PRIMARY_REGION
          - provider: secondary-worm
            environment: custody-secondary-activation
            runner-label: custody-secondary-activation
            role-variable: CUSTODY_SECONDARY_ACTIVATION_ROLE
            region-variable: CUSTODY_SECONDARY_REGION
    environment: ${{ matrix.environment }}
    runs-on:
      - self-hosted
      - ${{ matrix.runner-label }}
    timeout-minutes: 30
    steps:
      - name: Check out trusted activation finalizer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build trusted activation finalizer
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Download exact immutable public completion proof
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.finalize-completed-publication.outputs.completion_artifact_id }}
          path: ci-out
      - name: Configure protected provider activation identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars[matrix.role-variable] }}
          aws-region: ${{ vars[matrix.region-variable] }}
      - name: Complete exact provider activation after public proof
        run: ./target/ci/hell-ci custody-ops workflow-complete-initial-activation

  reject-failed-publication:
    if: ${{ github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion != 'success' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted failure recorder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build trusted failure recorder
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Retain exact failed completion state
        env:
          INITIAL_SURVEILLANCE_RUN_ID: ${{ github.event.workflow_run.id }}
          INITIAL_SURVEILLANCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          INITIAL_SURVEILLANCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: ./target/ci/hell-ci custody-ops workflow-record-initial-surveillance-failure
      - name: Upload failed initial-public completion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custody-initial-public-failure-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ci-out/initial-surveillance-failure.json
          if-no-files-found: error
          retention-days: 90
      - name: Keep activation pending after failed public publication
        run: ./target/ci/hell-ci custody-ops workflow-require-initial-surveillance-success
