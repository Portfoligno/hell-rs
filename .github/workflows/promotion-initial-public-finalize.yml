name: Initial public promotion finalizer

on:
  workflow_dispatch:
    inputs:
      surveillance_run_id:
        description: Exact successful promotion-surveillance run ID
        required: true
        type: string
      surveillance_run_attempt:
        description: Exact successful promotion-surveillance run attempt
        required: true
        type: string
      selector_artifact_id:
        description: Immutable selector aggregate artifact ID from that run
        required: true
        type: string
      selector_archive_sha256:
        description: Provider archive digest for the selector aggregate
        required: true
        type: string
      selector_directory_sha256:
        description: Canonical extracted selector aggregate directory digest
        required: true
        type: string
      selector_source_sha:
        description: Exact promotion-surveillance provider workflow HEAD
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promotion-surveillance-current-state
  cancel-in-progress: false

jobs:
  finalize-completed-publication:
    if: ${{ github.ref == 'refs/heads/main' && inputs.selector_source_sha == github.sha }}
    permissions:
      actions: read
      contents: read
    outputs:
      completion_artifact_id: ${{ steps.upload-completion.outputs.artifact-id }}
      completion_artifact_digest: ${{ steps.upload-completion.outputs.artifact-digest }}
      completion_directory_sha256: ${{ steps.bind-completion.outputs.directory_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted completion verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build trusted completion verifier
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted completion verifier HEAD
        env:
          TRUSTED_DRIVER_SHA: ${{ github.sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$TRUSTED_DRIVER_SHA"
      - name: Download exact transition provider selector aggregate
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.surveillance_run_id }}
          artifact-ids: ${{ inputs.selector_artifact_id }}
          path: ci-in/provider-selector-updates
      - name: Verify transition provider selector update barrier
        env:
          ACTIVE_CUSTODY_PRIMARY_UPLOAD_RECEIPT: ${{ vars.ACTIVE_CUSTODY_PRIMARY_UPLOAD_RECEIPT }}
          ACTIVE_CUSTODY_SECONDARY_UPLOAD_RECEIPT: ${{ vars.ACTIVE_CUSTODY_SECONDARY_UPLOAD_RECEIPT }}
          CUSTODY_SELECTOR_AGGREGATE_ARCHIVE_SHA256: ${{ inputs.selector_archive_sha256 }}
          CUSTODY_SELECTOR_AGGREGATE_ARTIFACT_ID: ${{ inputs.selector_artifact_id }}
          CUSTODY_SELECTOR_AGGREGATE_CANDIDATE: ${{ inputs.selector_source_sha }}
          CUSTODY_SELECTOR_AGGREGATE_DIRECTORY_SHA256: ${{ inputs.selector_directory_sha256 }}
          CUSTODY_SELECTOR_AGGREGATE_EVENT: workflow_dispatch
          CUSTODY_SELECTOR_AGGREGATE_RUN_ATTEMPT: ${{ inputs.surveillance_run_attempt }}
          CUSTODY_SELECTOR_AGGREGATE_RUN_ID: ${{ inputs.surveillance_run_id }}
          CUSTODY_SELECTOR_AGGREGATE_WORKFLOW: .github/workflows/promotion-surveillance.yml
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci custody-ops workflow-verify-provider-selector-update-barrier
      - name: Install pinned activation and transition verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Reverify exact activation, completed surveillance, and public endpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INITIAL_SURVEILLANCE_RUN_ID: ${{ inputs.surveillance_run_id }}
          INITIAL_SURVEILLANCE_RUN_ATTEMPT: ${{ inputs.surveillance_run_attempt }}
          PUBLIC_COMPATIBILITY_REPORT_BASE_URL: ${{ vars.PUBLIC_COMPATIBILITY_REPORT_BASE_URL }}
        run: ./target/ci/hell-ci custody-ops workflow-finalize-initial-surveillance
      - name: Bind exact initial-public completion proof directory
        id: bind-completion
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out
      - name: Retain immutable initial-public completion proof
        id: upload-completion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custody-initial-public-completion-${{ inputs.surveillance_run_id }}-${{ inputs.surveillance_run_attempt }}
          path: |
            ci-out/initial-surveillance-completion.json
            ci-out/initial-surveillance-bootstrap
            ci-out/initial-surveillance-completion
            ci-out/initial-activation-source
          if-no-files-found: error
          retention-days: 90

  complete-provider-activation:
    needs: finalize-completed-publication
    if: ${{ github.ref == 'refs/heads/main' && inputs.selector_source_sha == github.sha && needs.finalize-completed-publication.result == 'success' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: primary-worm
            environment: custody-primary-activation
            trust-domain: organization-primary
            runner-label: custody-primary-activation
            default-receipt-variable: ACTIVE_CUSTODY_PRIMARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_PRIMARY_ACTIVATION_ROLE
            region-variable: CUSTODY_PRIMARY_REGION
          - provider: secondary-worm
            environment: custody-secondary-activation
            trust-domain: organization-secondary
            runner-label: custody-secondary-activation
            default-receipt-variable: ACTIVE_CUSTODY_SECONDARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_SECONDARY_ACTIVATION_ROLE
            region-variable: CUSTODY_SECONDARY_REGION
    environment: ${{ matrix.environment }}
    runs-on:
      - self-hosted
      - ${{ matrix.runner-label }}
    timeout-minutes: 30
    steps:
      - name: Check out trusted activation finalizer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build trusted activation finalizer
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted activation finalizer HEAD
        env:
          TRUSTED_DRIVER_SHA: ${{ github.sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$TRUSTED_DRIVER_SHA"
      - name: Download exact immutable public completion proof
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.finalize-completed-publication.outputs.completion_artifact_id }}
          path: ci-out
      - name: Verify exact public completion proof before provider credentials
        run: ./target/ci/hell-ci custody-ops workflow-verify-initial-completion
      - name: Seal exact completed-publication provider selector before credentials
        env:
          ACTIVE_CUSTODY_PROVIDER_SELECTOR: ${{ vars[matrix.default-receipt-variable] }}
          CUSTODY_PROVIDER_OPERATION: complete-initial-publication
          CUSTODY_EXPECTED_PROVIDER: ${{ matrix.provider }}
          CUSTODY_EXPECTED_TRUST_DOMAIN: ${{ matrix.trust-domain }}
        run: ./target/ci/hell-ci custody-ops workflow-prepare-provider-selector
      - name: Configure protected provider activation identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars[matrix.role-variable] }}
          aws-region: ${{ vars[matrix.region-variable] }}
      - name: Complete exact provider activation after public proof
        id: complete-activation
        run: ./target/ci/hell-ci custody-ops workflow-complete-initial-activation
      - name: Bind exact completed-publication selector directory
        id: bind-selector-update
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/provider-selector-update
      - name: Upload exact completed-publication provider selector
        id: upload-selector-update
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custody-provider-selector-update-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/provider-selector-update
          if-no-files-found: error
          retention-days: 90

  seal-provider-selector-updates:
    needs: complete-provider-activation
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/custody-provider-selector-seal.yml
    with:
      source_workflow: .github/workflows/promotion-initial-public-finalize.yml
