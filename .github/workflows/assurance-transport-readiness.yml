name: Assurance authentication transport readiness

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  assemble:
    if: ${{ github.ref == 'refs/heads/main' && github.workflow_ref == 'Portfoligno/hell-rs/.github/workflows/assurance-transport-readiness.yml@refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      directory_sha256: ${{ steps.digest.outputs.directory_sha256 }}
    steps:
      - name: Check out trusted current unprivileged probe assembler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build trusted unprivileged probe assembler
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Assemble isolated non-production probe subject
        run: ./target/ci/hell-ci auth-transport-probe subject --output ci-out/transport-subject
      - name: Bind probe subject directory
        id: digest
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/transport-subject
      - name: Upload isolated probe subject
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-transport-readiness-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/transport-subject
          if-no-files-found: error
          retention-days: 14

  seal:
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      directory_sha256: ${{ steps.digest.outputs.directory_sha256 }}
    steps:
      - name: Check out trusted current unprivileged packet sealer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build trusted packet verifier
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Download exact probe subject by immutable artifact ID
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_id }}
          path: ci-in/transport-subject
      - name: Replay subject artifact API, ZIP, tree, and workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_PROVIDER_ARTIFACT_ID: ${{ needs.assemble.outputs.artifact_id }}
          REGRESSION_PROVIDER_ARTIFACT_NAME: assurance-transport-readiness-subject-${{ github.run_id }}-${{ github.run_attempt }}
          REGRESSION_PROVIDER_DIRECTORY_SHA256: ${{ needs.assemble.outputs.directory_sha256 }}
          REGRESSION_PROVIDER_EVENT: workflow_dispatch
          REGRESSION_PROVIDER_HEAD_SHA: ${{ github.sha }}
          REGRESSION_PROVIDER_RUN_ATTEMPT: ${{ github.run_attempt }}
          REGRESSION_PROVIDER_RUN_ID: ${{ github.run_id }}
          REGRESSION_PROVIDER_WORKFLOW_PATH: .github/workflows/assurance-transport-readiness.yml
        run: ./target/ci/hell-ci regression-import select-subject --input ci-in/transport-subject --output ci-out/subject-selection
      - name: Bind live provider facts into isolated probe context
        run: ./target/ci/hell-ci auth-transport-probe context --input ci-in/transport-subject --from ci-out/subject-selection --output ci-out/transport-packets/context.json
      - name: Create exact isolated signer A packet
        run: ./target/ci/hell-ci auth-transport-probe packet --input ci-out/transport-packets/context.json --output ci-out/transport-packets/packet-a.json --role assurance-transport-probe-a --expected assurance-transport-probe-a:probe-a --policy compat/transport-probe/a/allowed_signers
      - name: Create exact isolated signer B packet
        run: ./target/ci/hell-ci auth-transport-probe packet --input ci-out/transport-packets/context.json --output ci-out/transport-packets/packet-b.json --role assurance-transport-probe-b --expected assurance-transport-probe-b:probe-b --policy compat/transport-probe/b/allowed_signers
      - name: Retain the exact seal-time subject selector inside the packet artifact
        run: cp -R ci-out/subject-selection ci-out/transport-packets/subject-selection
      - name: Bind sealed packet directory
        id: digest
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/transport-packets
      - name: Upload isolated sealed packets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-transport-readiness-packets-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/transport-packets
          if-no-files-found: error
          retention-days: 14

  sign-a:
    if: ${{ github.ref == 'refs/heads/main' && github.workflow_ref == 'Portfoligno/hell-rs/.github/workflows/assurance-transport-readiness.yml@refs/heads/main' }}
    needs: [assemble, seal]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/assurance-transport-signer-a.yml
    with:
      packet_artifact_id: ${{ needs.seal.outputs.artifact_id }}
      packet_directory_sha256: ${{ needs.seal.outputs.directory_sha256 }}
      parent_run_attempt: ${{ github.run_attempt }}
      parent_run_id: ${{ github.run_id }}
      subject_artifact_id: ${{ needs.assemble.outputs.artifact_id }}
      subject_directory_sha256: ${{ needs.assemble.outputs.directory_sha256 }}

  sign-b:
    if: ${{ github.ref == 'refs/heads/main' && github.workflow_ref == 'Portfoligno/hell-rs/.github/workflows/assurance-transport-readiness.yml@refs/heads/main' }}
    needs: [assemble, seal]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/assurance-transport-signer-b.yml
    with:
      packet_artifact_id: ${{ needs.seal.outputs.artifact_id }}
      packet_directory_sha256: ${{ needs.seal.outputs.directory_sha256 }}
      parent_run_attempt: ${{ github.run_attempt }}
      parent_run_id: ${{ github.run_id }}
      subject_artifact_id: ${{ needs.assemble.outputs.artifact_id }}
      subject_directory_sha256: ${{ needs.assemble.outputs.directory_sha256 }}

  verify:
    needs: [assemble, sign-a, sign-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted current isolated aggregate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build trusted aggregate verifier
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Install pinned Sigstore verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download exact subject and dual envelopes by immutable IDs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_id }}
          path: ci-in/transport-subject
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.sign-a.outputs.artifact_id }}
          path: ci-in/transport-envelope-a
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.sign-b.outputs.artifact_id }}
          path: ci-in/transport-envelope-b
      - name: Replay subject provider transport again at aggregate time
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_PROVIDER_ARTIFACT_ID: ${{ needs.assemble.outputs.artifact_id }}
          REGRESSION_PROVIDER_ARTIFACT_NAME: assurance-transport-readiness-subject-${{ github.run_id }}-${{ github.run_attempt }}
          REGRESSION_PROVIDER_DIRECTORY_SHA256: ${{ needs.assemble.outputs.directory_sha256 }}
          REGRESSION_PROVIDER_EVENT: workflow_dispatch
          REGRESSION_PROVIDER_HEAD_SHA: ${{ github.sha }}
          REGRESSION_PROVIDER_RUN_ATTEMPT: ${{ github.run_attempt }}
          REGRESSION_PROVIDER_RUN_ID: ${{ github.run_id }}
          REGRESSION_PROVIDER_WORKFLOW_PATH: .github/workflows/assurance-transport-readiness.yml
        run: ./target/ci/hell-ci regression-import select-subject --input ci-in/transport-subject --output ci-out/subject-selection
      - name: Replay signer A provider transport
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_PROVIDER_ARTIFACT_ID: ${{ needs.sign-a.outputs.artifact_id }}
          REGRESSION_PROVIDER_ARTIFACT_NAME: assurance-transport-readiness-envelope-a-${{ github.run_id }}-${{ github.run_attempt }}
          REGRESSION_PROVIDER_DIRECTORY_SHA256: ${{ needs.sign-a.outputs.directory_sha256 }}
          REGRESSION_PROVIDER_EVENT: workflow_dispatch
          REGRESSION_PROVIDER_HEAD_SHA: ${{ github.sha }}
          REGRESSION_PROVIDER_RUN_ATTEMPT: ${{ github.run_attempt }}
          REGRESSION_PROVIDER_RUN_ID: ${{ github.run_id }}
          REGRESSION_PROVIDER_WORKFLOW_PATH: .github/workflows/assurance-transport-readiness.yml
        run: ./target/ci/hell-ci regression-import select-subject --input ci-in/transport-envelope-a --output ci-out/envelope-a-selection
      - name: Replay signer B provider transport
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_PROVIDER_ARTIFACT_ID: ${{ needs.sign-b.outputs.artifact_id }}
          REGRESSION_PROVIDER_ARTIFACT_NAME: assurance-transport-readiness-envelope-b-${{ github.run_id }}-${{ github.run_attempt }}
          REGRESSION_PROVIDER_DIRECTORY_SHA256: ${{ needs.sign-b.outputs.directory_sha256 }}
          REGRESSION_PROVIDER_EVENT: workflow_dispatch
          REGRESSION_PROVIDER_HEAD_SHA: ${{ github.sha }}
          REGRESSION_PROVIDER_RUN_ATTEMPT: ${{ github.run_attempt }}
          REGRESSION_PROVIDER_RUN_ID: ${{ github.run_id }}
          REGRESSION_PROVIDER_WORKFLOW_PATH: .github/workflows/assurance-transport-readiness.yml
        run: ./target/ci/hell-ci regression-import select-subject --input ci-in/transport-envelope-b --output ci-out/envelope-b-selection
      - name: Verify dual independent transport and emit isolated receipt
        env:
          TRANSPORT_PROBE_A_DIRECTORY: ci-in/transport-envelope-a
          TRANSPORT_PROBE_A_SELECTION: ci-out/envelope-a-selection
          TRANSPORT_PROBE_B_DIRECTORY: ci-in/transport-envelope-b
          TRANSPORT_PROBE_B_SELECTION: ci-out/envelope-b-selection
          TRANSPORT_PROBE_SUBJECT_DIRECTORY: ci-in/transport-subject
          TRANSPORT_PROBE_SUBJECT_SELECTION: ci-out/subject-selection
        run: ./target/ci/hell-ci auth-transport-probe aggregate --input ci-in/transport-envelope-a/envelope.json --from ci-in/transport-envelope-b/envelope.json --policy compat/transport-probe/a/allowed_signers --to compat/transport-probe/b/allowed_signers --output ci-out/transport-receipt/receipt.json
      - name: Create isolated receipt provider directory
        run: install -d ci-out/transport-receipt/provider
      - name: Retain subject provider selection beside isolated receipt
        run: cp -R ci-out/subject-selection ci-out/transport-receipt/provider/subject
      - name: Retain signer A provider selection beside isolated receipt
        run: cp -R ci-out/envelope-a-selection ci-out/transport-receipt/provider/envelope-a
      - name: Retain signer B provider selection beside isolated receipt
        run: cp -R ci-out/envelope-b-selection ci-out/transport-receipt/provider/envelope-b
      - name: Retain signer A packet artifact beside isolated receipt
        run: cp -R ci-in/transport-envelope-a/packet-artifact ci-out/transport-receipt/signer-a-packet-artifact
      - name: Retain signer A packet provider selection beside isolated receipt
        run: cp -R ci-in/transport-envelope-a/packet-selection ci-out/transport-receipt/signer-a-packet-selection
      - name: Retain signer A subject provider selection beside isolated receipt
        run: cp -R ci-in/transport-envelope-a/subject-selection ci-out/transport-receipt/signer-a-subject-selection
      - name: Retain signer B packet artifact beside isolated receipt
        run: cp -R ci-in/transport-envelope-b/packet-artifact ci-out/transport-receipt/signer-b-packet-artifact
      - name: Retain signer B packet provider selection beside isolated receipt
        run: cp -R ci-in/transport-envelope-b/packet-selection ci-out/transport-receipt/signer-b-packet-selection
      - name: Retain signer B subject provider selection beside isolated receipt
        run: cp -R ci-in/transport-envelope-b/subject-selection ci-out/transport-receipt/signer-b-subject-selection
      - name: Upload non-production readiness receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-transport-readiness-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/transport-receipt
          if-no-files-found: error
          retention-days: 14
