name: Generate and review promotion evidence

on:
  workflow_dispatch:
    inputs:
      require_review:
        type: boolean
        required: true
        default: false
      candidate_sha:
        type: string
        required: true
      claim_decision_selector_json:
        description: Exact immutable decision artifact selector JSON
        type: string
        required: true
      divergence_decisions_json:
        description: Exact typed decisions for every retained mismatch candidate
        type: string
        required: true
      issued_at:
        type: string
        required: true
      native_run_id:
        type: string
        required: true
      native_run_attempt:
        type: string
        required: true
      native_artifact_id:
        type: string
        required: true
      native_package_sha256:
        type: string
        required: true
      acquisition_run_id:
        type: string
        required: true
      acquisition_run_attempt:
        type: string
        required: true
      acquisition_artifact_id:
        type: string
        required: true
      acquisition_package_sha256:
        type: string
        required: true
      mutation_run_id:
        type: string
        required: true
      mutation_run_attempt:
        type: string
        required: true
      mutation_artifact_id:
        type: string
        required: true
      mutation_package_sha256:
        type: string
        required: true
      mutation_event:
        type: choice
        required: true
        options: [workflow_dispatch, schedule]
      oracle_run_id:
        type: string
        required: true
      oracle_run_attempt:
        type: string
        required: true
      oracle_event:
        type: choice
        required: true
        options: [push, schedule, workflow_dispatch]
      oracle_macos_artifact_id:
        type: string
        required: true
      oracle_macos_package_sha256:
        type: string
        required: true
      oracle_windows_artifact_id:
        type: string
        required: true
      oracle_windows_package_sha256:
        type: string
        required: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  assemble:
    if: ${{ inputs.require_review }}
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-details.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-details.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-evidence-review-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore review compilation
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: promotion-evidence-review-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-evidence-review.yml') }}
      - name: Download exact merged native evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.native_run_id }}
          artifact-ids: ${{ inputs.native_artifact_id }}
          path: ci-out/evidence/native
      - name: Download exact acquisition review
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.acquisition_run_id }}
          artifact-ids: ${{ inputs.acquisition_artifact_id }}
          path: ci-out/evidence/acquisition
      - name: Download exact mutation report
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.mutation_run_id }}
          artifact-ids: ${{ inputs.mutation_artifact_id }}
          path: ci-out/evidence/coverage
      - name: Download exact macOS provenance
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.oracle_run_id }}
          artifact-ids: ${{ inputs.oracle_macos_artifact_id }}
          path: ci-out/evidence/provenance/macos-arm64
      - name: Download exact Windows provenance
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.oracle_run_id }}
          artifact-ids: ${{ inputs.oracle_windows_artifact_id }}
          path: ci-out/evidence/provenance/windows-amd64
      - name: Download exact externally authored claim decisions
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(inputs.claim_decision_selector_json).runId }}
          artifact-ids: ${{ fromJSON(inputs.claim_decision_selector_json).artifactId }}
          path: ci-out/evidence/claim-decisions
      - name: Build review driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Install pinned prior-state signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Retain authenticated prior public promotion state
        env:
          PUBLIC_COMPATIBILITY_REPORT_BASE_URL: ${{ vars.PUBLIC_COMPATIBILITY_REPORT_BASE_URL }}
        run: ./target/ci/hell-ci custody-ops workflow-retain-prior-public-transition
      - name: Verify exact provider source objects
        run: ./target/ci/hell-ci review-assemble prepare --github-dispatch-inputs
      - name: Derive claim coverage from retained observations
        run: ./target/ci/hell-ci case-coverage report --input ci-out/evidence/native --output ci-out/evidence/coverage/claim-coverage.details.json
      - name: Finalize exact reviewed applicability cells
        run: ./target/ci/hell-ci case-coverage finalize --input ci-out/evidence/coverage/claim-coverage.details.json --from ci-out/evidence/claim-decisions/claim-applicability-decisions.json --output ci-out/evidence/coverage/claim-coverage.finalized.json
      - name: Derive fail-closed divergence proposals from exact mismatch records
        run: ./target/ci/hell-ci divergence-verify report --input ci-out/evidence/coverage/claim-coverage.finalized.json --output ci-out/evidence/review/divergence-report.proposed.json
      - name: Upload immutable review details
        id: upload-details
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-promotion-review-details
          path: |
            ci-out/evidence/native
            ci-out/evidence/acquisition
            ci-out/evidence/claim-decisions
            ci-out/evidence/coverage
            ci-out/evidence/provenance
            ci-out/evidence/prior-public
            ci-out/evidence/review
          if-no-files-found: error
          retention-days: 30
      - name: Save Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-evidence-review-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save review compilation
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: promotion-evidence-review-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-evidence-review.yml') }}

  claim-review:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: divergence-approvals
    environment: compatibility-claim-review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload-review.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-review.outputs.artifact-digest }}
    steps:
      - name: Check out trusted current claim review automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download immutable review details
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.divergence-approvals.outputs.artifact_id }}
          path: ci-out/evidence
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-claim-review-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore claim review compilation
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: promotion-claim-review-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-evidence-review.yml') }}
      - name: Build trusted claim review driver before loading review credentials
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Load protected claim reviewer SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CLAIM_REVIEWER_SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Install pinned Sigstore verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Retain claim reviewer authorization
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEW_AUTHORIZATION_GITHUB_TOKEN }}
        run: ./target/ci/hell-ci review-authorization --input ci-out/evidence/coverage/claim-coverage.finalized.json --output ci-out/evidence/review/auth/claim/authorization.json --role claim-reviewer --github-dispatch-inputs
      - name: Create claim review packet
        run: ./target/ci/hell-ci review-packet --input ci-out/evidence/coverage/claim-coverage.finalized.json --from ci-out/evidence/review/auth/claim/authorization.json --output ci-out/evidence/review/auth/claim/review-packet.json --role claim-reviewer --decision accept --github-dispatch-inputs
      - name: Sign claim review packet
        run: ./target/ci/hell-ci review-sign --input ci-out/evidence/review/auth/claim/review-packet.json --output ci-out/evidence/review/auth/claim/review.dsse.json --role claim-reviewer --decision accept --policy ci-out/evidence/review/auth/claim/reviewer.allowed_signers
      - name: Bind claim review to exact details
        run: ./target/ci/hell-ci review-bind --input ci-out/evidence/coverage/claim-coverage.finalized.json --from ci-out/evidence/review/auth/claim/review.dsse.json --output ci-out/evidence/coverage/claim-coverage.json --category claim-coverage --policy ci-out/evidence/review/auth/claim/reviewer.allowed_signers
      - name: Upload immutable claim review
        id: upload-review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-review-claim
          path: |
            ci-out/evidence/coverage/claim-coverage.json
            ci-out/evidence/review/auth/claim
          if-no-files-found: error
          retention-days: 30
      - name: Save Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-claim-review-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save claim review compilation
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: promotion-claim-review-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-evidence-review.yml') }}

  normalizer-review:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: divergence-approvals
    environment: compatibility-normalizer-review
    outputs:
      artifact_id: ${{ steps.upload-review.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-review.outputs.artifact-digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted current normalizer review automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download immutable review details
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.divergence-approvals.outputs.artifact_id }}
          path: ci-out/evidence
      - name: Restore specialist Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-normalizer-review-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore specialist review compilation
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: promotion-normalizer-review-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-evidence-review.yml') }}
      - name: Build trusted specialist review driver before loading review credentials
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Load protected specialist reviewer SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.NORMALIZER_REVIEWER_SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Install pinned Sigstore verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Retain normalizer reviewer authorization
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEW_AUTHORIZATION_GITHUB_TOKEN }}
        run: ./target/ci/hell-ci review-authorization --input ci-out/evidence/coverage/normalizer-audit.details.json --output ci-out/evidence/review/auth/normalizer/authorization.json --role normalizer-reviewer --github-dispatch-inputs
      - name: Create and retain normalizer review
        run: ./target/ci/hell-ci review-packet --input ci-out/evidence/coverage/normalizer-audit.details.json --from ci-out/evidence/review/auth/normalizer/authorization.json --output ci-out/evidence/review/auth/normalizer/review-packet.json --role normalizer-reviewer --decision accept --github-dispatch-inputs
      - name: Sign normalizer review
        run: ./target/ci/hell-ci review-sign --input ci-out/evidence/review/auth/normalizer/review-packet.json --output ci-out/evidence/review/auth/normalizer/review.dsse.json --role normalizer-reviewer --decision accept --policy ci-out/evidence/review/auth/normalizer/reviewer.allowed_signers
      - name: Bind normalizer review
        run: ./target/ci/hell-ci review-bind --input ci-out/evidence/coverage/normalizer-audit.details.json --from ci-out/evidence/review/auth/normalizer/review.dsse.json --output ci-out/evidence/coverage/normalizer-audit.json --category normalizer-audit --policy ci-out/evidence/review/auth/normalizer/reviewer.allowed_signers
      - name: Upload immutable specialist review
        id: upload-review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-review-normalizer
          path: ci-out/evidence
          if-no-files-found: error
          retention-days: 30
      - name: Save specialist Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-normalizer-review-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save specialist review compilation
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: promotion-normalizer-review-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-evidence-review.yml') }}

  divergence-review:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: assemble
    permissions:
      actions: read
      contents: read
      issues: read
    environment: compatibility-divergence-review
    outputs:
      artifact_id: ${{ steps.upload-review.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-review.outputs.artifact-digest }}
      platform_required: ${{ steps.role-plan.outputs.platform_required }}
      implementation_required: ${{ steps.role-plan.outputs.implementation_required }}
      product_required: ${{ steps.role-plan.outputs.product_required }}
      security_required: ${{ steps.role-plan.outputs.security_required }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted current divergence review automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download immutable review details
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_id }}
          path: ci-out/evidence
      - name: Restore divergence reviewer Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: promotion-divergence-review-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore divergence reviewer target
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: promotion-divergence-review-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-evidence-review.yml') }}
      - name: Build trusted divergence review driver before loading review credentials
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Load protected divergence reviewer SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DIVERGENCE_REVIEWER_SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Install pinned Sigstore verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Apply exact protected divergence decisions
        run: ./target/ci/hell-ci divergence-verify accept --input ci-out/evidence/review/divergence-report.proposed.json --output ci-out/evidence/review/divergence-report.details.json --github-dispatch-inputs
      - name: Derive exact divergence approval role plan
        id: role-plan
        run: ./target/ci/hell-ci divergence-verify role-plan --input ci-out/evidence/review/divergence-report.details.json
      - name: Retain divergence reviewer authorization
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEW_AUTHORIZATION_GITHUB_TOKEN }}
        run: ./target/ci/hell-ci review-authorization --input ci-out/evidence/review/divergence-report.details.json --output ci-out/evidence/review/auth/divergence/authorization.json --role divergence-reviewer --github-dispatch-inputs
      - name: Apply accepted divergences to exact claim cells
        run: ./target/ci/hell-ci divergence-verify apply --input ci-out/evidence/coverage/claim-coverage.finalized.json --from ci-out/evidence/review/divergence-report.details.json --output ci-out/evidence/coverage/claim-coverage.finalized.json
      - name: Derive post-decision normalizer audit
        run: ./target/ci/hell-ci normalizer-audit report --input ci-out/evidence/coverage/claim-coverage.finalized.json --output ci-out/evidence/coverage/normalizer-audit.details.json
      - name: Derive post-decision residual risk
        run: ./target/ci/hell-ci residual-risk report --input ci-out/evidence/coverage --output ci-out/evidence/coverage/residual-risk.details.json
      - name: Create exact divergence review
        run: ./target/ci/hell-ci review-packet --input ci-out/evidence/review/divergence-report.details.json --from ci-out/evidence/review/auth/divergence/authorization.json --output ci-out/evidence/review/auth/divergence/review-packet.json --role divergence-reviewer --decision accept --github-dispatch-inputs
      - name: Sign exact divergence review
