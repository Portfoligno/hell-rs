name: Seal custody provider selector updates

on:
  workflow_call:
    inputs:
      source_workflow:
        required: true
        type: string
    outputs:
      artifact_id:
        value: ${{ jobs.seal.outputs.artifact_id }}
      artifact_digest:
        value: ${{ jobs.seal.outputs.artifact_digest }}
      directory_sha256:
        value: ${{ jobs.seal.outputs.directory_sha256 }}

permissions:
  contents: read

jobs:
  seal:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      directory_sha256: ${{ steps.bind.outputs.directory_sha256 }}
    steps:
      - name: Check out exact trusted provider selector sealer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build trusted provider selector sealer
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted provider selector sealer HEAD
        env:
          TRUSTED_DRIVER_SHA: ${{ github.sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$TRUSTED_DRIVER_SHA"
      - name: Select exact immutable provider selector updates
        id: select
        env:
          CUSTODY_SELECTOR_SOURCE_WORKFLOW: ${{ inputs.source_workflow }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci custody-ops workflow-select-provider-selector-updates
      - name: Download exact primary provider selector update
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ steps.select.outputs.primary-artifact-id }}
          path: ci-in/provider-selector-updates/primary-worm
      - name: Download exact secondary provider selector update
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ steps.select.outputs.secondary-artifact-id }}
          path: ci-in/provider-selector-updates/secondary-worm
      - name: Assemble exact two-provider selector update bundle
        run: ./target/ci/hell-ci custody-ops workflow-assemble-provider-selector-updates
      - name: Bind exact two-provider selector update directory
        id: bind
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/provider-selector-updates
      - name: Upload immutable two-provider selector update bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custody-provider-selectors-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/provider-selector-updates
          if-no-files-found: error
          retention-days: 90
