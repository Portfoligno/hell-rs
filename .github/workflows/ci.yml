          key: readiness-verify-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('automation/rust-toolchain.toml', 'automation/Cargo.lock', 'automation/Cargo.toml', 'automation/crates/**/Cargo.toml', 'automation/**/build.rs', 'automation/.cargo/**', 'automation/crates/**/*.rs', 'automation/builtins/**', 'automation/compat/**', 'automation/fixtures/**', 'automation/baseline.toml', 'automation/deny.toml', 'automation/release-policy.toml', 'automation/spec/**', 'automation/.github/**') }}
