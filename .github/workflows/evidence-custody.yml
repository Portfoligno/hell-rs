        run: ./target/ci/hell-ci review-authorization --input ci-out/evidence/review/graph-review-subject.json --output ci-out/evidence/review/auth/role-graph/authorization.json --role review-graph-reviewer --category final-review-graph --github-dispatch-inputs
      - name: Create exact final graph and claim-group review packet
        run: ./target/ci/hell-ci review-packet --input ci-out/evidence/review/graph-review-subject.json --from ci-out/evidence/review/auth/role-graph/authorization.json --output ci-out/evidence/review/auth/role-graph/review-packet.json --role review-graph-reviewer --category claim-groups --decision accept --github-dispatch-inputs
      - name: Load protected final graph reviewer SSH key after exact packet finalization
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.REVIEW_GRAPH_REVIEWER_SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Install pinned Sigstore verifier after exact packet finalization
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Sign exact final graph and claim-group review packet
        run: ./target/ci/hell-ci review-sign --input ci-out/evidence/review/auth/role-graph/review-packet.json --output ci-out/evidence/review/auth/role-graph/review.dsse.json --role review-graph-reviewer --decision accept --policy ci-out/evidence/review/auth/role-graph/reviewer.allowed_signers
      - name: Bind exact final policy action graph review
        run: ./target/ci/hell-ci review-bind --input ci-out/evidence/review/role-graph.details.json --from ci-out/evidence/review/auth/role-graph/review.dsse.json --output ci-out/evidence/review/role-graph.json --category review-role-graph --policy ci-out/evidence/review/auth/role-graph/reviewer.allowed_signers
      - name: Verify final graph and offline packet round trip
        run: ./target/ci/hell-ci offline-review-ops workflow-package
      - name: Reverify final role graph with the promotion gate comparator
        run: ./target/ci/hell-ci review-graph --action verify --input ci-out --policy compat/reviews.allowed_signers
      - name: Bind exact proposal-ready reviewed evidence directory
        id: bind-reviewed
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/evidence
      - name: Upload proposal-ready reviewed evidence
        id: upload-reviewed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-final-reviewed-evidence
          path: ci-out/evidence
          if-no-files-found: error
          retention-days: 30
      - name: Save final graph approval Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: final-review-graph-approval-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save final graph approval Rust target cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: final-review-graph-approval-target-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/evidence-custody.yml') }}

  activate-final-record:
    if: ${{ github.ref == 'refs/heads/main' && inputs.artifact_class == 'final-promotion-record' }}
    needs: review-and-assemble
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: primary-worm
            environment: custody-primary-activation
            trust-domain: organization-primary
            runner-label: custody-primary-activation
            default-receipt-variable: ACTIVE_CUSTODY_PRIMARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_PRIMARY_ACTIVATION_ROLE
            region-variable: CUSTODY_PRIMARY_REGION
          - provider: secondary-worm
            environment: custody-secondary-activation
            trust-domain: organization-secondary
            runner-label: custody-secondary-activation
            default-receipt-variable: ACTIVE_CUSTODY_SECONDARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_SECONDARY_ACTIVATION_ROLE
            region-variable: CUSTODY_SECONDARY_REGION
    environment: ${{ matrix.environment }}
    runs-on:
      - self-hosted
      - ${{ matrix.runner-label }}
    timeout-minutes: 30
    steps:
      - name: Check out trusted current activation automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download verified final custody gate
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          name: promotion-custody-evidence
          path: ci-out/custody
      - name: Restore activation Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: custody-activation-cargo-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore activation Rust target cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: custody-activation-target-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/evidence-custody.yml') }}
      - name: Build assurance driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted final activation driver HEAD
        env:
          TRUSTED_DRIVER_SHA: ${{ github.sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$TRUSTED_DRIVER_SHA"
      - name: Reverify exact two-provider final custody gate
        run: ./target/ci/hell-ci custody verify --input ci-out/custody/custody-receipt.json --policy compat/reviews.allowed_signers
      - name: Seal exact activation provider selector before credentials
        env:
          ACTIVE_CUSTODY_PROVIDER_SELECTOR: ${{ vars[matrix.default-receipt-variable] }}
          CUSTODY_PROVIDER_OPERATION: activation
          CUSTODY_EXPECTED_PROVIDER: ${{ matrix.provider }}
          CUSTODY_EXPECTED_TRUST_DOMAIN: ${{ matrix.trust-domain }}
        run: ./target/ci/hell-ci custody-ops workflow-prepare-provider-selector
      - name: Configure protected activation identity after building the trusted driver
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars[matrix.role-variable] }}
          aws-region: ${{ vars[matrix.region-variable] }}
      - name: Activate exact immutable final receipt version
        run: ./target/ci/hell-ci custody-ops workflow-activate
      - name: Prepare signed activation receipt packet
        run: ./target/ci/hell-ci custody-ops workflow-activation-packet
      - name: Install pinned Cosign after activation packet finalization
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Load protected primary activation SSH key after packet finalization
        if: ${{ matrix.provider == 'primary-worm' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CUSTODY_PRIMARY_ACTIVATION_SSH_PRIVATE_KEY }}
      - name: Load protected secondary activation SSH key after packet finalization
        if: ${{ matrix.provider == 'secondary-worm' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CUSTODY_SECONDARY_ACTIVATION_SSH_PRIVATE_KEY }}
      - name: Require protected activation SSH agent
        run: ssh-add -L
      - name: Sign primary activation receipt
        if: ${{ matrix.provider == 'primary-worm' }}
        run: ./target/ci/hell-ci review-sign --input ci-out/custody-activation/primary-worm/activation-packet.json --output ci-out/custody-activation/primary-worm/activation-receipt.dsse.json --role custody-provider --decision accept --policy compat/reviews.allowed_signers
      - name: Sign secondary activation receipt
        if: ${{ matrix.provider == 'secondary-worm' }}
        run: ./target/ci/hell-ci review-sign --input ci-out/custody-activation/secondary-worm/activation-packet.json --output ci-out/custody-activation/secondary-worm/activation-receipt.dsse.json --role custody-provider --decision accept --policy compat/reviews.allowed_signers
      - name: Verify primary signed activation receipt
        if: ${{ matrix.provider == 'primary-worm' }}
        run: ./target/ci/hell-ci review-verify --input ci-out/custody-activation/primary-worm/activation-receipt.dsse.json --policy compat/reviews.allowed_signers --role custody-provider
      - name: Verify secondary signed activation receipt
        if: ${{ matrix.provider == 'secondary-worm' }}
        run: ./target/ci/hell-ci review-verify --input ci-out/custody-activation/secondary-worm/activation-receipt.dsse.json --policy compat/reviews.allowed_signers --role custody-provider
      - name: Commit signed pending activation to protected provider context
        id: commit-activation
        run: ./target/ci/hell-ci custody-ops workflow-commit-activation
      - name: Bind exact updated provider selector directory
        id: bind-selector-update
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/provider-selector-update
      - name: Upload exact updated provider selector
        id: upload-selector-update
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custody-provider-selector-update-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/provider-selector-update
          if-no-files-found: error
          retention-days: 90
      - name: Upload activation audit receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custody-final-activation-${{ matrix.provider }}
          path: ci-out/custody-activation/${{ matrix.provider }}
          if-no-files-found: error
          retention-days: 30
      - name: Save activation Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: custody-activation-cargo-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save activation Rust target cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: custody-activation-target-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/evidence-custody.yml') }}

  seal-provider-selector-updates:
    needs: activate-final-record
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/custody-provider-selector-seal.yml
    with:
      source_workflow: .github/workflows/evidence-custody.yml
