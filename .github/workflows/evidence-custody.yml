      - name: Build two-provider custody review core
        run: ./target/ci/hell-ci custody-ops review-core --input ci-out/custody/transport/custody-package --first-receipt ci-out/custody/primary-worm/provider-receipt.dsse.json --second-receipt ci-out/custody/secondary-worm/provider-receipt.dsse.json --output ci-out/custody/review-core.json
      - name: Prepare custody review signature packet
