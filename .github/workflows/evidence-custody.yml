          key: final-review-graph-approval-target-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/evidence-custody.yml') }}
      - name: Build trusted assurance driver before loading review credentials
