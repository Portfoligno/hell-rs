      - name: Require protected custody-review SSH agent
        run: ssh-add -L
      - name: Sign custody review
        run: ./target/ci/hell-ci review-sign --input ci-out/custody/review-packet.authorized.json --output ci-out/custody/custody-review.dsse.json --role custody-reviewer --decision accept --policy ci-out/custody/reviewer.allowed_signers
      - name: Assemble exact custody gate receipt
        run: ./target/ci/hell-ci custody-ops gate-record --input ci-out/custody/retained/transport/custody-package --first ci-out/custody/retained/primary-worm/copy-record.json --second ci-out/custody/retained/secondary-worm/copy-record.json --first-receipt ci-out/custody/retained/primary-worm/provider-receipt.dsse.json --second-receipt ci-out/custody/retained/secondary-worm/provider-receipt.dsse.json --review ci-out/custody/custody-review.dsse.json --output ci-out/custody/custody-receipt.json
      - name: Verify exact two-provider gate receipt
