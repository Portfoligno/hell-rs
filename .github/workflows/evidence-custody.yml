name: Durable evidence custody

on:
  workflow_dispatch:
    inputs:
      artifact_class:
        description: Evidence before proposal review or the final promotion record
        required: true
        type: choice
        options:
          - pre-review-evidence
          - final-promotion-record
          - collection-custody
      source_run_id:
        description: Run containing the pre-review merged evidence package
        required: true
        type: string
      source_run_attempt:
        description: Exact producing workflow run attempt
        required: true
        type: string
      provider_artifact_id:
        description: Immutable provider artifact ID
        required: true
        type: string
      provider_archive_sha256:
        description: Exact provider archive digest for the immutable artifact
        required: true
        type: string
      expected_artifact_set_sha256:
        description: Expected canonical downloaded directory SHA-256
        required: true
        type: string
      candidate_sha:
        description: Exact candidate commit
        required: true
        type: string
      acquisition_time:
        description: UTC time at which the provider artifact is acquired
        required: true
        type: string
      retention_until:
        description: UTC Object Lock retention date meeting committed policy
        required: true
        type: string
      review_issued_at:
        description: UTC timestamp for signed provider receipts
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promotion-surveillance-current-state
  cancel-in-progress: false

jobs:
  package:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload-package.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-package.outputs.artifact-digest }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore custody Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: custody-package-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore custody Rust target cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: custody-package-target-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/evidence-custody.yml') }}
      - name: Download exact reviewed evidence
        if: ${{ inputs.artifact_class != 'collection-custody' }}
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          artifact-ids: ${{ inputs.provider_artifact_id }}
          path: ci-out/source/evidence
      - name: Build assurance driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Install pinned active-review verifier
        if: ${{ inputs.artifact_class != 'collection-custody' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Verify current repository assurance locks
        if: ${{ inputs.artifact_class != 'collection-custody' }}
        run: ./target/ci/hell-ci assurance-verify --output ci-out/assurance-policy.json
      - name: Retain exact collection epoch
        if: ${{ inputs.artifact_class != 'collection-custody' }}
        run: ./target/ci/hell-ci evidence-epoch write --output ci-out/assurance-epoch.json
      - name: Verify pre-review evidence provider identity and archive metadata
        if: ${{ inputs.artifact_class == 'pre-review-evidence' }}
        run: ./target/ci/hell-ci artifact-acquire primary --input ci-out/source/evidence --output ci-out/source/receipt-primary.json --artifact promotion-review-ready-evidence --github-dispatch-inputs
      - name: Verify final promotion record provider identity and archive metadata
        if: ${{ inputs.artifact_class == 'final-promotion-record' }}
        run: ./target/ci/hell-ci artifact-acquire primary --input ci-out/source/evidence --output ci-out/source/receipt-primary.json --artifact promotion-record --github-dispatch-inputs
      - name: Package deterministic evidence
        if: ${{ inputs.artifact_class != 'collection-custody' }}
        run: ./target/ci/hell-ci custody-ops workflow-package
      - name: Verify exact collection custody checkout
        if: ${{ inputs.artifact_class == 'collection-custody' }}
        env:
          COLLECTION_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$COLLECTION_CANDIDATE_SHA"
      - name: Build trusted collection process helper
        if: ${{ inputs.artifact_class == 'collection-custody' }}
        run: cargo build --locked --profile ci --package hell-testkit --bin hell-test-helper
      - name: Build exact current traced collection candidate
        if: ${{ inputs.artifact_class == 'collection-custody' }}
        run: cargo build --locked --release --package hell-cli --bin hell --features hell-cli/compat-tracing
      - name: Prepare exact verified collection WORM package
        if: ${{ inputs.artifact_class == 'collection-custody' }}
        run: ./target/ci/hell-ci collection-authority prepare-worm-custody --package compat/collection-custody/payload --signature compat/collection-custody/signature --candidate-executable target/release/hell --integration-proof compat/collection-custody/integration-proof.tsv --integration-review compat/collection-custody/integration-review.dsse.json --output ci-out
      - name: Upload ephemeral custody transport package
        id: upload-package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-custody-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-out/custody-package
            ci-out/subject
            ci-out/assurance-epoch.json
            ci-out/assurance-epoch.json.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Save custody Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: custody-package-cargo-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save custody Rust target cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: custody-package-target-v1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/evidence-custody.yml') }}

  upload:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: package
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: primary-worm
            trust-domain: organization-primary
            environment: custody-primary-upload
            runner-label: custody-primary-upload
            provider-selector-variable: CUSTODY_PRIMARY_PROVIDER_SELECTOR
            role-variable: CUSTODY_PRIMARY_UPLOAD_ROLE
            bucket-variable: CUSTODY_PRIMARY_BUCKET
            region-variable: CUSTODY_PRIMARY_REGION
          - provider: secondary-worm
            trust-domain: organization-secondary
            environment: custody-secondary-upload
            runner-label: custody-secondary-upload
            provider-selector-variable: CUSTODY_SECONDARY_PROVIDER_SELECTOR
            role-variable: CUSTODY_SECONDARY_UPLOAD_ROLE
            bucket-variable: CUSTODY_SECONDARY_BUCKET
            region-variable: CUSTODY_SECONDARY_REGION
    environment: ${{ matrix.environment }}
    runs-on:
      - self-hosted
      - ${{ matrix.runner-label }}
    timeout-minutes: 45
    steps:
      - name: Check out trusted current custody upload automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download custody package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: ci-out
      - name: Restore provider upload Cargo dependency cache
        id: upload-cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: custody-upload-cargo-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore provider upload Rust target cache
        id: upload-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: custody-upload-target-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/evidence-custody.yml') }}
      - name: Build assurance driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Validate exact prepared custody package before provider credentials
        run: ./target/ci/hell-ci custody-ops verify-package --input ci-out/custody-package
      - name: Seal exact upload provider selector before credentials
        env:
          ACTIVE_CUSTODY_PROVIDER_SELECTOR: ${{ vars[matrix.provider-selector-variable] }}
          CUSTODY_PROVIDER_OPERATION: upload
          CUSTODY_EXPECTED_PROVIDER: ${{ matrix.provider }}
          CUSTODY_EXPECTED_TRUST_DOMAIN: ${{ matrix.trust-domain }}
        run: ./target/ci/hell-ci custody-ops workflow-prepare-provider-selector
      - name: Configure provider workload identity after building the trusted driver
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars[matrix.role-variable] }}
          aws-region: ${{ vars[matrix.region-variable] }}
      - name: Upload immutable content-addressed copy
        run: ./target/ci/hell-ci custody-ops workflow-upload
      - name: Prepare signed upload receipt packet
        run: ./target/ci/hell-ci custody-ops workflow-upload-packet
      - name: Install pinned Cosign after upload packet finalization
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Load protected primary provider upload SSH key after packet finalization
        if: ${{ matrix.provider == 'primary-worm' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CUSTODY_PRIMARY_UPLOAD_SSH_PRIVATE_KEY }}
      - name: Load protected secondary provider upload SSH key after packet finalization
        if: ${{ matrix.provider == 'secondary-worm' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CUSTODY_SECONDARY_UPLOAD_SSH_PRIVATE_KEY }}
      - name: Require protected provider upload SSH agent
        run: ssh-add -L
      - name: Sign upload receipt
        run: ./target/ci/hell-ci review-sign --input ci-out/upload-receipt-packet.json --output ci-out/upload-receipt.dsse.json --role custody-provider --decision accept --policy compat/reviews.allowed_signers
      - name: Upload ephemeral provider receipt transport
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-custody-upload-${{ matrix.provider }}
          path: |
            ci-out/upload-receipt.json
            ci-out/upload-receipt-provider-pointer.json
            ci-out/upload-receipt-packet.json
            ci-out/upload-receipt.dsse.json
          if-no-files-found: error
          retention-days: 7
      - name: Save provider upload Cargo dependency cache
        if: ${{ always() && steps.upload-cargo-cache.outcome == 'success' && steps.upload-cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: custody-upload-cargo-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save provider upload Rust target cache
        if: ${{ always() && steps.upload-target-cache.outcome == 'success' && steps.upload-target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: custody-upload-target-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/evidence-custody.yml') }}

  retrieve:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: upload
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: primary-worm
            trust-domain: organization-primary
            environment: custody-primary-retrieval
            runner-label: custody-primary-retrieval
            role-variable: CUSTODY_PRIMARY_RETRIEVAL_ROLE
            bucket-variable: CUSTODY_PRIMARY_BUCKET
            region-variable: CUSTODY_PRIMARY_REGION
          - provider: secondary-worm
            trust-domain: organization-secondary
            environment: custody-secondary-retrieval
            runner-label: custody-secondary-retrieval
            role-variable: CUSTODY_SECONDARY_RETRIEVAL_ROLE
            bucket-variable: CUSTODY_SECONDARY_BUCKET
            region-variable: CUSTODY_SECONDARY_REGION
    environment: ${{ matrix.environment }}
    runs-on:
      - self-hosted
      - ${{ matrix.runner-label }}
    timeout-minutes: 45
    steps:
      - name: Check out trusted current custody retrieval automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download exact provider upload receipt
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          name: ephemeralEvidence-custody-upload-${{ matrix.provider }}
          path: ci-out/custody/current/upload
      - name: Restore provider retrieval Cargo dependency cache
        id: retrieval-cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: custody-retrieval-cargo-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore provider retrieval Rust target cache
        id: retrieval-target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: custody-retrieval-target-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/evidence-custody.yml') }}
      - name: Build assurance driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Validate exact signed upload subject before provider credentials
        env:
          CUSTODY_EXPECTED_PROVIDER: ${{ matrix.provider }}
          CUSTODY_EXPECTED_TRUST_DOMAIN: ${{ matrix.trust-domain }}
        run: ./target/ci/hell-ci custody-ops workflow-verify-upload-subject
      - name: Configure independent retrieval identity after building the trusted driver
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars[matrix.role-variable] }}
          aws-region: ${{ vars[matrix.region-variable] }}
      - name: Independently retrieve and verify provider manifest first
        run: ./target/ci/hell-ci custody-ops workflow-retrieve
      - name: Derive exact gate custody copy from provider evidence
        run: ./target/ci/hell-ci custody-ops workflow-copy-record
      - name: Prepare signed retrieval receipt packet
        run: ./target/ci/hell-ci custody-ops workflow-provider-packet
      - name: Derive candidate-scoped initial current scrub
        run: ./target/ci/hell-ci custody-ops workflow-initial-scrub
      - name: Prepare candidate-scoped current scrub packet
        run: ./target/ci/hell-ci custody-ops workflow-initial-scrub-packet
      - name: Install pinned Cosign after retrieval packet finalization
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Load protected primary provider retrieval SSH key after packet finalization
        if: ${{ matrix.provider == 'primary-worm' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CUSTODY_PRIMARY_RETRIEVAL_SSH_PRIVATE_KEY }}
      - name: Load protected secondary provider retrieval SSH key after packet finalization
        if: ${{ matrix.provider == 'secondary-worm' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CUSTODY_SECONDARY_RETRIEVAL_SSH_PRIVATE_KEY }}
      - name: Require protected provider retrieval SSH agent
        run: ssh-add -L
      - name: Sign retrieval receipt
        run: ./target/ci/hell-ci review-sign --input ci-out/custody/current/provider-packet.json --output ci-out/custody/current/provider-receipt.dsse.json --role custody-provider --decision accept --policy compat/reviews.allowed_signers
      - name: Sign candidate-scoped current scrub receipt
        run: ./target/ci/hell-ci review-sign --input ci-out/custody-maintenance-packet.json --output ci-out/custody-maintenance-receipt.dsse.json --role custody-provider --decision accept --policy compat/reviews.allowed_signers
      - name: Stage canonical candidate-scoped current scrub package
        run: ./target/ci/hell-ci custody-ops workflow-stage-current-scrub
      - name: Upload immutable candidate-scoped current scrub package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-current-scrub-source-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/current-scrub-package
          if-no-files-found: error
          retention-days: 45
      - name: Upload ephemeral independently retrieved copy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-custody-retrieved-${{ matrix.provider }}
          path: ci-out/custody/current
          if-no-files-found: error
          retention-days: 7
      - name: Save provider retrieval Cargo dependency cache
        if: ${{ always() && steps.retrieval-cargo-cache.outcome == 'success' && steps.retrieval-cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: custody-retrieval-cargo-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save provider retrieval Rust target cache
        if: ${{ always() && steps.retrieval-target-cache.outcome == 'success' && steps.retrieval-target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: custody-retrieval-target-v1-${{ matrix.provider }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/evidence-custody.yml') }}

  seal-current-scrubs:
    needs: retrieve
    if: ${{ github.ref == 'refs/heads/main' && needs.retrieve.result == 'success' }}
    permissions:
      actions: read
      contents: read
    outputs:
      primary_artifact_id: ${{ steps.upload-primary.outputs.artifact-id }}
      primary_artifact_digest: ${{ steps.upload-primary.outputs.artifact-digest }}
      primary_directory_sha256: ${{ steps.bind-primary.outputs.directory_sha256 }}
      secondary_artifact_id: ${{ steps.upload-secondary.outputs.artifact-id }}
      secondary_artifact_digest: ${{ steps.upload-secondary.outputs.artifact-digest }}
      secondary_directory_sha256: ${{ steps.bind-secondary.outputs.directory_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact trusted current scrub sealer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore current scrub sealer Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-current-scrub-sealer-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore current scrub sealer compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-current-scrub-sealer-target-${{ github.sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/evidence-custody.yml') }}
      - name: Build trusted current scrub sealer
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact trusted current scrub sealer HEAD
        env:
          TRUSTED_DRIVER_SHA: ${{ github.sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$TRUSTED_DRIVER_SHA"
      - name: Download exact current-run primary scrub package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
