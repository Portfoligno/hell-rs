name: Collection Custody Review

on:
  workflow_dispatch:
    inputs:
      preparation_sha:
        description: Exact main commit containing payload and signature but no review overlay
        required: true
        type: string
      reviewer:
        description: Exact role-qualified custody reviewer principal
        required: true
        type: string
      issued_at:
        description: Exact UTC review statement issuance time
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: collection-custody-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-unsigned-custody-review:
    name: Prepare unsigned collection custody review
    if: ${{ github.ref == 'refs/heads/main' && inputs.preparation_sha == github.sha }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.upload-preparation.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-preparation.outputs.artifact-digest }}
    steps:
      - name: Check out exact payload-only custody commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.preparation_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore custody preparation Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-prepare-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore custody preparation compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ci
            target/release
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-prepare-target-${{ inputs.preparation_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-custody-review.yml') }}
      - name: Build trusted custody preparation driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact payload-only checkout
        env:
          COLLECTION_PREPARATION_SHA: ${{ inputs.preparation_sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$COLLECTION_PREPARATION_SHA"
      - name: Build trusted collection process helper
        run: cargo build --locked --profile ci --package hell-testkit --bin hell-test-helper
      - name: Build current traced candidate
        run: cargo build --locked --release --package hell-cli --bin hell --features hell-cli/compat-tracing
      - name: Prepare deterministic unsigned custody review material
        env:
          COLLECTION_CUSTODY_ISSUED_AT: ${{ inputs.issued_at }}
          COLLECTION_CUSTODY_REVIEWER: ${{ inputs.reviewer }}
        run: ./target/ci/hell-ci collection-authority prepare-custody-review --package compat/collection-custody/payload --signature compat/collection-custody/signature --candidate-executable target/release/hell --reviewer "$COLLECTION_CUSTODY_REVIEWER" --issued-at "$COLLECTION_CUSTODY_ISSUED_AT" --output ci-out/collection-custody-review
      - name: Upload exact unsigned custody review material
        id: upload-preparation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-custody-review-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/collection-custody-review
          if-no-files-found: error
          retention-days: 1
      - name: Save custody preparation Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-prepare-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save custody preparation compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ci
            target/release
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-prepare-target-${{ inputs.preparation_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-custody-review.yml') }}

  sign-prepared-custody-review:
    name: Sign prepared collection custody review
    needs: prepare-unsigned-custody-review
    if: ${{ github.ref == 'refs/heads/main' && inputs.preparation_sha == github.sha }}
    permissions:
      actions: read
      contents: read
      id-token: write
    environment: collection-custody-review
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      overlay_artifact_id: ${{ steps.upload-overlay.outputs.artifact-id }}
      overlay_artifact_digest: ${{ steps.upload-overlay.outputs.artifact-digest }}
      overlay_directory_sha256: ${{ steps.bind-overlay.outputs.directory_sha256 }}
    steps:
      - name: Check out exact trusted review automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.preparation_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore custody signer Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-sign-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore custody signer compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-sign-target-${{ inputs.preparation_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-custody-review.yml') }}
      - name: Build trusted review signer
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact signer checkout before receiving bytes
        env:
          COLLECTION_PREPARATION_SHA: ${{ inputs.preparation_sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$COLLECTION_PREPARATION_SHA"
      - name: Download needs-linked unsigned custody review material
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare-unsigned-custody-review.outputs.artifact_id }}
          path: ci-in/collection-custody-review
      - name: Validate exact unsigned custody review inventory and roots
        run: ./target/ci/hell-ci collection-authority verify-custody-review-preparation --input ci-in/collection-custody-review
      - name: Install pinned Cosign after validation
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Load protected custody-review SSH key after validation
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CUSTODY_REVIEW_SSH_PRIVATE_KEY }}
      - name: Require protected custody-review SSH agent
        run: ssh-add -L
      - name: Sign exact prepared custody review payload
        run: ./target/ci/hell-ci review-sign --input ci-in/collection-custody-review/integration-review-payload.json --output ci-in/collection-custody-review-signed/integration-review.dsse.json --role custody-reviewer --decision accept --policy compat/reviews.allowed_signers
      - name: Verify exact signed custody review envelope
        run: ./target/ci/hell-ci review-verify --input ci-in/collection-custody-review-signed/integration-review.dsse.json --policy compat/reviews.allowed_signers --role custody-reviewer
      - name: Assemble exact commit-ready proof and review overlay
        run: ./target/ci/hell-ci collection-authority assemble-custody-review-overlay --input ci-in/collection-custody-review --integration-review ci-in/collection-custody-review-signed/integration-review.dsse.json --output ci-out/collection-custody-review-overlay
      - name: Bind canonical custody review overlay tree
        id: bind-overlay
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/collection-custody-review-overlay/tree
      - name: Upload exact commit-ready custody review overlay
        id: upload-overlay
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collection-custody-review-overlay-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/collection-custody-review-overlay/tree
          if-no-files-found: error
          retention-days: 14
      - name: Save custody signer Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-sign-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save custody signer compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: v2-${{ runner.os }}-${{ runner.arch }}-collection-custody-sign-target-${{ inputs.preparation_sha }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml') }}-${{ hashFiles('crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'spec/**', '.github/workflows/collection-custody-review.yml') }}
