name: Custody scrub and recovery

on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrub:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: primary-worm
            operation: scrub
            trust-domain: organization-primary
            environment: custody-primary-scrub
            runner-label: custody-primary-retrieval
            default-receipt-variable: ACTIVE_CUSTODY_PRIMARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_PRIMARY_RETRIEVAL_ROLE
            bucket-variable: CUSTODY_PRIMARY_BUCKET
            region-variable: CUSTODY_PRIMARY_REGION
          - provider: secondary-worm
            operation: scrub
            trust-domain: organization-secondary
            environment: custody-secondary-scrub
            runner-label: custody-secondary-retrieval
            default-receipt-variable: ACTIVE_CUSTODY_SECONDARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_SECONDARY_RETRIEVAL_ROLE
            bucket-variable: CUSTODY_SECONDARY_BUCKET
            region-variable: CUSTODY_SECONDARY_REGION
          - provider: primary-worm
            operation: recover
            trust-domain: organization-primary
            environment: custody-primary-scrub
            runner-label: custody-primary-retrieval
            default-receipt-variable: ACTIVE_CUSTODY_PRIMARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_PRIMARY_RETRIEVAL_ROLE
            bucket-variable: CUSTODY_PRIMARY_BUCKET
            region-variable: CUSTODY_PRIMARY_REGION
          - provider: secondary-worm
            operation: recover
            trust-domain: organization-secondary
            environment: custody-secondary-scrub
            runner-label: custody-secondary-retrieval
            default-receipt-variable: ACTIVE_CUSTODY_SECONDARY_UPLOAD_RECEIPT
            role-variable: CUSTODY_SECONDARY_RETRIEVAL_ROLE
            bucket-variable: CUSTODY_SECONDARY_BUCKET
            region-variable: CUSTODY_SECONDARY_REGION
    environment: ${{ matrix.environment }}
    runs-on:
      - self-hosted
      - ${{ matrix.runner-label }}
    timeout-minutes: 45
    steps:
      - name: Check out active promotion records
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Restore scrub Cargo dependency cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: custody-scrub-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore scrub Rust target cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: custody-scrub-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/custody-scrub.yml') }}
      - name: Build trusted assurance driver before acquiring provider credentials
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Configure independent scrub identity
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars[matrix.role-variable] }}
          aws-region: ${{ vars[matrix.region-variable] }}
      - name: Retrieve and revalidate active immutable copy
        if: ${{ matrix.operation == 'scrub' }}
        run: ./target/ci/hell-ci custody-ops workflow-scrub
      - name: Recover and revalidate active immutable copy
        if: ${{ matrix.operation == 'recover' }}
        run: ./target/ci/hell-ci custody-ops workflow-recover
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Load protected primary maintenance SSH key
        if: ${{ matrix.provider == 'primary-worm' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CUSTODY_PRIMARY_MAINTENANCE_SSH_PRIVATE_KEY }}
      - name: Load protected secondary maintenance SSH key
        if: ${{ matrix.provider == 'secondary-worm' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CUSTODY_SECONDARY_MAINTENANCE_SSH_PRIVATE_KEY }}
      - name: Prepare scrub or recovery signature packet
        run: ./target/ci/hell-ci custody-ops workflow-maintenance-packet
      - name: Sign scrub or recovery receipt
        run: ./target/ci/hell-ci review-sign --input ci-out/custody-maintenance-packet.json --output ci-out/custody-maintenance-receipt.dsse.json --role custody-provider --decision accept --policy compat/reviews.allowed_signers
      - name: Stage canonical current scrub package
        if: ${{ matrix.operation == 'scrub' }}
        run: ./target/ci/hell-ci custody-ops workflow-stage-current-scrub
      - name: Upload immutable current scrub package
        if: ${{ matrix.operation == 'scrub' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-current-scrub-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/current-scrub-package
          if-no-files-found: error
          retention-days: 45
      - name: Upload ephemeral scrub or recovery report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ephemeralEvidence-custody-${{ matrix.operation }}-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out
          if-no-files-found: error
          retention-days: 45
      - name: Save scrub Cargo dependency cache
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: custody-scrub-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save scrub Rust target cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci
          key: custody-scrub-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/custody-scrub.yml') }}
