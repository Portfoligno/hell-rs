name: Trusted regression dispatch shard

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      nightly_provider_context:
        required: true
        type: string
      nightly_run_id:
        required: true
        type: string
      shard_index:
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    if: ${{ github.event_name == 'workflow_run' && github.ref == 'refs/heads/main' && github.workflow_ref == 'Portfoligno/hell-rs/.github/workflows/regression-subject.yml@refs/heads/main' && github.event.workflow_run.head_branch == 'main' }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted current default-branch dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build trusted current automatic regression dispatcher
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Acquire exact scheduled nightly authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_PROVIDER_CONTEXT: ${{ inputs.nightly_provider_context }}
          REGRESSION_REQUIRED_WORKFLOW_PATH: .github/workflows/nightly.yml
        run: ./target/ci/hell-ci regression-import acquire-subject --output ci-in/nightly --artifact ci-out/nightly-selection
      - name: Recompute the complete shard and dispatch exact reviewed regressions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_AUTOMATION_CANDIDATE: ${{ inputs.candidate_sha }}
          REGRESSION_AUTOMATION_ISSUE: github-run:${{ inputs.nightly_run_id }}
          REGRESSION_AUTOMATION_RUN_ID: ${{ github.run_id }}
          REGRESSION_AUTOMATION_SHARD: ${{ inputs.shard_index }}
        run: ./target/ci/hell-ci regression-import dispatch-automatic-shard --program ci-in/nightly
