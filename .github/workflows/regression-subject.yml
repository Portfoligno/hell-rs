name: Unprivileged regression subject

on:
  workflow_run:
    workflows: [Nightly]
    types: [completed]
  workflow_dispatch:
    inputs:
      program_provider_context:
        description: Canonical JSON exact provider context for the program artifact
        required: true
        type: string
      evidence_provider_context:
        description: Canonical JSON exact provider context for finalized claim evidence and executables
        required: true
        type: string
      current_public_provider_context:
        description: Canonical JSON exact provider context for current signed public promotion state
        required: true
        type: string
      template_case_id:
        description: Exact reviewed committed case whose descriptor scopes execution
        required: true
        type: string
      generated_case_id:
        description: Exact scheduled generated mismatch case ID retained by nightly
        required: true
        type: string

permissions:
  contents: read

jobs:
  assemble:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted current regression subject automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build trusted regression subject driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Acquire exact immutable program artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_PROVIDER_CONTEXT: ${{ inputs.program_provider_context }}
          REGRESSION_REQUIRED_WORKFLOW_PATH: .github/workflows/nightly.yml
        run: ./target/ci/hell-ci regression-import acquire-subject --output ci-in/program --artifact ci-out/program-selection
      - name: Acquire exact immutable finalized evidence artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_PROVIDER_CONTEXT: ${{ inputs.evidence_provider_context }}
          REGRESSION_REQUIRED_WORKFLOW_PATH: .github/workflows/promotion-evidence-review.yml
        run: ./target/ci/hell-ci regression-import acquire-subject --output ci-in/evidence --artifact ci-out/evidence-selection
      - name: Acquire exact immutable current public promotion state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_PROVIDER_CONTEXT: ${{ inputs.current_public_provider_context }}
          REGRESSION_REQUIRED_WORKFLOW_PATH: .github/workflows/promotion-surveillance.yml
        run: ./target/ci/hell-ci regression-import acquire-subject --output ci-in/public --artifact ci-out/public-selection
      - name: Assemble exact unprivileged regression subject
        env:
          REGRESSION_GENERATED_CASE: ${{ inputs.generated_case_id }}
          REGRESSION_TEMPLATE_CASE: ${{ inputs.template_case_id }}
        run: ./target/ci/hell-ci regression-import assemble-generated-subject --program ci-in/program --input ci-in/evidence --proposal ci-in/public --findings ci-out/public-selection --expected "$REGRESSION_TEMPLATE_CASE" --issue "$REGRESSION_GENERATED_CASE" --artifact ci-out/program-selection --policy ci-out/evidence-selection --output ci-out/regression-subject
      - name: Upload immutable regression execution subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/regression-subject
          if-no-files-found: error
          retention-days: 30

  resolve-scheduled:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') }}
    permissions:
      actions: read
      contents: read
    outputs:
      evidence_provider_context: ${{ steps.evidence.outputs.evidence_provider_context }}
      generated_case_matrix_0: ${{ steps.nightly.outputs.generated_case_matrix_0 }}
      generated_case_matrix_1: ${{ steps.nightly.outputs.generated_case_matrix_1 }}
      generated_case_matrix_2: ${{ steps.nightly.outputs.generated_case_matrix_2 }}
      generated_case_matrix_3: ${{ steps.nightly.outputs.generated_case_matrix_3 }}
      nightly_provider_context: ${{ steps.nightly.outputs.nightly_provider_context }}
      public_provider_context: ${{ steps.public.outputs.public_provider_context }}
      ready_set_artifact_id: ${{ steps.ready-set-upload.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted current automatic source resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build trusted automatic regression source resolver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Resolve exact scheduled nightly mismatch artifact and inventory
        id: nightly
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_AUTOMATION_CANDIDATE: ${{ github.event.workflow_run.head_sha }}
          REGRESSION_AUTOMATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: ./target/ci/hell-ci regression-import resolve-automatic-source --role nightly --output ci-out/nightly-provider-context.json
      - name: Resolve latest exact finalized evidence for the scheduled candidate
        id: evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_AUTOMATION_CANDIDATE: ${{ github.event.workflow_run.head_sha }}
        run: ./target/ci/hell-ci regression-import resolve-automatic-source --role evidence --output ci-out/evidence-provider-context.json
      - name: Resolve latest exact signed public state for the scheduled candidate
        id: public
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_AUTOMATION_CANDIDATE: ${{ github.event.workflow_run.head_sha }}
        run: ./target/ci/hell-ci regression-import resolve-automatic-source --role public --output ci-out/public-provider-context.json
      - name: Upload exact automatic reviewed-regression ready set
        id: ready-set-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: automatic-regression-ready-set-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/automatic-regression-ready-set.json
          if-no-files-found: error
          retention-days: 90

  assemble-scheduled-0:
    needs: resolve-scheduled
    if: ${{ needs.resolve-scheduled.result == 'success' && needs.resolve-scheduled.outputs.generated_case_matrix_0 != '[]' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/regression-subject-shard.yml
    with:
      case_matrix: ${{ needs.resolve-scheduled.outputs.generated_case_matrix_0 }}
      evidence_provider_context: ${{ needs.resolve-scheduled.outputs.evidence_provider_context }}
      nightly_provider_context: ${{ needs.resolve-scheduled.outputs.nightly_provider_context }}
      public_provider_context: ${{ needs.resolve-scheduled.outputs.public_provider_context }}

  assemble-scheduled-1:
    needs: resolve-scheduled
    if: ${{ needs.resolve-scheduled.result == 'success' && needs.resolve-scheduled.outputs.generated_case_matrix_1 != '[]' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/regression-subject-shard.yml
    with:
      case_matrix: ${{ needs.resolve-scheduled.outputs.generated_case_matrix_1 }}
      evidence_provider_context: ${{ needs.resolve-scheduled.outputs.evidence_provider_context }}
      nightly_provider_context: ${{ needs.resolve-scheduled.outputs.nightly_provider_context }}
      public_provider_context: ${{ needs.resolve-scheduled.outputs.public_provider_context }}

  assemble-scheduled-2:
    needs: resolve-scheduled
    if: ${{ needs.resolve-scheduled.result == 'success' && needs.resolve-scheduled.outputs.generated_case_matrix_2 != '[]' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/regression-subject-shard.yml
    with:
      case_matrix: ${{ needs.resolve-scheduled.outputs.generated_case_matrix_2 }}
      evidence_provider_context: ${{ needs.resolve-scheduled.outputs.evidence_provider_context }}
      nightly_provider_context: ${{ needs.resolve-scheduled.outputs.nightly_provider_context }}
      public_provider_context: ${{ needs.resolve-scheduled.outputs.public_provider_context }}

  assemble-scheduled-3:
    needs: resolve-scheduled
    if: ${{ needs.resolve-scheduled.result == 'success' && needs.resolve-scheduled.outputs.generated_case_matrix_3 != '[]' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/regression-subject-shard.yml
    with:
      case_matrix: ${{ needs.resolve-scheduled.outputs.generated_case_matrix_3 }}
      evidence_provider_context: ${{ needs.resolve-scheduled.outputs.evidence_provider_context }}
      nightly_provider_context: ${{ needs.resolve-scheduled.outputs.nightly_provider_context }}
      public_provider_context: ${{ needs.resolve-scheduled.outputs.public_provider_context }}

  dispatch-scheduled-0:
    needs: [resolve-scheduled, assemble-scheduled-0]
    if: ${{ github.ref == 'refs/heads/main' && needs.assemble-scheduled-0.result == 'success' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/regression-dispatch-shard.yml
    with:
      candidate_sha: ${{ github.event.workflow_run.head_sha }}
      shard_index: '0'
      nightly_provider_context: ${{ needs.resolve-scheduled.outputs.nightly_provider_context }}
      nightly_run_id: ${{ github.event.workflow_run.id }}

  dispatch-scheduled-1:
    needs: [resolve-scheduled, assemble-scheduled-1]
    if: ${{ github.ref == 'refs/heads/main' && needs.assemble-scheduled-1.result == 'success' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/regression-dispatch-shard.yml
    with:
      candidate_sha: ${{ github.event.workflow_run.head_sha }}
      shard_index: '1'
      nightly_provider_context: ${{ needs.resolve-scheduled.outputs.nightly_provider_context }}
      nightly_run_id: ${{ github.event.workflow_run.id }}

  dispatch-scheduled-2:
    needs: [resolve-scheduled, assemble-scheduled-2]
    if: ${{ github.ref == 'refs/heads/main' && needs.assemble-scheduled-2.result == 'success' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/regression-dispatch-shard.yml
    with:
      candidate_sha: ${{ github.event.workflow_run.head_sha }}
      shard_index: '2'
      nightly_provider_context: ${{ needs.resolve-scheduled.outputs.nightly_provider_context }}
      nightly_run_id: ${{ github.event.workflow_run.id }}

  dispatch-scheduled-3:
    needs: [resolve-scheduled, assemble-scheduled-3]
    if: ${{ github.ref == 'refs/heads/main' && needs.assemble-scheduled-3.result == 'success' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/regression-dispatch-shard.yml
    with:
      candidate_sha: ${{ github.event.workflow_run.head_sha }}
      shard_index: '3'
      nightly_provider_context: ${{ needs.resolve-scheduled.outputs.nightly_provider_context }}
      nightly_run_id: ${{ github.event.workflow_run.id }}

  reconcile-scheduled-batch:
    needs: [resolve-scheduled, dispatch-scheduled-0, dispatch-scheduled-1, dispatch-scheduled-2, dispatch-scheduled-3]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.resolve-scheduled.result == 'success' && (needs.dispatch-scheduled-0.result == 'success' || needs.dispatch-scheduled-0.result == 'skipped') && (needs.dispatch-scheduled-1.result == 'success' || needs.dispatch-scheduled-1.result == 'skipped') && (needs.dispatch-scheduled-2.result == 'success' || needs.dispatch-scheduled-2.result == 'skipped') && (needs.dispatch-scheduled-3.result == 'success' || needs.dispatch-scheduled-3.result == 'skipped') && (needs.resolve-scheduled.outputs.generated_case_matrix_0 != '[]' || needs.resolve-scheduled.outputs.generated_case_matrix_1 != '[]' || needs.resolve-scheduled.outputs.generated_case_matrix_2 != '[]' || needs.resolve-scheduled.outputs.generated_case_matrix_3 != '[]') }}
    permissions:
      actions: read
      contents: read
    outputs:
      transaction_artifact_id: ${{ steps.transaction-upload.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out trusted current batch reconciler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Build trusted complete-set batch reconciler
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Download exact automatic ready-set authority
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.resolve-scheduled.outputs.ready_set_artifact_id }}
          path: ci-in/ready-set
      - name: Acquire and verify the exact scheduled nightly authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_PROVIDER_CONTEXT: ${{ needs.resolve-scheduled.outputs.nightly_provider_context }}
          REGRESSION_REQUIRED_WORKFLOW_PATH: .github/workflows/nightly.yml
        run: ./target/ci/hell-ci regression-import acquire-historical-subject --output ci-in/program --artifact ci-out/program-selection
      - name: Reconcile the complete immutable reviewed artifact set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci regression-import reconcile-automatic-batch --input ci-in/ready-set/automatic-regression-ready-set.json --program ci-in/program --artifact ci-out/program-selection --to ci-out/regression-batch
      - name: Upload exact complete-set integration transaction
        id: transaction-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-batch-transaction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/regression-batch
          if-no-files-found: error
          retention-days: 90

  integrate-scheduled-batch:
    needs: reconcile-scheduled-batch
    if: ${{ github.ref == 'refs/heads/main' && needs.reconcile-scheduled-batch.result == 'success' }}
    permissions:
      actions: read
      contents: write
    environment: compatibility-regression-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out trusted current batch integrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - name: Build trusted offline complete-set integrator
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Download exact complete-set integration transaction
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ needs.reconcile-scheduled-batch.outputs.transaction_artifact_id }}
          path: ci-in/regression-batch
      - name: Configure protected batch commit authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Reconcile, commit, and push the complete set against exact current main
        run: ./target/ci/hell-ci regression-import integrate-batch-current-main --input ci-in/regression-batch --output ci-out/regression-batch-result.json
      - name: Upload durable per-case batch reconciliation result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regression-batch-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-out/regression-batch-result.json
          if-no-files-found: error
          retention-days: 90
