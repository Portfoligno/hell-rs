name: Regression subject
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Revalidate exact pushed subject
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
