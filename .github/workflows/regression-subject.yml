name: Regression subject
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Revalidate exact pushed subject
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out exact pushed subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: '1'
          persist-credentials: 'false'
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: regression-subject-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: regression-subject-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'deny.toml', 'release-policy.toml', 'spec/**', '.github/**') }}
      - name: Build CI driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Restore pinned MemCordon downloads
        id: memcordon-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ci-tool-cache/memcordon-downloads-v1
          key: memcordon-v1-linux-x86-64-${{ hashFiles('ci/memcordon-runtime-v1.toml', 'ci/memcordon-tasks-v1.toml') }}
      - name: Acquire pinned MemCordon runtime
        run: ./target/ci/hell-ci memcordon acquire --task ci/memcordon-tasks-v1.toml --operation regression-subject
      - name: Install and qualify MemCordon provider
        run: ./target/ci/hell-ci memcordon prepare --task ci/memcordon-tasks-v1.toml --operation regression-subject
      - name: Run MemCordon adoption canary
        run: ./target/ci/hell-ci memcordon canary --task ci/memcordon-tasks-v1.toml --operation regression-subject
      - name: Revalidate regression subject as one sealed root
        run: ./target/ci/hell-ci memcordon execute --task ci/memcordon-tasks-v1.toml --operation regression-subject
      - name: Retire MemCordon provider
        if: ${{ always() }}
        run: ./target/ci/hell-ci memcordon cleanup --task ci/memcordon-tasks-v1.toml --operation regression-subject
      - name: Finalize MemCordon evidence
        if: ${{ always() }}
        run: ./target/ci/hell-ci memcordon finalize --task ci/memcordon-tasks-v1.toml --operation regression-subject --candidate-commit ${{ github.sha }} --workflow-commit ${{ github.workflow_sha }}
      - name: Upload MemCordon evidence
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regression-subject-memcordon-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-out/memcordon
          if-no-files-found: error
          retention-days: '30'
      - name: Save verified MemCordon downloads
        if: ${{ always() && steps.memcordon-cache.outcome == 'success' && steps.memcordon-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ci-tool-cache/memcordon-downloads-v1
          key: memcordon-v1-linux-x86-64-${{ hashFiles('ci/memcordon-runtime-v1.toml', 'ci/memcordon-tasks-v1.toml') }}
      - name: Save Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: regression-subject-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: target
          key: regression-subject-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'builtins/**', 'compat/**', 'fixtures/**', 'baseline.toml', 'deny.toml', 'release-policy.toml', 'spec/**', '.github/**') }}
