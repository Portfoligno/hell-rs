name: Regression subject

on:
  push:
    branches: ['**']
    tags-ignore: ['**']

permissions:
  contents: read

jobs:
  validate:
    name: Revalidate exact pushed subject
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact pushed subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: regression-subject-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore compilation cache
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: regression-subject-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/regression-corpus.tsv', 'fixtures/**', '.github/workflows/regression-subject.yml') }}
      - name: Run typed corpus tests
        run: cargo test --locked --package hell-testkit --test typed_corpus
      - name: Run CLI oracle regressions
        run: cargo test --locked --package hell-cli --test oracle_regressions
      - name: Save Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: regression-subject-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save compilation cache
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: regression-subject-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/regression-corpus.tsv', 'fixtures/**', '.github/workflows/regression-subject.yml') }}
