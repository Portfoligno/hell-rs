name: Promotion proposal assembly

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        type: string
        required: true
      evidence_run_id:
        type: string
        required: true
      evidence_run_attempt:
        type: string
        required: true
      evidence_artifact_id:
        type: string
        required: true
      evidence_package_sha256:
        type: string
        required: true
      evidence_provider_archive_sha256:
        type: string
        required: true
      merged_manifest_sha256:
        type: string
        required: true
      review_package_run_id:
        type: string
        required: true
      review_package_run_attempt:
        type: string
        required: true
      review_package_artifact_id:
        type: string
        required: true
      review_package_sha256:
        type: string
        required: true
      review_provider_archive_sha256:
        type: string
        required: true
      custody_run_id:
        type: string
        required: true
      custody_run_attempt:
        type: string
        required: true
      custody_artifact_id:
        type: string
        required: true
      custody_package_sha256:
        type: string
        required: true
      custody_provider_archive_sha256:
        type: string
        required: true
      primary_scrub_run_id:
        type: string
        required: true
      primary_scrub_run_attempt:
        type: string
        required: true
      primary_scrub_artifact_id:
        type: string
        required: true
      primary_scrub_digests:
        description: Canonical JSON with packageSha256 and providerArchiveSha256
        type: string
        required: true
      secondary_scrub_run_id:
        type: string
        required: true
      secondary_scrub_run_attempt:
        type: string
        required: true
      secondary_scrub_artifact_id:
        type: string
        required: true
      secondary_scrub_digests:
        description: Canonical JSON with packageSha256 and providerArchiveSha256
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  assemble:
    outputs:
      proposal_artifact_id: ${{ steps.upload-proposal.outputs.artifact-id }}
      proposal_artifact_digest: ${{ steps.upload-proposal.outputs.artifact-digest }}
      proposal_directory_sha256: ${{ steps.bind-proposal.outputs.directory_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Restore Cargo downloads
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: proposal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Restore proposal driver
        id: target-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: proposal-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-proposal.yml') }}
      - name: Download immutable evidence package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}
          artifact-ids: ${{ inputs.evidence_artifact_id }}
          path: ci-out/native-shards
      - name: Download immutable review-ready evidence package
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.review_package_run_id }}
          artifact-ids: ${{ inputs.review_package_artifact_id }}
          path: ci-out/native-shards/evidence
      - name: Download immutable custody receipts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.custody_run_id }}
          artifact-ids: ${{ inputs.custody_artifact_id }}
          path: ci-out/native-shards/evidence/custody
      - name: Download immutable primary current scrub
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.primary_scrub_run_id }}
          artifact-ids: ${{ inputs.primary_scrub_artifact_id }}
          path: ci-out/native-shards/evidence/custody/current-scrub/primary-worm
      - name: Download immutable secondary current scrub
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.secondary_scrub_run_id }}
          artifact-ids: ${{ inputs.secondary_scrub_artifact_id }}
          path: ci-out/native-shards/evidence/custody/current-scrub/secondary-worm
      - name: Build proposal driver
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Verify exact proposal candidate checkout
        env:
          PROMOTION_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: ./target/ci/hell-ci collection-authority verify-checkout --input . --candidate-commit "$PROMOTION_CANDIDATE_SHA"
      - name: Install pinned active-review verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Recompute assurance epoch
        run: ./target/ci/hell-ci evidence-epoch write --output ci-out/native-shards/assurance-epoch.json
      - name: Assemble fail-closed proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./target/ci/hell-ci promotion-proposal --input ci-out/native-shards --output ci-out/native-shards/promotion-proposal.json --github-dispatch-inputs
      - name: Bind exact proposal package directory
        id: bind-proposal
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/native-shards
      - name: Upload immutable proposal package
        id: upload-proposal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-proposal
          path: ci-out/native-shards
          if-no-files-found: error
          retention-days: 30
      - name: Save Cargo downloads
        if: ${{ always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: proposal-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
      - name: Save proposal driver
        if: ${{ always() && steps.target-cache.outcome == 'success' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: proposal-${{ runner.os }}-${{ runner.arch }}-target-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '**/build.rs', '.cargo/**', 'crates/**/*.rs', 'compat/**', '.github/workflows/promotion-proposal.yml') }}
