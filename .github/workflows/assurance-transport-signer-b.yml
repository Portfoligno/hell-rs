name: Assurance transport signer B

on:
  workflow_call:
    inputs:
      packet_artifact_id:
        type: string
        required: true
      packet_directory_sha256:
        type: string
        required: true
      parent_run_attempt:
        type: string
        required: true
      parent_run_id:
        type: string
        required: true
      subject_artifact_id:
        type: string
        required: true
      subject_directory_sha256:
        type: string
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.sign.outputs.artifact_id }}
      directory_sha256:
        value: ${{ jobs.sign.outputs.directory_sha256 }}

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  sign:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.workflow_ref == 'Portfoligno/hell-rs/.github/workflows/assurance-transport-readiness.yml@refs/heads/main' }}
    environment: compatibility-transport-probe-b
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      directory_sha256: ${{ steps.digest.outputs.directory_sha256 }}
    steps:
      - name: Check out trusted current isolated signer B
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build signer B verifier before credentials
        run: cargo build --locked --profile ci --package hell-ci --bin hell-ci
      - name: Download exact unprivileged packet artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ inputs.packet_artifact_id }}
          path: ci-in/transport-packets
      - name: Replay packet artifact API, ZIP, tree, and workflow before credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_PROVIDER_ARTIFACT_ID: ${{ inputs.packet_artifact_id }}
          REGRESSION_PROVIDER_ARTIFACT_NAME: assurance-transport-readiness-packets-${{ inputs.parent_run_id }}-${{ inputs.parent_run_attempt }}
          REGRESSION_PROVIDER_DIRECTORY_SHA256: ${{ inputs.packet_directory_sha256 }}
          REGRESSION_PROVIDER_EVENT: workflow_dispatch
          REGRESSION_PROVIDER_HEAD_SHA: ${{ github.sha }}
          REGRESSION_PROVIDER_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
          REGRESSION_PROVIDER_RUN_ID: ${{ inputs.parent_run_id }}
          REGRESSION_PROVIDER_WORKFLOW_PATH: .github/workflows/assurance-transport-readiness.yml
        run: ./target/ci/hell-ci regression-import select-subject --input ci-in/transport-packets --output ci-out/packet-selection
      - name: Download original isolated subject by immutable artifact ID
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ inputs.subject_artifact_id }}
          path: ci-in/transport-subject
      - name: Replay original subject API, ZIP, tree, and workflow before credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGRESSION_PROVIDER_ARTIFACT_ID: ${{ inputs.subject_artifact_id }}
          REGRESSION_PROVIDER_ARTIFACT_NAME: assurance-transport-readiness-subject-${{ inputs.parent_run_id }}-${{ inputs.parent_run_attempt }}
          REGRESSION_PROVIDER_DIRECTORY_SHA256: ${{ inputs.subject_directory_sha256 }}
          REGRESSION_PROVIDER_EVENT: workflow_dispatch
          REGRESSION_PROVIDER_HEAD_SHA: ${{ github.sha }}
          REGRESSION_PROVIDER_RUN_ATTEMPT: ${{ inputs.parent_run_attempt }}
          REGRESSION_PROVIDER_RUN_ID: ${{ inputs.parent_run_id }}
          REGRESSION_PROVIDER_WORKFLOW_PATH: .github/workflows/assurance-transport-readiness.yml
        run: ./target/ci/hell-ci regression-import select-subject --input ci-in/transport-subject --output ci-out/subject-selection
      - name: Rejoin packet B context to original subject provider before credentials
        run: ./target/ci/hell-ci auth-transport-probe context-verify --input ci-in/transport-packets/context.json --program ci-in/transport-subject --from ci-in/transport-packets/subject-selection
      - name: Install pinned Sigstore signer B
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Load dedicated protected SSH probe key B
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.TRANSPORT_PROBE_B_SSH_PRIVATE_KEY }}
          log-public-key: false
      - name: Sign isolated probe packet B with SSH, OIDC, and Rekor
        env:
          HELL_REVIEWER_ID: assurance-transport-probe-b:probe-b
          HELL_SIGSTORE_IDENTITY: https://github.com/Portfoligno/hell-rs/.github/workflows/assurance-transport-signer-b.yml@refs/heads/main
        run: ./target/ci/hell-ci auth-transport-probe sign --input ci-in/transport-packets/packet-b.json --output ci-out/transport-envelope-b/envelope.json --role assurance-transport-probe-b --policy compat/transport-probe/b/allowed_signers
      - name: Retain exact packet artifact used by signer B
        run: cp -R ci-in/transport-packets ci-out/transport-envelope-b/packet-artifact
      - name: Retain exact packet provider selection used by signer B
        run: cp -R ci-out/packet-selection ci-out/transport-envelope-b/packet-selection
      - name: Retain signer B subject provider selection
        run: cp -R ci-out/subject-selection ci-out/transport-envelope-b/subject-selection
      - name: Bind signer B output tree
        id: digest
        run: ./target/ci/hell-ci regression-import emit-directory-output --input ci-out/transport-envelope-b
      - name: Upload non-production signer B envelope
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assurance-transport-readiness-envelope-b-${{ inputs.parent_run_id }}-${{ inputs.parent_run_attempt }}
          path: ci-out/transport-envelope-b
          if-no-files-found: error
          retention-days: 14
