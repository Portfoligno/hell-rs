runner = "windows-2025"
timeout-minutes = 180
permission = "read"
artifact-output = "readiness-windows"
command = "readiness-windows"

[job.ci.verify]
needs = ["plan", "linux", "macos", "windows"]
runner = "ubuntu-24.04"
timeout-minutes = 30
permission = "read"
artifact-output = "readiness-verification"
