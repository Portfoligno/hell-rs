[job.release.final-verify]
needs = ["resolve", "assemble", "governance"]
runner = "ubuntu-24.04"
timeout-minutes = 60
permission = "read"
artifact-output = "verified-release"
command = "release-final-verify"

[job.release.attest]
needs = ["resolve", "final-verify"]
runner = "ubuntu-24.04"
timeout-minutes = 30
permission = "attest"
artifact-output = "attested-release"
command = "release-stage-attestations"

[job.release.publish]
needs = ["resolve", "governance", "attest"]
runner = "ubuntu-24.04"
timeout-minutes = 30
permission = "publish"
artifact-output = "release-publication-reports"
command = "release-publish"

