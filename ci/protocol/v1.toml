schema-version = 1
protocol-id = "hell-rs-ci-v1"
release-admission-protocol = "release-admission-v1"
merge-queue = false
action-metadata = "ci/actions/metadata-v1.json"

[readiness-summary]
jobs = ["plan", "linux", "macos", "windows", "verify"]

[readiness-summary.artifact.plan]
artifact-id-output = "$output:plan.artifact.artifact-id"
artifact-digest-output = "$output:plan.artifact.artifact-digest"
input-path = "plan"

[readiness-summary.artifact.linux]
platform-id = "linux-x86_64"
artifact-id-output = "$output:linux.artifact.artifact-id"
artifact-digest-output = "$output:linux.artifact.artifact-digest"
input-path = "platforms/linux-x86_64"

[readiness-summary.artifact.macos]
platform-id = "macos-aarch64"
artifact-id-output = "$output:macos.artifact.artifact-id"
artifact-digest-output = "$output:macos.artifact.artifact-digest"
input-path = "platforms/macos-aarch64"

[readiness-summary.artifact.windows]
platform-id = "windows-x86_64"
artifact-id-output = "$output:windows.artifact.artifact-id"
artifact-digest-output = "$output:windows.artifact.artifact-digest"
input-path = "platforms/windows-x86_64"

[readiness-summary.artifact.verify]
artifact-id-output = "$output:verify.artifact.artifact-id"
artifact-digest-output = "$output:verify.artifact.artifact-digest"
input-path = "verifier"

[action.checkout]
repository = "actions/checkout"
ref = "3d3c42e5aac5ba805825da76410c181273ba90b1"
inputs = ["fetch-depth", "path", "persist-credentials", "ref", "repository"]
outputs = []

[action.cache-restore]
repository = "actions/cache/restore"
ref = "55cc8345863c7cc4c66a329aec7e433d2d1c52a9"
inputs = ["fail-on-cache-miss", "key", "lookup-only", "path", "restore-keys"]
outputs = ["cache-hit", "cache-matched-key"]

[action.cache-save]
repository = "actions/cache/save"
ref = "55cc8345863c7cc4c66a329aec7e433d2d1c52a9"
inputs = ["key", "path"]
outputs = ["cache-id"]

[action.upload-artifact]
repository = "actions/upload-artifact"
ref = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
inputs = ["compression-level", "if-no-files-found", "include-hidden-files", "name", "overwrite", "path", "retention-days"]
outputs = ["artifact-digest", "artifact-id", "artifact-url"]

[action.download-artifact]
repository = "actions/download-artifact"
ref = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
inputs = ["artifact-ids", "digest-mismatch", "github-token", "merge-multiple", "name", "path", "pattern", "repository", "run-id"]
outputs = ["download-path"]

[action.haskell-setup]
repository = "haskell-actions/setup"
ref = "6037f33647c3f17758a2356c80fc4a53d7e0685d"
inputs = ["cabal-update", "cabal-version", "enable-stack", "ghc-version", "stack-no-global", "stack-version"]
outputs = ["cabal-store", "ghc-exe", "ghc-version", "stack-root"]

[action.attest]
repository = "actions/attest"
ref = "508db95dd578ae2727ebd6217d5ba78e4fbda05d"
inputs = ["predicate-path", "predicate-type", "subject-checksums", "subject-path"]
outputs = ["attestation-id", "attestation-url", "bundle-path"]

[permission.read]
actions = "read"
contents = "read"
id-token = "none"
attestations = "none"
artifact-metadata = "none"

[permission.contents-read]
actions = "none"
contents = "read"
id-token = "none"
attestations = "none"
artifact-metadata = "none"

[permission.attest]
actions = "read"
contents = "read"
id-token = "write"
attestations = "write"
artifact-metadata = "write"

[permission.publish]
actions = "read"
contents = "write"
id-token = "none"
attestations = "none"
artifact-metadata = "none"

[workflow.ci]
path = ".github/workflows/ci.yml"
name = "CI"
jobs = ["plan", "linux", "macos", "windows", "verify", "summary"]

[workflow.ci.trigger]
push-branches = true
pull-request = true
workflow-dispatch = false
push-tags = false
merge-group = "conditional"

[workflow.ci.concurrency]
group = "ci-${{ github.workflow }}-${{ github.ref }}"
cancel-in-progress = true

[workflow.nightly]
path = ".github/workflows/nightly.yml"
name = "Nightly"
jobs = ["linux", "fuzz", "macos", "windows"]

[workflow.nightly.trigger]
push-branches = true
pull-request = false
workflow-dispatch = false
push-tags = false
merge-group = "never"

[workflow.nightly.concurrency]
group = "nightly-${{ github.workflow }}-${{ github.ref }}"
cancel-in-progress = true

[workflow.mutation]
path = ".github/workflows/mutation.yml"
name = "Exploratory mutation"
jobs = ["mutation"]

[workflow.mutation.trigger]
push-branches = true
pull-request = false
workflow-dispatch = false
push-tags = false
merge-group = "never"

[workflow.mutation.concurrency]
group = "mutation-${{ github.workflow }}-${{ github.ref }}"
cancel-in-progress = true

[workflow.regression-corpus]
path = ".github/workflows/regression-corpus.yml"
name = "Regression corpus"
jobs = ["validate"]

[workflow.regression-corpus.trigger]
push-branches = true
pull-request = false
workflow-dispatch = false
push-tags = false
merge-group = "never"
paths = ["compat/regression-corpus.tsv", "crates/hell-testkit/**", "crates/hell-cli/tests/**", ".github/workflows/regression-corpus.yml"]

[workflow.regression-corpus.concurrency]
group = "${{ github.workflow }}-${{ github.ref }}"
cancel-in-progress = true

[workflow.regression-subject]
path = ".github/workflows/regression-subject.yml"
name = "Regression subject"
jobs = ["validate"]

[workflow.regression-subject.trigger]
push-branches = true
pull-request = false
workflow-dispatch = false
push-tags = false
merge-group = "never"

[workflow.regression-subject.concurrency]
group = "${{ github.workflow }}-${{ github.ref }}"
cancel-in-progress = true

[workflow.release]
path = ".github/workflows/release.yml"
name = "Release"
jobs = ["resolve", "linux", "macos", "windows", "assemble", "governance", "final-verify", "attest", "publish"]

[workflow.release.trigger]
push-branches = false
pull-request = false
workflow-dispatch = true
push-tags = false
merge-group = "never"

[workflow.release.dispatch-input.candidate_branch]
description = "Same-repository branch to resolve and release"
required = true
type = "string"

[workflow.release.concurrency]
group = "release-${{ github.repository }}"
cancel-in-progress = false

[job.ci.plan]
needs = []
runner = "ubuntu-24.04"
timeout-minutes = 30
permission = "read"
artifact-output = "readiness-plan"
command = "readiness-plan"

[job.ci.linux]
needs = ["plan"]
runner = "ubuntu-24.04"
timeout-minutes = 180
permission = "read"
artifact-output = "readiness-linux"
command = "readiness-linux"

[job.ci.macos]
needs = ["plan"]
runner = "macos-15"
timeout-minutes = 180
permission = "read"
artifact-output = "readiness-macos"
command = "readiness-macos"

[job.ci.windows]
