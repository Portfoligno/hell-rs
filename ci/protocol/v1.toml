runner = "ubuntu-24.04"
timeout-minutes = 30
permission = "read"
artifact-output = "readiness-summary"
command = "readiness-summarize"

[job.nightly.linux]
needs = []
runner = "ubuntu-24.04"
timeout-minutes = 120
permission = "contents-read"
artifact-output = "nightly-linux"
command = "nightly-linux-current"

[job.nightly.fuzz]
needs = []
runner = "ubuntu-24.04"
timeout-minutes = 90
permission = "contents-read"
artifact-output = "fuzz-results"
command = "fuzz-smoke"

[job.nightly.macos]
needs = []
runner = "macos-15"
timeout-minutes = 60
permission = "contents-read"
artifact-output = "nightly-macos"
command = "nightly-macos"

[job.nightly.windows]
needs = []
runner = "windows-2025"
timeout-minutes = 60
permission = "contents-read"
artifact-output = "nightly-windows"
command = "nightly-windows"

[job.mutation.mutation]
needs = []
runner = "ubuntu-24.04"
timeout-minutes = 90
permission = "contents-read"
artifact-output = "mutation-report"
command = "mutation-assurance"

[job.regression-corpus.validate]
needs = []
runner = "ubuntu-24.04"
timeout-minutes = 30
permission = "contents-read"
artifact-output = "none"
command = "regression-corpus"

[job.regression-subject.validate]
needs = []
runner = "ubuntu-24.04"
timeout-minutes = 30
permission = "contents-read"
artifact-output = "none"
command = "regression-subject"

[job.release.resolve]
needs = []
runner = "ubuntu-24.04"
timeout-minutes = 20
permission = "read"
artifact-output = "release-plan"
command = "release-plan"

[job.release.linux]
needs = ["resolve"]
runner = "ubuntu-24.04"
timeout-minutes = 180
permission = "read"
artifact-output = "release-linux"
command = "release-linux"

[job.release.macos]
needs = ["resolve"]
runner = "macos-15"
timeout-minutes = 180
permission = "read"
artifact-output = "release-macos"
command = "release-macos"

[job.release.windows]
needs = ["resolve"]
runner = "windows-2025"
timeout-minutes = 180
permission = "read"
artifact-output = "release-windows"
command = "release-windows"

[job.release.assemble]
needs = ["resolve", "linux", "macos", "windows"]
runner = "ubuntu-24.04"
timeout-minutes = 90
permission = "read"
artifact-output = "assembled-release"
command = "release-assemble"

[job.release.governance]
needs = ["resolve", "linux", "macos", "windows", "assemble"]
runner = "ubuntu-24.04"
timeout-minutes = 90
permission = "read"
artifact-output = "release-governance"
vector-artifact-output = "release-protocol-vectors"
