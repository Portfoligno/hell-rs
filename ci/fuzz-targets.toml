source = "crates/hell-ci/fuzz/fuzz_targets/normalizer_replay.rs"
maximum-input-bytes = 4194304
maximum-depth = 64
maximum-records = 65536
timeout-seconds = 10
engine-arguments = ["-runs=64", "-timeout=10", "-max_len=4194304", "-artifact_prefix=ci-out/fuzz-artifacts/normalizer_replay/"]
corpus = "crates/hell-ci/fuzz/corpus/normalizer_replay"
artifact-directory = "ci-out/fuzz-artifacts/normalizer_replay"
invariant = "normalizer-replay-no-panic"

[[target]]
id = "semantic_trace"
implementation = "primary"
class = "retained-semantic-regression"
fuzz-directory = "crates/hell-ci/fuzz"
cargo-target = "semantic_trace"
source = "crates/hell-ci/fuzz/fuzz_targets/semantic_trace.rs"
maximum-input-bytes = 16777216
maximum-depth = 64
maximum-records = 262144
timeout-seconds = 10
engine-arguments = ["-runs=64", "-timeout=10", "-max_len=16777216", "-artifact_prefix=ci-out/fuzz-artifacts/semantic_trace/"]
corpus = "crates/hell-ci/fuzz/corpus/semantic_trace"
artifact-directory = "ci-out/fuzz-artifacts/semantic_trace"
invariant = "semantic-trace-no-panic"
