[package]
name = "hell-memcordon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
hell-digest = { version = "0.1.0", path = "../hell-digest" }
memcordon-core = "=0.5.2-rc.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27.1", default-features = false, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
same-file = "=1.0.6"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
