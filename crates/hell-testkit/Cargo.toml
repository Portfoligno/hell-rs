[package]
name = "hell-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
compat-tracing = ["hell-compiler/compat-tracing"]
mutation-testing = []

[dependencies]
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
hell-builtins = { version = "0.1.0", path = "../hell-builtins" }
hell-digest = { version = "0.1.0", path = "../hell-digest" }
hell-platform = { version = "0.1.0", path = "../hell-platform" }
tar = "0.4.44"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
hell-compiler = { version = "0.1.0", path = "../hell-compiler" }
hell-runtime = { version = "0.1.0", path = "../hell-runtime", features = ["compat-tracing"] }
hell-source = { version = "0.1.0", path = "../hell-source" }
hell-syntax = { version = "0.1.0", path = "../hell-syntax" }

[lints]
workspace = true
