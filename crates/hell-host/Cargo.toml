[package]
name = "hell-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
command-group = { version = "5.0.1", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27.1", default-features = false, features = ["user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell"] }

[lints]
workspace = true
