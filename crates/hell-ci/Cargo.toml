[package]
name = "hell-ci"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
mutation-testing = []

[lib]
name = "hell_ci"
path = "src/lib.rs"

[[bin]]
name = "hell-ci"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
hell-builtins = { version = "0.1.0", path = "../hell-builtins" }
hell-compiler = { version = "0.1.0", path = "../hell-compiler" }
hell-docgen = { version = "0.1.0", path = "../hell-docgen" }
hell-digest = { version = "0.1.0", path = "../hell-digest" }
hell-runtime = { version = "0.1.0", path = "../hell-runtime" }
hell-source = { version = "0.1.0", path = "../hell-source" }
hell-syntax = { version = "0.1.0", path = "../hell-syntax" }
hell-testkit = { version = "0.1.0", path = "../hell-testkit" }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
syn = { version = "2.0.106", features = ["full", "visit"] }
tar = "0.4.44"
ureq = { version = "3.1.2", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27.1", default-features = false, features = ["fs", "poll", "process"] }

[target.'cfg(windows)'.dependencies]
abistr = "=0.2.0-rc3"
firehazard = "=0.0.0-2022-09-10"
getrandom = "=0.2.17"
widestring = "=1.2.1"
same-file = "=1.0.6"
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1.0.145"

[lints]
workspace = true
