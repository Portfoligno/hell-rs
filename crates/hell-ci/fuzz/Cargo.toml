[package]
name = "hell-ci-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[package.metadata.assurance]
cargo-fuzz-version = "0.13.2"
cargo-fuzz-toolchain = "nightly-2026-07-31"

[dependencies]
libfuzzer-sys = "0.4"
hell-builtins = { path = "../../hell-builtins" }
hell-ci = { path = ".." }
hell-digest = { path = "../../hell-digest" }
hell-testkit = { path = "../../hell-testkit", features = ["compat-tracing"] }

[[bin]]
name = "claim_toml"
path = "fuzz_targets/claim_toml.rs"
test = false
doc = false
bench = false

